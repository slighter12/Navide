name: G3 Diag2 Windows (not evidence)

# DRAFT (diag2). Evaluation only. A SECOND SHORT DIAGNOSTIC on the real Windows x64 runner image (windows-2025), built from the rh18 rehearsal draft. It is NOT evidence, it is NOT a rehearsal and it does
# not count against the rehearsal cap (D11): it runs no cost run, no matrix, no calibration chain and no measurement. It runs what has never run on Windows: F0 and one whole shell attempt per arm.
# TRIGGER: a push of eval/agent-cli-runtime-windows-diag-r2. The tip of that branch is the freeze head plus this one file.
# STAGE H5 FILLS, before this file is committed to the workflows directory of the branch: H5_FILL_PACK_COMMIT, H5_FILL_PACK_DIGEST.
# The pack is the rh18 pack, the one rehearsal 5 will run. The identity step is the registered one with this file's own name: the commit is the freeze head plus exactly this workflow file.
# STEPS, copied block for block from the rehearsal draft, in its order: checkouts, head check, pack digest and overlay, pins, identity, toolchains, install, the ps shim, the sidecar build, the packaged
# build, Smoke, the ConPTY probe; then `Build F0`, also the rehearsal's own block. Not copied: the quiet gate, every test step (proof, Rust tests, G2 pytest, principal, correctness, bind) and the cost run.
# DIAG STEPS. `image` records the runner image version and the inbox console's file version (rh17 review N-6). `tools` writes three files that are in no branch and no pack: a launcher, a report tool
# and one test file. Then one shell attempt per arm, the Python arm and then the Rust arm, each its own step: `diag2_attempt_run.py` asks the pack's own `hosted_driver` for the rehearsal's cost plan, takes
# its `calibrate-shell` step (its environment, its argv), puts the diag test file in the place of the matrix file and runs that ONE step through the pack's plan runner. The test file calls the pack's
# `g3ShellAttempt.runAttempt` once: a discarded warm-up, cell 1, the attempt's root kept when it did not pass. Both attempt steps run whatever Smoke and the probe did, as long as F0, the sidecar build
# and the tools exist; each begins with the cost step's own ps-shim guard. `verdicts` then writes one verdict per check of each attempt (every phase, the ledger rules, `delta - accepted - L` per peer).
# UPLOADED per attempt: the receipt (its latency arrays as lengths, but for the 20 report-only resize probes) and its failure text, every phase outcome, the redacted tail of the driver's output and of the
# step log, the ledger records, per peer `delta - accepted - L`, `logFile.size` and `resize_ack_ms`, and from a kept root the peer receipts, the redacted backend log tails, the peer logs and peer bytes.
# The resource samples and the full latency arrays stay on the runner. Every step after install is `continue-on-error` with an id; the last step, after the upload, fails the job when a decisive step did
# not succeed. The JavaScript runtime is plain default Bun; the pinned actions are the rehearsal draft's.

on:
  push:
    branches:
      - eval/agent-cli-runtime-windows-diag-r2

permissions:
  contents: read

env:
  FREEZE_H: 202084cf74eccb07bec366897ebf4c588799e72e
  PACK_COMMIT: "170a30c0f4cab4377c316a3b7783bc646837b815"
  PACK_DIGEST: "39728c51e0e6fc896a402d6d2dc886a703d052d0133fd0c27ab1d75156cfcb3a"

jobs:
  diag:
    name: diag2-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025
            system: Windows
    defaults:
      run:
        shell: bash
    env:
      G3H_OS: ${{ matrix.system }}
    steps:
      - name: Pin line endings before any checkout
        run: git config --global core.autocrlf false

      - name: Check out evaluation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the harness pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACK_COMMIT }}
          path: pack
          persist-credentials: false

      - name: Check the run head and the checked-out bytes
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git config --get core.autocrlf)" = "false"
          test -z "$(git status --porcelain -- . ':(exclude)pack')"

      - name: Verify the pack digest, then overlay it
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" pack/backend/tests/cli_regression/support/g3/hosted_pack.py digest pack > "$RUNNER_TEMP/pack-digest.txt"
          cat "$RUNNER_TEMP/pack-digest.txt"
          grep -q -F "$PACK_DIGEST" "$RUNNER_TEMP/pack-digest.txt"
          tar -C pack --exclude=.git -cf - . | tar -C . -xf -

      - name: Verify the g1e pins and the hosted inputs (first step after the overlay)
        id: pins
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" -B backend/tests/cli_regression/support/g3/hosted_preflight.py "$PWD"

      - name: Product identity against the freeze head (rf4c D7)
        id: identity
        run: |
          git cat-file -e "$FREEZE_H^{commit}"
          git diff --exit-code "$FREEZE_H" -- native src backend/agent_team_backend
          test -z "$(git status --porcelain --ignored -- native src backend/agent_team_backend)"
          test "$(git diff --name-only --no-renames "$FREEZE_H" "$GITHUB_SHA")" = ".github/workflows/eval-acr-g3-diag2-windows.yml"

      - name: Set up Bun (default version, no input)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1

      - name: Install locked dependencies and record the toolchain
        id: install
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked
          mkdir -p "$RUNNER_TEMP/g3r2h" "$RUNNER_TEMP/g3r2/rehearsal" "$RUNNER_TEMP/g3r2h-summary"
          rustc -vV | tee "$RUNNER_TEMP/g3r2h/rustc-vV.txt"

      - name: Build the ps shim and put it first on PATH
        id: shim
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          cargo build --release --locked --manifest-path backend/tests/cli_regression/support/g3/hosted_ps_shim/Cargo.toml
          cygpath -w "$PWD/backend/tests/cli_regression/support/g3/hosted_ps_shim/target/release" >> "$GITHUB_PATH"

      - name: Build the sidecars and the reader fixtures
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py build "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Build the packaged app
        id: packaged
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py packaged "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Smoke
        id: smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py smoke "$PWD" "$RUNNER_TEMP/g3r2h/smoke" --rehearsal

      - name: ConPTY probe (NOT evidence, rh16 windows-4c)
        id: conptyprobe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          shim="$PWD/backend/tests/cli_regression/support/g3/hosted_ps_shim/target/release"
          export PATH="$shim:$PATH"
          case "$(command -v ps)" in "$shim"/ps|"$shim"/ps.exe) ;; *) echo "ps does not resolve to the G3 shim: $(command -v ps)"; exit 1 ;; esac
          listing="$(ps -A -o pid=)"
          if [ -z "$listing" ] || printf '%s\n' "$listing" | grep -v -E '^ *[0-9]+$' > /dev/null; then echo "ps -A -o pid= is not shim-shaped"; exit 1; fi
          shaped=""
          for pid in $(printf '%s\n' "$listing" | tr -d ' ' | head -n 20); do
            if ps -o lstart= -p "$pid" | grep -q -E '^[A-Z][a-z]{2} [A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4}$'; then shaped=1; break; fi
          done
          test -n "$shaped"
          uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py conpty-probe "$PWD" "$RUNNER_TEMP/g3r2h/conpty-probe" --rehearsal

      - name: diag2, record the runner image version (rh17 review N-6; information only, it cannot fail the job)
        id: image
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/diag2/out"
          {
            echo "ImageOS: ${ImageOS:-unknown}"
            echo "ImageVersion: ${ImageVersion:-unknown}"
            echo "RUNNER_OS: ${RUNNER_OS:-unknown}"
            echo "RUNNER_ARCH: ${RUNNER_ARCH:-unknown}"
            echo "uname -sr: $(uname -sr 2>&1 || true)"
            echo "ver: $(cmd.exe //c ver 2>&1 | tr -d '\r' | grep -v '^$' || true)"
            echo "conhost.exe: $(pwsh -NoProfile -Command '(Get-Item "$env:SystemRoot\System32\conhost.exe").VersionInfo.ProductVersion' 2>&1 || echo unavailable)"
          } | tee "$RUNNER_TEMP/diag2/out/image.txt"

      - name: diag2, write the three diagnostic tools (they exist on this runner only) and check their bytes
        id: tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/diag2/tools" "$RUNNER_TEMP/diag2/out" "$RUNNER_TEMP/diag2/private"
          cat > "$RUNNER_TEMP/diag2/tools/diag2_attempt_run.py" <<'DIAG2_EOF_ATTEMPT_RUN'
          """diag2 (NOT evidence). Runs ONE shell attempt of ONE arm through the pack's own cost path, so the step gets exactly the plan step, the environment and the sequencer the rehearsal's cost run gives its
          shell attempts.

              uv --project backend run python diag2_attempt_run.py REPO PLAN_OUT F0 BUILD_RECORD PRE_OUT SMOKE_OUT MODE RECORDS PRIVATE        (from the repository root)

          `hosted_driver.main(["cost", REPO, PLAN_OUT, F0, BUILD_RECORD, PRE_OUT, SMOKE_OUT, "--rehearsal"])` builds the rehearsal's real cost plan (the hosted environment, the Bun preload, the termios flag, the
          freeze and sidecar variables, the rehearsal flag) and hands it to its plan runner. This tool is that plan runner: it takes the plan's `calibrate-shell` step and nothing else, puts the diag test file in the
          place of `g3Matrix.test.ts` in its argv, adds the diag variables, and runs that one step through the pack's unchanged `_run_plan` under its own record name. The cost run's precondition, its F0 re-check
          before each step and every other step of the plan are NOT run: the diag test file makes the per-attempt freeze and toolchain checks itself and records what they say. No cost run, no matrix, no measurement.
          PLAN_OUT must be a rehearsal output directory (`$RUNNER_TEMP/g3r2/rehearsal/attempt-<n>`): `hosted_driver` refuses any other.
          Afterwards the redacted tail of the step's own log (the vitest output) is written to RECORDS/step-log-tail.txt.
          """
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))

          STEP = "calibrate-shell"
          MATRIX_TEST = "tests/cli/g3Matrix.test.ts"
          DIAG_TEST = "tests/cli/g3hDiag2Attempt.test.ts"
          GATE = "ACR_DIAG2_ATTEMPT"
          RECORD_NAME = "run-diag2-attempt.json"
          MODES = ("python", "rust-shell")
          TAIL_CHARS = 20000


          def substituted(plan: list[dict], mode: str, records: str, private: str) -> list[dict]:
              """The cost plan's own shell-attempt step with the diag test file in the place of the matrix one. Anything but a plan that holds that step once, as the pack builds it, is refused."""
              steps = [step for step in plan if step["name"] == STEP]
              if len(steps) != 1 or steps[0]["argv"].count(MATRIX_TEST) != 1 or steps[0]["env"].get("ACR_G3") != "calibrate" or "ACR_G3_FREEZE" not in steps[0]["env"] or "ACR_G3_SIDECAR" not in steps[0]["env"]:
                  raise RuntimeError("the pack's cost plan does not hold the one calibrate-shell step this tool substitutes")
              if mode not in MODES:
                  raise RuntimeError("MODE is python or rust-shell")
              step = steps[0]
              env = {**step["env"], "ACR_G3": "diag2", GATE: "1", "ACR_DIAG2_ARM": mode, "ACR_G3_OUT": records, "ACR_DIAG2_PRIVATE": private, "ACR_G1E_KEEP": "1"}
              return [{**step, "argv": [DIAG_TEST if word == MATRIX_TEST else word for word in step["argv"]], "env": env, "outputs": [f"{records}/attempt.json"]}]


          def main(argv: list[str], *, inner=None, **injected) -> int:
              if len(argv) != 9:
                  print(__doc__, file=sys.stderr)
                  return 64
              repo, plan_out, f0, build_record, pre_out, smoke_out, mode, records, private = argv
              from tests.cli_regression.support.g3 import hosted_driver
              run = hosted_driver._run_plan if inner is None else inner
              records, private = str(Path(records).resolve()), str(Path(private).resolve())
              seen: dict = {}

              def run_plan(plan: list[dict], out, _record_name: str, **kwargs) -> int:
                  seen["planSteps"] = [step["name"] for step in plan]
                  return run(substituted(plan, mode, records, private), out, RECORD_NAME, record_extra=kwargs.get("record_extra"))

              code = hosted_driver.main(["cost", repo, plan_out, f0, build_record, pre_out, smoke_out, "--rehearsal"], run_plan=run_plan, **injected)
              try:
                  Path(records).mkdir(parents=True, exist_ok=True)
                  log = Path(plan_out).resolve() / "logs" / f"{STEP}.log"
                  tail = "\n".join(hosted_driver.redacted_tail(log.read_text(encoding="utf-8", errors="replace"))) if log.is_file() else "the step wrote no log"
                  (Path(records) / "step-log-tail.txt").write_text(tail[-TAIL_CHARS:] + "\n", encoding="utf-8")
                  (Path(records) / "launcher.json").write_text(json.dumps({"schema": "acr-g3h-diag2-launcher/1", "notEvidence": True, "mode": mode, "exit": code, "costPlanSteps": seen.get("planSteps"),
                                                                        "stepRun": STEP, "testFile": DIAG_TEST}, indent=1, sort_keys=True) + "\n", encoding="utf-8")
              except Exception as error:  # noqa: BLE001 - the records are information; the attempt's exit code is the result
                  print(f"diag2: the step log tail could not be written: {type(error).__name__}")
              return code


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          DIAG2_EOF_ATTEMPT_RUN
          cat > "$RUNNER_TEMP/diag2/tools/diag2_attempt_report.py" <<'DIAG2_EOF_ATTEMPT_REPORT'
          """diag2 (NOT evidence). What one attempt's records say, check by check, written as fixed verdict words and the checks' own texts.

              uv --project backend run python -B diag2_attempt_report.py RECORDS PRIVATE F0 MODE        (from the repository root)

          RECORDS holds what `g3hDiag2Attempt.test.ts` wrote for the upload (`attempt.json`); PRIVATE holds the whole receipt and the resource samples, which are read here and never copied. Writes
          RECORDS/attempt-report.json:
            phases    every phase of the attempt with its outcome (`passed`, `failed`, `running`, or `not reached`)
            peers     per measured peer: the reader's delta, what the peer accepted, the registered line count L of the cell, `delta - accepted - L`, whether that is inside the Windows bound, `logFile.size`,
                      and the problems the ledger rule reports for the record (with the hosted seams of this platform installed: on Windows the two-sided rule of rh18)
            resizeAckMs   the 20 report-only resize probes
            decider   what the rehearsal verdict's own per-receipt check (`rehearsal_verdict._trial_check`: structure, consistency, trial problems) says about this receipt
            verdicts  one line per check, `pass` / `FAIL` / `not reached` / `not run`, so that every failure of the attempt is listed
          It always exits 0 and writes the file: a check that cannot run is listed with the class of its error.
          """
          from __future__ import annotations

          import json
          import platform
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))

          SCHEMA = "acr-g3h-diag2-report/1"


          class Files:
              """The two private files, in the shape `_trial_check` reads a bundle: the receipt by name, the resource samples under the name it derives from it."""
              def __init__(self, private: Path) -> None:
                  self.private = private

              def read_json(self, _name: str):
                  return json.loads((self.private / "receipt.json").read_text(encoding="utf-8"))

              def exists(self, _name: str) -> bool:
                  return (self.private / "resources.jsonl").is_file()

              def read_jsonl(self, _name: str):
                  return [json.loads(line) for line in (self.private / "resources.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]


          def load(path: Path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None


          def guarded(errors: dict, name: str, run, default=None):
              try:
                  return run()
              except Exception as error:  # noqa: BLE001 - one check that cannot run must not hide the others
                  errors[name] = type(error).__name__
                  return default


          def peer_rows(receipt: dict, count: int, hosted_seams, summarise, errors: dict) -> list[dict]:
              rows = []
              for index, record in enumerate(receipt.get("ledgers") or []):
                  row = {"peer": index}
                  try:
                      delta = record["close"]["read_total"] - record["origin"]["read_total"]
                      accepted = record["peer"]["acceptedSinceOrigin"]
                      lines = hosted_seams.registered_lines(count)
                      row.update(readerDelta=delta, peerAccepted=accepted, registeredLines=lines, deltaMinusAccepted=delta - accepted, deltaMinusAcceptedMinusLines=delta - accepted - lines,
                                 slackBytes=hosted_seams.LEDGER_SLACK_BYTES, insideTheWindowsBound=hosted_seams.ledger_bound_problem(delta, accepted, lines) is None,
                                 logFileSize=(record.get("logFile") or {}).get("size"), logIdentity=record.get("logIdentity"))
                  except Exception as error:  # noqa: BLE001
                      row["recordError"] = type(error).__name__
                  row["ledgerProblems"] = guarded(errors, f"ledger_problems[{index}]", lambda record=record, index=index: summarise.ledger_problems(record, index, count))
                  rows.append(row)
              return rows


          def build(records: Path, private: Path, f0_path: Path, mode: str, system: str | None = None) -> dict:
              from tests.cli_regression.support.g3 import hosted_posix_stubs
              hosted_posix_stubs.install()      # before the imports below, as the hosted helper does (Windows has no os.getloadavg, which a g1e module reads at import)
              from tests.cli_regression.support.g1e import summarise
              from tests.cli_regression.support.g3 import hosted_seams, rehearsal_verdict

              system = system or platform.system()
              errors: dict = {}
              out: dict = {"schema": SCHEMA, "notEvidence": True, "mode": mode, "system": system, "verdicts": []}
              attempt = load(records / "attempt.json")
              receipt = load(private / "receipt.json")
              f0 = load(f0_path)
              undo = guarded(errors, "install-seams", lambda: hosted_seams.install(system))
              try:
                  say = lambda check, verdict, detail=None: out["verdicts"].append({"check": check, "verdict": verdict, **({"detail": detail} if detail not in (None, [], "") else {})})
                  say("the attempt step wrote its record (attempt.json)", "pass" if isinstance(attempt, dict) else "FAIL")
                  for step in (attempt or {}).get("steps") or []:
                      say(f"helper step {step.get('step')}", "pass" if step.get("ok") else "FAIL", step.get("detail"))
                  if isinstance(attempt, dict):
                      say("freeze-verify reports no problem", "not run" if attempt.get("freezeProblems") is None else "pass" if attempt["freezeProblems"] == [] else "FAIL", attempt.get("freezeProblems"))
                      say("the toolchain check matches", "not run" if attempt.get("toolchainMatch") is None else "pass" if attempt["toolchainMatch"] is True else "FAIL", attempt.get("toolchainMismatches"))
                      say("the attempt code returned a receipt", "pass" if attempt.get("attemptRan") else "FAIL", attempt.get("thrown"))
                      out.update(driverLogTee=attempt.get("driverLogTee"), driverLogBytes=attempt.get("driverLogBytes"), rootKept=attempt.get("rootKept"), wallSeconds=attempt.get("wallSeconds"))
                  if not isinstance(receipt, dict):
                      say("every phase", "not reached", "no receipt")
                      out.update(attemptRan=False, phases=[], peers=[], resizeAckMs=[], decider=None)
                      return out
                  count = receipt.get("count")
                  outcomes = receipt.get("phaseOutcomes") or {}
                  out.update(attemptRan=True, count=count, passed=receipt.get("passed"), evidenceValid=receipt.get("evidenceValid"), stopReason=receipt.get("stopReason"), failure=receipt.get("failure"))
                  out["phases"] = [{"phase": name, "outcome": outcomes.get(name, "not reached")} for name in (*summarise.PHASE_SEQUENCE, "cleanup")]
                  for row in out["phases"]:
                      say(f"phase {row['phase']}", {"passed": "pass", "failed": "FAIL", "running": "FAIL"}.get(row["outcome"], "not reached"), None if row["outcome"] == "passed" else row["outcome"])
                  say("the attempt passed with valid evidence", "pass" if receipt.get("passed") is True and receipt.get("evidenceValid") is True and not receipt.get("stopReason") else "FAIL", receipt.get("failure"))
                  proof = receipt.get("proof")
                  say("the runtime proof", "not reached" if not isinstance(proof, dict) else "pass" if proof.get("ok") is True else "FAIL", (proof or {}).get("failures") if isinstance(proof, dict) else None)
                  out["peers"] = peer_rows(receipt, count, hosted_seams, summarise, errors) if isinstance(count, int) else []
                  if not out["peers"]:
                      say("the byte ledger of every peer", "not reached", "the receipt holds no ledger record (the attempt stopped before its after-exit checks)")
                  for row in out["peers"]:
                      say(f"peer {row['peer']}: the ledger rules (with this platform's seams)", "FAIL" if row["ledgerProblems"] or row["ledgerProblems"] is None else "pass", row["ledgerProblems"])
                      say(f"peer {row['peer']}: delta - accepted - L inside [0, slack]", "not run" if system != "Windows" else "pass" if row.get("insideTheWindowsBound") else "FAIL",
                          {key: row.get(key) for key in ("deltaMinusAcceptedMinusLines", "deltaMinusAccepted", "registeredLines", "slackBytes")})
                  latencies = receipt.get("latencies") or {}
                  out["resizeAckMs"] = latencies.get("resize_ack_ms") or []
                  say("20 resize probes recorded", "pass" if len(out["resizeAckMs"]) == 20 else "not reached" if outcomes.get("resize_ack") is None else "FAIL", len(out["resizeAckMs"]))
                  for index, burst in enumerate(receipt.get("burstChecks") or []):
                      say(f"peer {index}: the burst endpoint check", "pass" if isinstance(burst, dict) and burst.get("kind") == "pass" else "FAIL", burst if isinstance(burst, dict) else None)
                  decider = None
                  if isinstance(f0, dict):
                      decider = guarded(errors, "rehearsal_verdict._trial_check", lambda: rehearsal_verdict._trial_check(Files(private), "receipt.json", f0, mode))
                  out["decider"] = {"check": "rehearsal_verdict._trial_check (structure, consistency, trial problems), as the rehearsal verdict applies it to a warm-up receipt", "problems": decider}
                  say("the rehearsal verdict's per-receipt check", "not run" if decider is None else "pass" if decider == [] else "FAIL", decider)
                  return out
              finally:
                  out["checkErrors"] = errors
                  if callable(undo):
                      undo()


          def main(argv: list[str]) -> int:
              if len(argv) != 4:
                  print(__doc__, file=sys.stderr)
                  return 64
              records, private, f0_path, mode = Path(argv[0]), Path(argv[1]), Path(argv[2]), argv[3]
              try:
                  report = build(records, private, f0_path, mode)
              except Exception as error:  # noqa: BLE001 - the report is information; it never fails its step
                  report = {"schema": SCHEMA, "notEvidence": True, "mode": mode, "reportError": type(error).__name__, "verdicts": [{"check": "the report itself", "verdict": "FAIL", "detail": type(error).__name__}]}
              records.mkdir(parents=True, exist_ok=True)
              (records / "attempt-report.json").write_text(json.dumps(report, indent=1, sort_keys=True, default=str) + "\n", encoding="utf-8")
              for row in report.get("verdicts", []):
                  print(f"{mode}: {row['verdict']:<11} {row['check']}")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          DIAG2_EOF_ATTEMPT_REPORT
          cat > tests/cli/g3hDiag2Attempt.test.ts <<'DIAG2_EOF_ATTEMPT_TEST'
          // diag2 (NOT evidence). The diag workflow writes this file into tests/cli/ on the runner; it is in no branch and in no pack. Gated: it does nothing unless ACR_DIAG2_ATTEMPT=1 (diag2_attempt_run.py sets it).
          //
          // ONE shell attempt of ONE arm (ACR_DIAG2_ARM: python | rust-shell) through the pack's own attempt code: `g3ShellAttempt.runAttempt`, with the spec `g3Matrix.test.ts` builds for its `check` mode (a discarded
          // warm-up of kind `calibration`, cell 1, repeat 0) and the same helper calls before it (freeze-verify, toolchain-check, checked-inputs, constants). Two things differ from `g3Matrix`, both so that one run
          // lists every failure: a freeze or toolchain problem is RECORDED and the attempt still runs (g3Matrix would not start it), and the attempt's root is kept when it did not pass (ACR_G1E_KEEP=1, the attempt's
          // own rule for a non-measured attempt). The attempt code itself is untouched.
          //
          // What it writes:
          //   <ACR_DIAG2_PRIVATE>/receipt.json, resources.jsonl   the whole receipt and the resource samples; NOT uploaded: diag2_attempt_report.py reads them on the runner and writes verdict texts only
          //   <ACR_G3_OUT>/receipt.json    the receipt with every latency array given as its length, but for `resize_ack_ms` (the 20 report-only resize probes), which is kept
          //   <ACR_G3_OUT>/attempt.json    the helper steps, the failure text, every phase outcome, the redacted tail of the driver's own output, and what the kept root holds
          //   <ACR_G3_OUT>/root/           from a kept root: the peer receipts, the CK proof, the identities, the runtime receipts, the redacted tails of the backend logs, the peer logs and the peer bytes
          // The driver's output: `runAttempt` owns the driver process, so this file wraps `ChildProcess.prototype.spawn`, through which every spawn goes, and adds its own listener to the driver's stdout and
          // stderr (nothing is taken away from the attempt, which adds its listeners right after). If that cannot be installed the attempt runs all the same and `driverLogTee` says so; the receipt's own failure
          // text then holds what the attempt itself quotes of that output.
          import childProcess, { execFileSync, spawn } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { copyFileSync, existsSync, mkdirSync, mkdtempSync, readdirSync, readFileSync, statSync, writeFileSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join, resolve } from 'node:path'
          import { expect, it } from 'vitest'
          import { redactDiagnostic } from './baselineArtifacts'
          import { classifyAttempt, type ToolchainRecord } from './g1eRun'
          import { runAttempt, type AttemptSpec, type FreezeBinding } from './g3ShellAttempt'

          const enabled = process.env.ACR_DIAG2_ATTEMPT === '1'
          const selfCheck = process.env.ACR_DIAG2_SELFCHECK === '1'
          const mode = process.env.ACR_DIAG2_ARM ?? ''
          const COUNT = 1 // the smallest registered cell: one measured peer, 40 burst rounds
          const DRIVER_MODULE = 'tests.cli_regression.support.g1e.driver'
          const ROOT_PREFIX = 'navide-g1e-' // `runAttempt`: mkdtempSync(join(tmpdir(), 'navide-g1e-'))
          const TAIL_CHARS = 20_000
          const COPY_LIMIT = 24 * 1024 * 1024
          const python = resolve('backend/.venv', process.platform === 'win32' ? 'Scripts/python.exe' : 'bin/python')
          const out = resolve(process.env.ACR_G3_OUT ?? 'test-results/ci/g3/diag2-attempt')
          const priv = resolve(process.env.ACR_DIAG2_PRIVATE ?? join(out, 'private'))
          const sidecar = process.env.ACR_G3_SIDECAR ? resolve(process.env.ACR_G3_SIDECAR) : null
          const sidecarArg = sidecar ?? '-'
          const root = resolve('.')
          const helper = (args: string[]): string => execFileSync(python, ['-B', '-m', 'tests.cli_regression.support.g3.helper', ...args], { cwd: resolve('backend'), encoding: 'utf8', timeout: 180_000, maxBuffer: 64 * 1024 * 1024 })
          const sha256 = (data: Buffer | string): string => createHash('sha256').update(data).digest('hex')
          const brief = (error: unknown, limit = 2000): string => redactDiagnostic(error instanceof Error ? `${error.name}: ${error.message}` : String(error)).slice(0, limit)

          // ---------------------------------------------------------------------------------------------------------------- the driver's own output
          const driverLog: string[] = []
          let driverSpawns = 0
          let teeState = 'not installed'
          try {
            // Every `spawn` of node:child_process goes through this one method, whichever way a module imported `spawn`; `options.args` is the argv of the child (argv[0] included).
            const proto = (childProcess as unknown as { ChildProcess?: { prototype: Record<string, any> } }).ChildProcess?.prototype
            const original = proto ? proto.spawn : undefined
            if (!proto || typeof original !== 'function') teeState = 'not installed: ChildProcess.prototype.spawn is not a function on this runtime'
            else {
              proto.spawn = function (this: any, options: any, ...rest: unknown[]): unknown {
                const result = original.call(this, options, ...rest)
                try {
                  if (options && Array.isArray(options.args) && options.args.includes(DRIVER_MODULE)) {
                    driverSpawns++
                    for (const stream of [this.stdout, this.stderr]) if (stream) stream.on('data', (chunk: Buffer | string) => { driverLog.push(typeof chunk === 'string' ? chunk : chunk.toString('utf8')) })
                  }
                } catch { /* the listener is information only: the spawn itself is the attempt's and has already happened */ }
                return result
              }
              teeState = 'installed'
            }
          } catch (error) {
            teeState = `failed: ${error instanceof Error ? error.name : 'error'}`
          }

          // ---------------------------------------------------------------------------------------------------------------- pure helpers
          /** The receipt as it is uploaded: every latency array as its length, but for the 20 report-only resize probes. */
          export function trimmedReceipt(receipt: Record<string, any>): Record<string, unknown> {
            const latencies = (receipt.latencies ?? {}) as Record<string, unknown[]>
            const { latencies: _dropped, ...rest } = receipt
            return { ...rest, diag2: 'NOT evidence; the latency arrays are given as their lengths (latencyCounts), but for resize_ack_ms', latencyCounts: Object.fromEntries(Object.entries(latencies).map(([key, values]) => [key, Array.isArray(values) ? values.length : null])),
              resizeAckMs: Array.isArray(latencies.resize_ack_ms) ? latencies.resize_ack_ms : [] }
          }

          function walk(directory: string, relative = '', found: Array<{ path: string; bytes: number }> = []): Array<{ path: string; bytes: number }> {
            for (const name of readdirSync(directory).sort()) {
              if (found.length >= 600) break
              const rel = relative ? `${relative}/${name}` : name
              try {
                const info = statSync(join(directory, name))
                if (info.isDirectory()) walk(join(directory, name), rel, found)
                else found.push({ path: rel, bytes: info.size })
              } catch { found.push({ path: rel, bytes: -1 }) }
            }
            return found
          }

          const flat = (rel: string): string => rel.replace(/[\\/]/g, '__')
          const REDACTED_COPIES = [/^identity\.json$/, /^first-identity\.json$/, /^restart-identity\.json$/, /^runtime-receipts\.jsonl$/, /^g1e\/[^/]+\.peer\.json$/, /^g1e\/ck-proof\.json$/, /^g1e\/ts-final\.json$/]
          const TAILS = [/^first-backend\.log$/, /^restart-backend\.log$/, /^data\/logs\/backend\.log$/]
          const RAW_COPIES = [/^logs\/peer-\d+\.log$/, /^g1e\/[^/]+\.peerbytes$/]

          /** What a kept attempt root holds (names and sizes, 600 entries at most), and the files copied from it into `target`. `endpoint.json` (it carries the backend's URL), the home and the stores are never copied. */
          export function stageRoot(kept: string, target: string): { files: Array<{ path: string; bytes: number }>; staged: string[]; problems: string[] } {
            const files = walk(kept)
            const staged: string[] = []
            const problems: string[] = []
            mkdirSync(target, { recursive: true })
            for (const file of files) {
              try {
                const source = join(kept, file.path)
                if (REDACTED_COPIES.some((rule) => rule.test(file.path)) && file.bytes <= 4 * 1024 * 1024) { writeFileSync(join(target, flat(file.path)), redactDiagnostic(readFileSync(source, 'utf8'))); staged.push(file.path) }
                else if (TAILS.some((rule) => rule.test(file.path))) { writeFileSync(join(target, `${flat(file.path)}.tail.txt`), redactDiagnostic(readFileSync(source, 'utf8')).slice(-TAIL_CHARS)); staged.push(file.path) }
                else if (RAW_COPIES.some((rule) => rule.test(file.path)) && file.bytes <= COPY_LIMIT) { copyFileSync(source, join(target, flat(file.path))); staged.push(file.path) }
              } catch (error) { problems.push(`${file.path}: ${error instanceof Error ? error.name : 'error'}`) }
            }
            return { files, staged, problems }
          }

          const rootsNow = (): string[] => { try { return readdirSync(tmpdir()).filter((name) => name.startsWith(ROOT_PREFIX)) } catch { return [] } }

          // ---------------------------------------------------------------------------------------------------------------- the attempt
          it.runIf(enabled && !selfCheck)('G3 diag2 (NOT evidence): one shell attempt of one arm through the attempt code, every failure recorded', async () => {
            expect(['python', 'rust-shell'], 'ACR_DIAG2_ARM is python or rust-shell').toContain(mode)
            mkdirSync(out, { recursive: true })
            mkdirSync(priv, { recursive: true })
            const steps: Array<{ step: string; ok: boolean; detail?: string }> = []
            const tryStep = <T>(name: string, run: () => T): T | null => {
              try { const value = run(); steps.push({ step: name, ok: true }); return value } catch (error) { steps.push({ step: name, ok: false, detail: brief(error, 800) }); return null }
            }
            const f0 = resolve(process.env.ACR_G3_FREEZE ?? '')
            const freeze = tryStep('read-f0', () => JSON.parse(readFileSync(f0, 'utf8')) as Record<string, any>)
            const freezeProblems = tryStep('freeze-verify', () => (JSON.parse(helper(['freeze-verify', root, f0, sidecarArg])) as { problems: string[] }).problems)
            const check = tryStep('toolchain-check', () => JSON.parse(helper(['toolchain-check', root, f0, sidecarArg])) as ToolchainRecord)
            const checkedInputs = tryStep('checked-inputs', () => (JSON.parse(helper(['checked-inputs', f0])) as { checkedInputs: number }).checkedInputs)
            const fixture = tryStep('constants', () => JSON.parse(helper(['constants'])) as { fixtureRegistrySha256: string; logPolicySha256: string })
            const spec = tryStep('spec', (): AttemptSpec => {
              if (!freeze || !check || checkedInputs === null || !fixture) throw new Error('an input of the attempt spec is missing (see the steps above)')
              const binding: FreezeBinding = { sha256: sha256(readFileSync(f0)), checkedInputs, evidenceRevision: freeze.evidenceRevision, methodRevision: freeze.methodRevision, sidecarSha256: freeze.sidecarSha256, vendors: freeze.vendors }
              return { kind: 'calibration', mode: mode as AttemptSpec['mode'], count: COUNT, repeat: 0, slot: null, firstArm: null, warmup: true, freeze: binding, python, sidecarBin: sidecar,
                fixtureRegistrySha256: fixture.fixtureRegistrySha256, logPolicySha256: fixture.logPolicySha256, toolchain: check, expectedReadyVersion: freeze.toolchain.sidecar.readyVersion }
            })
            const rootsBefore = new Set(rootsNow())
            const startedAt = Date.now()
            let receipt: Record<string, any> | null = null
            let failures: string[] = []
            let thrown: string | null = null
            if (spec) {
              try {
                const result = await runAttempt(spec, out)
                receipt = result.receipt as Record<string, any>
                failures = result.failures
                writeFileSync(join(priv, 'receipt.json'), `${redactDiagnostic(JSON.stringify(receipt, null, 1))}\n`)
                writeFileSync(join(priv, 'resources.jsonl'), result.resourcesJsonl)
                writeFileSync(join(out, 'receipt.json'), `${redactDiagnostic(JSON.stringify(trimmedReceipt(receipt), null, 1))}\n`)
              } catch (error) { thrown = brief(error) }
            }
            const kept = rootsNow().filter((name) => !rootsBefore.has(name))
            const roots = kept.map((name, index) => {
              try { return { name, ...stageRoot(join(tmpdir(), name), join(out, kept.length === 1 ? 'root' : `root-${index}`)) } } catch (error) { return { name, files: [], staged: [], problems: [brief(error, 300)] } }
            })
            const verdict = receipt ? classifyAttempt(receipt) : null
            const log = driverLog.join('')
            const record = {
              schema: 'acr-g3h-diag2-attempt/1', notEvidence: true, mode, count: COUNT, kind: 'calibration', warmup: true, platform: process.platform, wallSeconds: Math.round((Date.now() - startedAt) / 1000),
              steps, freezeProblems, toolchainMatch: check ? check.match : null, toolchainMismatches: check ? check.mismatches : null,
              attemptRan: receipt !== null, thrown, validity: verdict ? verdict.validity : null, stopReason: verdict ? verdict.stopReason : null,
              passed: receipt ? receipt.passed : null, evidenceValid: receipt ? receipt.evidenceValid : null, failure: receipt ? (receipt.failure ?? null) : null, failures: failures.map((text) => redactDiagnostic(text)),
              phaseOutcomes: receipt ? receipt.phaseOutcomes : null, phases: receipt ? receipt.phases : null, driverExitCode: receipt ? (receipt.driverExitCode ?? null) : null,
              driverLogTee: teeState, driverSpawnsSeen: driverSpawns, driverLogBytes: Buffer.byteLength(log), driverLogTail: redactDiagnostic(log).slice(-4000),
              rootKept: kept.length > 0, roots,
            }
            writeFileSync(join(out, 'attempt.json'), `${redactDiagnostic(JSON.stringify(record, null, 1))}\n`)
            process.stdout.write(`diag2 attempt ${mode}: ${verdict ? verdict.validity : 'not run'}${receipt && receipt.failure ? ` failure=${String(receipt.failure).slice(0, 600)}` : ''}${thrown ? ` thrown=${thrown.slice(0, 300)}` : ''}\n`)
            expect({ thrown, validity: record.validity, freezeProblems, toolchainMatch: record.toolchainMatch }).toEqual({ thrown: null, validity: 'clean', freezeProblems: [], toolchainMatch: true })
          }, 900_000)

          // ---------------------------------------------------------------------------------------------------------------- self-check (no backend, no driver, no attempt): run off the runner by test_g3h_diag2.py
          it.runIf(enabled && selfCheck)('diag2 self-check: the driver-output listener sees a child started through the named `spawn`, and the two record helpers do what they say', async () => {
            expect(teeState).toBe('installed')
            const child = spawn(process.execPath, ['-e', "console.log('diag2-selfcheck-line')", DRIVER_MODULE], { stdio: ['ignore', 'pipe', 'pipe'] })
            const own: string[] = []
            child.stdout!.on('data', (chunk) => { own.push(String(chunk)) }) // the attempt's own listener: it must still get every byte
            await new Promise<void>((done) => { child.on('close', () => done()) })
            expect(driverSpawns).toBe(1)
            expect(driverLog.join('')).toContain('diag2-selfcheck-line')
            expect(own.join('')).toContain('diag2-selfcheck-line')
            const other = spawn(process.execPath, ['-e', "console.log('not the driver')"], { stdio: ['ignore', 'pipe', 'pipe'] })
            await new Promise<void>((done) => { other.on('close', () => done()) })
            expect(driverSpawns).toBe(1) // only a command that names the driver module is listened to
            const trimmed = trimmedReceipt({ passed: false, failure: 'x', latencies: { io_ms: [1, 2, 3], resize_ack_ms: [4, 5] }, ledgers: [{ logFile: { size: 9 } }] }) as Record<string, any>
            expect(trimmed.latencies).toBeUndefined()
            expect(trimmed.latencyCounts).toEqual({ io_ms: 3, resize_ack_ms: 2 })
            expect(trimmed.resizeAckMs).toEqual([4, 5])
            expect(trimmed.ledgers).toEqual([{ logFile: { size: 9 } }])
            const kept = mkdtempSync(join(tmpdir(), 'diag2-selfcheck-'))
            for (const directory of ['g1e', 'logs', 'home', 'data/logs']) mkdirSync(join(kept, directory), { recursive: true })
            const token = 'S'.repeat(24) // a backend URL token as `redactDiagnostic` knows it (`?token=...`), made here at run time
            writeFileSync(join(kept, 'endpoint.json'), `{"url": "ws://127.0.0.1:1/?token=${token}"}`)
            writeFileSync(join(kept, 'g1e/pane.peer.json'), `{"acceptedSinceOrigin": 5, "note": "ws://127.0.0.1:1/?token=${token}"}`)
            writeFileSync(join(kept, 'first-backend.log'), `${'line\n'.repeat(10_000)}last line ws://127.0.0.1:1/?token=${token}\n`)
            writeFileSync(join(kept, 'logs/peer-0.log'), 'peer text\n')
            writeFileSync(join(kept, 'home/secret.txt'), 'never copied')
            const target = join(kept, 'staged')
            const staged = stageRoot(kept, target)
            expect(staged.staged.sort()).toEqual(['first-backend.log', 'g1e/pane.peer.json', 'logs/peer-0.log'])
            expect(staged.problems).toEqual([])
            expect(readdirSync(target).sort()).toEqual(['first-backend.log.tail.txt', 'g1e__pane.peer.json', 'logs__peer-0.log'])
            expect(readFileSync(join(target, 'g1e__pane.peer.json'), 'utf8')).not.toContain(token)
            const tail = readFileSync(join(target, 'first-backend.log.tail.txt'), 'utf8')
            expect(tail.length).toBeLessThanOrEqual(TAIL_CHARS)
            expect(tail).toContain('last line')
            expect(tail).not.toContain(token)
            expect(staged.files.map((file) => file.path)).toContain('endpoint.json') // listed by name and size, never copied
            expect(existsSync(join(target, 'endpoint.json'))).toBe(false)
            mkdirSync(out, { recursive: true })
            writeFileSync(join(out, 'selfcheck.json'), `${JSON.stringify({ teeState, runtime: process.versions.bun ? 'bun' : 'node' })}\n`)
          }, 60_000)
          DIAG2_EOF_ATTEMPT_TEST
          test "$(sha256sum < "$RUNNER_TEMP/diag2/tools/diag2_attempt_run.py" | cut -d' ' -f1)" = "bbca01b421fef0f6cdb15ba47746d79d1b10ae11eee037ac5882ee67a469e190"
          test "$(sha256sum < "$RUNNER_TEMP/diag2/tools/diag2_attempt_report.py" | cut -d' ' -f1)" = "9b079b85c53d8167757e634297b47ca0da0383a6bd34955fd3b789f443869933"
          test "$(sha256sum < tests/cli/g3hDiag2Attempt.test.ts | cut -d' ' -f1)" = "83ac59f21a302a48c771e7db09f8577d078eeb8a3dd38313b61601301369ba05"

      - name: Build F0
        id: f0
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.packaged.outcome == 'success' }}
        continue-on-error: true
        run: |
          H="uv --project backend run python -B -m tests.cli_regression.support.g3.hosted_helper"
          $H f0-spec "$PWD" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/f0-spec.json" "$GITHUB_REF_NAME"
          $H f0-build "$PWD" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/f0-spec.json"

      - name: diag2, one shell attempt of the Python arm through the attempt code and the cost plan's own step (NOT evidence, not a measurement)
        id: attempt_python
        if: ${{ !cancelled() && steps.f0.outcome == 'success' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          shim="$PWD/backend/tests/cli_regression/support/g3/hosted_ps_shim/target/release"
          export PATH="$shim:$PATH"
          case "$(command -v ps)" in "$shim"/ps|"$shim"/ps.exe) ;; *) echo "ps does not resolve to the G3 shim: $(command -v ps)"; exit 1 ;; esac
          listing="$(ps -A -o pid=)"
          if [ -z "$listing" ] || printf '%s\n' "$listing" | grep -v -E '^ *[0-9]+$' > /dev/null; then echo "ps -A -o pid= is not shim-shaped"; exit 1; fi
          shaped=""
          for pid in $(printf '%s\n' "$listing" | tr -d ' ' | head -n 20); do
            if ps -o lstart= -p "$pid" | grep -q -E '^[A-Z][a-z]{2} [A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4}$'; then shaped=1; break; fi
          done
          test -n "$shaped"
          uv --project backend run python "$RUNNER_TEMP/diag2/tools/diag2_attempt_run.py" "$PWD" "$RUNNER_TEMP/g3r2/rehearsal/attempt-1" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" python "$RUNNER_TEMP/diag2/out/attempt-python" "$RUNNER_TEMP/diag2/private/attempt-python"

      - name: diag2, one shell attempt of the Rust arm through the attempt code and the cost plan's own step (NOT evidence, not a measurement)
        id: attempt_rust
        if: ${{ !cancelled() && steps.f0.outcome == 'success' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 25
        run: |
          shim="$PWD/backend/tests/cli_regression/support/g3/hosted_ps_shim/target/release"
          export PATH="$shim:$PATH"
          case "$(command -v ps)" in "$shim"/ps|"$shim"/ps.exe) ;; *) echo "ps does not resolve to the G3 shim: $(command -v ps)"; exit 1 ;; esac
          listing="$(ps -A -o pid=)"
          if [ -z "$listing" ] || printf '%s\n' "$listing" | grep -v -E '^ *[0-9]+$' > /dev/null; then echo "ps -A -o pid= is not shim-shaped"; exit 1; fi
          shaped=""
          for pid in $(printf '%s\n' "$listing" | tr -d ' ' | head -n 20); do
            if ps -o lstart= -p "$pid" | grep -q -E '^[A-Z][a-z]{2} [A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4}$'; then shaped=1; break; fi
          done
          test -n "$shaped"
          uv --project backend run python "$RUNNER_TEMP/diag2/tools/diag2_attempt_run.py" "$PWD" "$RUNNER_TEMP/g3r2/rehearsal/attempt-2" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" rust-shell "$RUNNER_TEMP/diag2/out/attempt-rust" "$RUNNER_TEMP/diag2/private/attempt-rust"

      - name: diag2, one verdict per check of each attempt (always runs; information only, it cannot fail the job)
        id: verdicts
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv --project backend run python -B "$RUNNER_TEMP/diag2/tools/diag2_attempt_report.py" "$RUNNER_TEMP/diag2/out/attempt-python" "$RUNNER_TEMP/diag2/private/attempt-python" "$RUNNER_TEMP/g3r2h/F0.json" python || echo "the report of the python attempt could not be written"
          uv --project backend run python -B "$RUNNER_TEMP/diag2/tools/diag2_attempt_report.py" "$RUNNER_TEMP/diag2/out/attempt-rust" "$RUNNER_TEMP/diag2/private/attempt-rust" "$RUNNER_TEMP/g3r2h/F0.json" rust-shell || echo "the report of the rust-shell attempt could not be written"

      - name: diag2, stage the records and write the step outcomes (always runs; it decides nothing and cannot fail the job)
        id: stage
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          O_PINS: ${{ steps.pins.outcome }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_SHIM: ${{ steps.shim.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_PACKAGED: ${{ steps.packaged.outcome }}
          O_SMOKE: ${{ steps.smoke.outcome }}
          O_CONPTYPROBE: ${{ steps.conptyprobe.outcome }}
          O_IMAGE: ${{ steps.image.outcome }}
          O_TOOLS: ${{ steps.tools.outcome }}
          O_F0: ${{ steps.f0.outcome }}
          O_ATTEMPT_PYTHON: ${{ steps.attempt_python.outcome }}
          O_ATTEMPT_RUST: ${{ steps.attempt_rust.outcome }}
          O_VERDICTS: ${{ steps.verdicts.outcome }}
        run: |
          out="$RUNNER_TEMP/diag2/out"
          mkdir -p "$out"
          mkdir -p "$out/journals" "$out/markers" "$out/smoke"
          for f in "$RUNNER_TEMP"/g3r2h/pre/run-*.json "$RUNNER_TEMP"/g3r2h/smoke/run-*.json "$RUNNER_TEMP"/g3r2h/conpty-probe/run-*.json; do if [ -f "$f" ]; then cp "$f" "$out/journals/$(basename "$(dirname "$f")")-$(basename "$f")" || true; fi; done
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-1/run-diag2-attempt.json" ]; then mkdir -p "$out/attempt-python" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-1/run-diag2-attempt.json" "$out/attempt-python/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-2/run-diag2-attempt.json" ]; then mkdir -p "$out/attempt-rust" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-2/run-diag2-attempt.json" "$out/attempt-rust/plan-journal.json" || true; fi
          if [ -d "$RUNNER_TEMP/g3r2h/markers" ]; then cp -r "$RUNNER_TEMP/g3r2h/markers/." "$out/markers/" || echo "the markers could not be copied"; fi
          uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_diag.py stage-smoke "$RUNNER_TEMP/g3r2h/smoke" "$out/smoke" > "$out/smoke/staged.txt" 2>&1 || echo "stage-smoke failed" >> "$out/smoke/staged.txt"
          for f in "$RUNNER_TEMP/g3r2h/rustc-vV.txt" "$RUNNER_TEMP/g3r2h/pre/correctness-gate.json" "$RUNNER_TEMP/g3r2h/pre/correctness-receipt.json"; do if [ -f "$f" ]; then cp "$f" "$out/" || true; fi; done
          if [ -d "$RUNNER_TEMP/g3r2h/conpty-probe" ]; then cp -r "$RUNNER_TEMP/g3r2h/conpty-probe" "$out/conpty-probe" || echo "the ConPTY probe records could not be copied"; fi
          {
            printf 'NOT-EVIDENCE diag2\njob=%s\n' "$JOB_STATUS"
            printf 'step=%s outcome=%s%s\n' pins "$O_PINS" ""
            printf 'step=%s outcome=%s%s\n' identity "$O_IDENTITY" ""
            printf 'step=%s outcome=%s%s\n' install "$O_INSTALL" ""
            printf 'step=%s outcome=%s%s\n' shim "$O_SHIM" ""
            printf 'step=%s outcome=%s%s\n' build "$O_BUILD" ""
            printf 'step=%s outcome=%s%s\n' packaged "$O_PACKAGED" ""
            printf 'step=%s outcome=%s%s\n' smoke "$O_SMOKE" ""
            printf 'step=%s outcome=%s%s\n' conptyprobe "$O_CONPTYPROBE" ""
            printf 'step=%s outcome=%s%s\n' image "$O_IMAGE" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' tools "$O_TOOLS" ""
            printf 'step=%s outcome=%s%s\n' f0 "$O_F0" ""
            printf 'step=%s outcome=%s%s\n' attempt_python "$O_ATTEMPT_PYTHON" ""
            printf 'step=%s outcome=%s%s\n' attempt_rust "$O_ATTEMPT_RUST" ""
            printf 'step=%s outcome=%s%s\n' verdicts "$O_VERDICTS" " kind=information-only"
          } > "$out/diag-summary.txt" || echo "the summary could not be written"
          cat "$out/diag-summary.txt" || true
          find "$out" -type f | sort > "$RUNNER_TEMP/diag2/files.txt" || true
          cp "$RUNNER_TEMP/diag2/files.txt" "$out/files.txt" || true

      - name: Leak check (no token or runner secret in the upload)
        id: leak
        if: always()
        run: if grep -r -l -E '(ghs|ghp|gho|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$RUNNER_TEMP/diag2/out"; then echo "credential-like text found"; exit 1; fi

      - name: Upload everything the diagnostic recorded (always runs, after the leak check)
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g3h-diag2-windows
          path: ${{ runner.temp }}/diag2/out
          if-no-files-found: warn
          retention-days: 7

      - name: diag2, fail the job when a decisive step did not succeed (last step, after the upload; an information-only step never fails the job)
        id: verdict
        if: always()
        env:
          O_PINS: ${{ steps.pins.outcome }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_SHIM: ${{ steps.shim.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_PACKAGED: ${{ steps.packaged.outcome }}
          O_SMOKE: ${{ steps.smoke.outcome }}
          O_CONPTYPROBE: ${{ steps.conptyprobe.outcome }}
          O_TOOLS: ${{ steps.tools.outcome }}
          O_F0: ${{ steps.f0.outcome }}
          O_ATTEMPT_PYTHON: ${{ steps.attempt_python.outcome }}
          O_ATTEMPT_RUST: ${{ steps.attempt_rust.outcome }}
        run: |
          failed=0
          for pair in "pins=$O_PINS" "identity=$O_IDENTITY" "install=$O_INSTALL" "shim=$O_SHIM" "build=$O_BUILD" "packaged=$O_PACKAGED" "smoke=$O_SMOKE" "conptyprobe=$O_CONPTYPROBE" "tools=$O_TOOLS" "f0=$O_F0" "attempt_python=$O_ATTEMPT_PYTHON" "attempt_rust=$O_ATTEMPT_RUST"; do
            case "${pair#*=}" in success) ;; *) echo "the step ${pair%%=*} did not succeed (${pair#*=})"; failed=1 ;; esac
          done
          exit "$failed"
