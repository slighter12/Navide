        run: |
          uv --project backend run python "$RUNNER_TEMP/diag3/tools/diag3_attempt_run.py" "$PWD" "$RUNNER_TEMP/g3r2/rehearsal/attempt-6" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" rust-shell 1 shell-ready "$RUNNER_TEMP/diag3/out/shell-ready-rust" "$RUNNER_TEMP/diag3/private/shell-ready-rust"

