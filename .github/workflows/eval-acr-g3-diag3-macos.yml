          uv --project backend run python "$RUNNER_TEMP/diag3/tools/diag3_attempt_run.py" "$PWD" "$RUNNER_TEMP/g3r2/rehearsal/attempt-1" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" python 1 attempt "$RUNNER_TEMP/diag3/out/attempt-python-c1" "$RUNNER_TEMP/diag3/private/attempt-python-c1"

