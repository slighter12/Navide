name: G3 Diag3 macOS (not evidence)

# DRAFT (diag3). Evaluation only. A THIRD SHORT DIAGNOSTIC on the real macOS arm64 runner image (macos-15), built from the rehearsal draft on the rh19 pack. It is NOT evidence, it is NOT a rehearsal and
# it does not count against the rehearsal cap (D11): it runs no cost run, no matrix, no calibration chain and no measurement. The diag2 macOS job never got a runner, so this is the first time the
# whole Rust suite with timer coalescing off, the correctness step, F0 and a whole shell attempt run on macOS.
# TRIGGER: a push of eval/agent-cli-runtime-macos-diag-r3. The tip of that branch is the freeze head plus this one file.
# STAGE H5 FILLS, before this file is committed to the workflows directory of the branch: H5_FILL_PACK_COMMIT, H5_FILL_PACK_DIGEST.
# The identity step is the registered one with this file's own name.
# STEPS, copied block for block from the rehearsal draft, in its order: checkouts, head check, pack digest and overlay, pins, identity, Bun, the pinned CPython, uv, Rust, install, the interpreter check,
# the runner record, the sidecar build, the packaged build, `cargo test --no-run`, the settle sampler, the coalescing switch (guarded, exactly the rehearsal's step), the process-layout record, the timer
# record, `Rust tests` (the rehearsal's command: the setsid wrapper, --no-fail-fast, one test thread), the timer record after them, the correctness step, the restore (guarded, always runs); then
# `Build F0`, also the rehearsal's own block. A copied step that has no bound in the rehearsal draft gets a `timeout-minutes` line here and nothing else changes in it. Not copied: the load probe
# before the quiet gate, the quiet gate, Smoke, the fault-hook proof and the cost run.
# DIAG STEPS. `image`, `tools`, `holdsprobe`, `identityprobe`, the two information-only `shellready` steps and four shell attempts (cell 1 and cell 4 of each arm), as on Windows. The attempts run after
# the restore, under the runner's own timers, as the cost run does. `verdicts` then writes one verdict per check of each attempt.
# UPLOADED: per attempt what the Windows diagnostic uploads; the rehearsal's own records of the copied steps (runner facts, timer and layout records, the coalescing record) and the correctness records.
# The resource samples and the full latency arrays stay on the runner. Every step after install is `continue-on-error` with an id; the last step, after the upload, fails the job when a decisive step did
# not succeed (the steps the rehearsal calls information only never do). Every step has a bound and the job's timeout is their sum. The JavaScript runtime is plain default Bun; the pinned actions
# are the rehearsal draft's.

on:
  push:
    branches:
      - eval/agent-cli-runtime-macos-diag-r3

permissions:
  contents: read

env:
  FREEZE_H: 202084cf74eccb07bec366897ebf4c588799e72e
  PACK_COMMIT: "ecd29ccb31234e9d87c7b5f8eaf6a91faad21f3d"
  PACK_DIGEST: "a69d5779825de63942ed4c468ceb3e63dab9dba9e5f853ed111ab2ebb8069cbf"

jobs:
  diag:
    name: diag3-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 552
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
            system: Darwin
    defaults:
      run:
        shell: bash
    env:
      G3H_OS: ${{ matrix.system }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Pin line endings before any checkout
        timeout-minutes: 1
        run: git config --global core.autocrlf false

      - name: Check out evaluation branch
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the harness pack
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACK_COMMIT }}
          path: pack
          persist-credentials: false

      - name: Check the run head and the checked-out bytes
        timeout-minutes: 1
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git config --get core.autocrlf)" = "false"
          test -z "$(git status --porcelain -- . ':(exclude)pack')"

      - name: Verify the pack digest, then overlay it
        timeout-minutes: 3
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" pack/backend/tests/cli_regression/support/g3/hosted_pack.py digest pack > "$RUNNER_TEMP/pack-digest.txt"
          cat "$RUNNER_TEMP/pack-digest.txt"
          grep -q -F "$PACK_DIGEST" "$RUNNER_TEMP/pack-digest.txt"
          tar -C pack --exclude=.git -cf - . | tar -C . -xf -

      - name: Verify the g1e pins and the hosted inputs (first step after the overlay)
        timeout-minutes: 3
        id: pins
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" -B backend/tests/cli_regression/support/g3/hosted_preflight.py "$PWD"

      - name: Product identity against the freeze head (rf4c D7)
        timeout-minutes: 2
        id: identity
        run: |
          git cat-file -e "$FREEZE_H^{commit}"
          git diff --exit-code "$FREEZE_H" -- native src backend/agent_team_backend
          test -z "$(git status --porcelain --ignored -- native src backend/agent_team_backend)"
          test "$(git diff --name-only --no-renames "$FREEZE_H" "$GITHUB_SHA")" = ".github/workflows/eval-acr-g3-diag3-macos.yml"

      - name: Set up Bun (default version, no input)
        timeout-minutes: 5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the pinned CPython 3.12.11 build (python-build-standalone 20250818, sha256 checked before use, G4)
        id: pbs
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/pbs"
          curl -fsSL -o "$RUNNER_TEMP/pbs/python.tar.gz" "https://github.com/astral-sh/python-build-standalone/releases/download/20250818/cpython-3.12.11%2B20250818-aarch64-apple-darwin-install_only_stripped.tar.gz"
          got="$(shasum -a 256 < "$RUNNER_TEMP/pbs/python.tar.gz" | cut -d' ' -f1)"
          echo "python-build-standalone 20250818 archive sha256 $got"
          test "$got" = "bbf0c85d09a8173e50d18a0198f14d1de91eab17a593ccf9445f214fb0555547"
          tar -xzf "$RUNNER_TEMP/pbs/python.tar.gz" -C "$RUNNER_TEMP/pbs"
          "$RUNNER_TEMP/pbs/python/bin/python3.12" -VV

      - name: Set up uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Rust
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1

      - name: Install locked dependencies and record the toolchain
        timeout-minutes: 15
        id: install
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked --python "$RUNNER_TEMP/pbs/python/bin/python3.12" --no-python-downloads
          mkdir -p "$RUNNER_TEMP/g3r2h" "$RUNNER_TEMP/g3r2/rehearsal" "$RUNNER_TEMP/g3r2h-summary"
          rustc -vV | tee "$RUNNER_TEMP/g3r2h/rustc-vV.txt"

      - name: Check the harness interpreter, the pinned CPython 3.12.11 build with the registered SQLite 3.49.1 (E4, G4)
        timeout-minutes: 3
        id: sqlite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: backend/.venv/bin/python -B backend/tests/cli_regression/support/g3/hosted_preflight.py sqlite "$RUNNER_TEMP/pbs/python"

      - name: Record the runner (information only; it decides nothing)
        timeout-minutes: 3
        id: runnerfacts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          {
            echo "uname -m: $(uname -m)"
            sw_vers
            echo "hw.ncpu: $(sysctl -n hw.ncpu)"
            echo "hw.memsize: $(sysctl -n hw.memsize)"
            echo "hw.model: $(sysctl -n hw.model)"
            echo "cpu brand: $(sysctl -n machdep.cpu.brand_string)"
            echo "loadavg: $(sysctl -n vm.loadavg)"
            echo "ulimit -n: $(ulimit -n)"
            echo "kern.maxfilesperproc: $(sysctl -n kern.maxfilesperproc)"
            echo "kern.timer.coalescing_enabled: $(sysctl -n kern.timer.coalescing_enabled)"
            sysctl -a | grep -E '^kern\.timer_coalesce_' | sort || true
          } | tee "$RUNNER_TEMP/g3r2h-summary/runner-facts.txt"

      - name: Build the sidecars and the reader fixtures
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py build "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Build the packaged app
        id: packaged
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py packaged "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Compile the Rust tests without running them (rh12, M-1 A)
        timeout-minutes: 30
        id: cargobuild
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --no-run

      - name: Settle the machine before the Rust tests (rh12, M-1 A, information only; it decides nothing and cannot fail the job)
        id: rustsettle
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 17
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_load_probe.py "$RUNNER_TEMP/g3r2h-summary/load-probe-rust.json" --max-seconds 900

      - name: Switch timer coalescing off for the Rust tests and the correctness step (rh16 macos-1, information only; it decides nothing and cannot fail the job)
        id: coalesce
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          {
            echo "before: kern.timer.coalescing_enabled=$(sysctl -n kern.timer.coalescing_enabled)"
            sudo -n sysctl -w kern.timer.coalescing_enabled=0 || echo "sysctl -w failed with status $?"
            echo "after: kern.timer.coalescing_enabled=$(sysctl -n kern.timer.coalescing_enabled)"
          } | tee "$RUNNER_TEMP/g3r2h-summary/timer-coalescing.txt"

      - name: Record the process group and the session the Rust tests run in (rh9, information only; it decides nothing and cannot fail the job)
        id: layout
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_process_layout.py "$RUNNER_TEMP/g3r2h-summary/process-layout.json"

      - name: Record the load and the timer latency before the Rust tests (rh12, M-1 B; rh13 B2, the last step before them, after the layout probe; information only, it decides nothing and cannot fail the job)
        id: timerbefore
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_timer_probe.py before "$RUNNER_TEMP/g3r2h-summary/rust-context-before.json"

      - name: Rust tests
        timeout-minutes: 60
        id: cargo
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          perl -MPOSIX -e 'defined(my $pid = fork) or die "fork: $!\n"; if (!$pid) { POSIX::setsid() != -1 or die "setsid: $!\n"; exec @ARGV or die "exec: $!\n" } waitpid($pid, 0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' -- cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --no-fail-fast -- --test-threads=1

      - name: Record the load and the timer latency after the Rust tests (rh12, M-1 B, information only; it decides nothing and cannot fail the job)
        id: timerafter
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_timer_probe.py after "$RUNNER_TEMP/g3r2h-summary/rust-context-after.json"

      - name: Correctness, the 21 G1-E rows from the gates registry on the F0 sidecar, gated by case, plus the frozen macOS G2 part (row table, collected-and-passed gate, sidecar receipt, E1, G1)
        id: correctness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 120
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py correctness "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Put timer coalescing back as it was before the Rust tests (rh16 macos-1, information only; it decides nothing and cannot fail the job)
        id: coalescerestore
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          original="$(sed -n 's/^before: kern.timer.coalescing_enabled=//p' "$RUNNER_TEMP/g3r2h-summary/timer-coalescing.txt")"
          case "$original" in 0|1) sudo -n sysctl -w kern.timer.coalescing_enabled="$original" || echo "sysctl -w failed with status $?" ;; *) echo "no original value recorded: $original" ;; esac
          echo "restored: kern.timer.coalescing_enabled=$(sysctl -n kern.timer.coalescing_enabled)" | tee -a "$RUNNER_TEMP/g3r2h-summary/timer-coalescing.txt"

      - name: diag3, record the runner image version (rh17 review N-6; information only, it cannot fail the job)
        id: image
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/diag3/out"
          {
            echo "ImageOS: ${ImageOS:-unknown}"
            echo "ImageVersion: ${ImageVersion:-unknown}"
            echo "RUNNER_OS: ${RUNNER_OS:-unknown}"
            echo "RUNNER_ARCH: ${RUNNER_ARCH:-unknown}"
            echo "uname -sr: $(uname -sr 2>&1 || true)"
            sw_vers 2>&1 || true
          } | tee "$RUNNER_TEMP/diag3/out/image.txt"

      - name: diag3, write the four diagnostic tools (they exist on this runner only) and check their bytes
        id: tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/diag3/tools" "$RUNNER_TEMP/diag3/out" "$RUNNER_TEMP/diag3/private"
          cat > "$RUNNER_TEMP/diag3/tools/diag3_attempt_run.py" <<'DIAG3_EOF_ATTEMPT_RUN'
          """diag3 (NOT evidence). Runs ONE step of the diag test file through the pack's own cost path, so the step gets exactly the plan step, the environment and the sequencer the rehearsal's cost run gives
          its shell attempts.

              uv --project backend run python diag3_attempt_run.py REPO PLAN_OUT F0 BUILD_RECORD PRE_OUT SMOKE_OUT ARM CELL KIND RECORDS PRIVATE        (from the repository root)

          ARM is python or rust-shell, CELL is 1 or 4, KIND is `attempt` (one whole shell attempt of that arm and cell) or `shell-ready` (no attempt: the READY line of the two ordinary shells of that arm).
          `hosted_driver.main(["cost", REPO, PLAN_OUT, F0, BUILD_RECORD, PRE_OUT, SMOKE_OUT, "--rehearsal"])` builds the rehearsal's real cost plan (the hosted environment, the Bun preload, the termios flag, the
          freeze and sidecar variables, the rehearsal flag) and hands it to its plan runner. This tool is that plan runner: it takes the plan's `calibrate-shell` step and nothing else, puts the diag test file in
          the place of `g3Matrix.test.ts` in its argv, adds the diag variables, and runs that one step through the pack's unchanged `_run_plan` under its own record name. The cost run's precondition, its F0
          re-check before each step and every other step of the plan are NOT run: the diag test file makes the per-attempt freeze and toolchain checks itself and records what they say. No cost run, no matrix,
          no measurement. PLAN_OUT must be a rehearsal output directory (`$RUNNER_TEMP/g3r2/rehearsal/attempt-<n>`): `hosted_driver` refuses any other.
          Afterwards the redacted tail of the step's own log (the vitest output) is written to RECORDS/step-log-tail.txt.
          """
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))

          STEP = "calibrate-shell"
          MATRIX_TEST = "tests/cli/g3Matrix.test.ts"
          DIAG_TEST = "tests/cli/g3hDiag3Attempt.test.ts"
          GATE = "ACR_DIAG3_ATTEMPT"
          RECORD_NAME = "run-diag3-attempt.json"
          MODES = ("python", "rust-shell")
          CELLS = ("1", "4")
          KINDS = {"attempt": "attempt.json", "shell-ready": "shell-ready.json"}      # the kind and the file its test writes into RECORDS
          TAIL_CHARS = 20000


          def substituted(plan: list[dict], mode: str, cell: str, kind: str, records: str, private: str) -> list[dict]:
              """The cost plan's own shell-attempt step with the diag test file in the place of the matrix one. Anything but a plan that holds that step once, as the pack builds it, is refused."""
              steps = [step for step in plan if step["name"] == STEP]
              if len(steps) != 1 or steps[0]["argv"].count(MATRIX_TEST) != 1 or steps[0]["env"].get("ACR_G3") != "calibrate" or "ACR_G3_FREEZE" not in steps[0]["env"] or "ACR_G3_SIDECAR" not in steps[0]["env"]:
                  raise RuntimeError("the pack's cost plan does not hold the one calibrate-shell step this tool substitutes")
              if mode not in MODES or cell not in CELLS or kind not in KINDS:
                  raise RuntimeError("ARM is python or rust-shell, CELL is 1 or 4, KIND is attempt or shell-ready")
              step = steps[0]
              env = {**step["env"], "ACR_G3": "diag3", GATE: "1", "ACR_DIAG3_ARM": mode, "ACR_DIAG3_CELL": cell, "ACR_DIAG3_KIND": kind, "ACR_G3_OUT": records, "ACR_DIAG3_PRIVATE": private, "ACR_G1E_KEEP": "1"}
              return [{**step, "argv": [DIAG_TEST if word == MATRIX_TEST else word for word in step["argv"]], "env": env, "outputs": [f"{records}/{KINDS[kind]}"]}]


          def main(argv: list[str], *, inner=None, **injected) -> int:
              if len(argv) != 11:
                  print(__doc__, file=sys.stderr)
                  return 64
              repo, plan_out, f0, build_record, pre_out, smoke_out, mode, cell, kind, records, private = argv
              from tests.cli_regression.support.g3 import hosted_driver
              run = hosted_driver._run_plan if inner is None else inner
              records, private = str(Path(records).resolve()), str(Path(private).resolve())
              seen: dict = {}

              def run_plan(plan: list[dict], out, _record_name: str, **kwargs) -> int:
                  seen["planSteps"] = [step["name"] for step in plan]
                  return run(substituted(plan, mode, cell, kind, records, private), out, RECORD_NAME, record_extra=kwargs.get("record_extra"))

              code = hosted_driver.main(["cost", repo, plan_out, f0, build_record, pre_out, smoke_out, "--rehearsal"], run_plan=run_plan, **injected)
              try:
                  Path(records).mkdir(parents=True, exist_ok=True)
                  log = Path(plan_out).resolve() / "logs" / f"{STEP}.log"
                  tail = "\n".join(hosted_driver.redacted_tail(log.read_text(encoding="utf-8", errors="replace"))) if log.is_file() else "the step wrote no log"
                  (Path(records) / "step-log-tail.txt").write_text(tail[-TAIL_CHARS:] + "\n", encoding="utf-8")
                  (Path(records) / "launcher.json").write_text(json.dumps({"schema": "acr-g3h-diag3-launcher/1", "notEvidence": True, "mode": mode, "cell": int(cell) if cell in CELLS else cell, "kind": kind, "exit": code,
                                                                        "costPlanSteps": seen.get("planSteps"), "stepRun": STEP, "testFile": DIAG_TEST}, indent=1, sort_keys=True) + "\n", encoding="utf-8")
              except Exception as error:  # noqa: BLE001 - the records are information; the step's exit code is the result
                  print(f"diag3: the step log tail could not be written: {type(error).__name__}")
              return code


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          DIAG3_EOF_ATTEMPT_RUN
          cat > "$RUNNER_TEMP/diag3/tools/diag3_attempt_report.py" <<'DIAG3_EOF_ATTEMPT_REPORT'
          """diag3 (NOT evidence). What one attempt's records say, check by check, written as fixed verdict words and the checks' own texts.

              uv --project backend run python -B diag3_attempt_report.py RECORDS PRIVATE F0 MODE        (from the repository root)

          RECORDS holds what `g3hDiag3Attempt.test.ts` wrote for the upload (`attempt.json`); PRIVATE holds the whole receipt and the resource samples, which are read here and never copied. Writes
          RECORDS/attempt-report.json:
            phases    every phase of the attempt with its outcome (`passed`, `failed`, `running`, or `not reached`)
            peers     per measured peer: the reader's delta, what the peer accepted, the registered line count L of the cell, `delta - accepted - L`, whether that is inside the Windows bound, `logFile.size`,
                      whether the log file's identity at the close is the one taken at create (with the bit lengths of the four numbers, not the numbers), and the problems the ledger rule reports for the
                      record (with the hosted seams of this platform installed)
            resizeAckMs   the 20 report-only resize probes
            processes what the driver sampled, as names only: per (component, category, executable name, version probe) how many processes, the pids named `sidecar`, and whether every sampled process that
                      is not the backend has a sampled parent. No time, CPU or memory value is read.
            decider   the three stages of the rehearsal verdict's per-receipt check, EACH run and listed (`rehearsal_verdict._trial_check` returns at its first failed stage, which hid the later ones in diag2):
                      `summarise.structure_problems`, `summarise.consistency_problems`, `summarise.trial_problems`
            verdicts  one line per check, `pass` / `FAIL` / `not reached` / `not run`, so that every failure of the attempt is listed
          It always exits 0 and writes the file: a check that cannot run is listed with the class of its error.
          """
          from __future__ import annotations

          import json
          import platform
          import sys
          from collections import Counter
          from pathlib import Path, PureWindowsPath

          sys.path.insert(0, str(Path.cwd() / "backend"))

          SCHEMA = "acr-g3h-diag3-report/1"


          class Files:
              """The two private files, in the shape the decider reads a bundle: the receipt by name, the resource samples under the name it derives from it."""
              def __init__(self, private: Path) -> None:
                  self.private = private

              def read_json(self, _name: str):
                  return json.loads((self.private / "receipt.json").read_text(encoding="utf-8"))

              def exists(self, _name: str) -> bool:
                  return (self.private / "resources.jsonl").is_file()

              def read_jsonl(self, _name: str):
                  return [json.loads(line) for line in (self.private / "resources.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]


          def load(path: Path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None


          def guarded(errors: dict, name: str, run, default=None):
              try:
                  return run()
              except Exception as error:  # noqa: BLE001 - one check that cannot run must not hide the others
                  errors[name] = type(error).__name__
                  return default


          def bits(value) -> int | None:
              return value.bit_length() if isinstance(value, int) and not isinstance(value, bool) else None


          def peer_rows(receipt: dict, count: int, hosted_seams, summarise, errors: dict) -> list[dict]:
              rows = []
              for index, record in enumerate(receipt.get("ledgers") or []):
                  row = {"peer": index}
                  try:
                      delta = record["close"]["read_total"] - record["origin"]["read_total"]
                      accepted = record["peer"]["acceptedSinceOrigin"]
                      lines = hosted_seams.registered_lines(count)
                      log_file = record.get("logFile") or {}
                      created = log_file.get("inodeAtCreate") if isinstance(log_file.get("inodeAtCreate"), list) and len(log_file.get("inodeAtCreate")) == 2 else [None, None]
                      row.update(readerDelta=delta, peerAccepted=accepted, registeredLines=lines, deltaMinusAccepted=delta - accepted, deltaMinusAcceptedMinusLines=delta - accepted - lines,
                                 slackBytes=hosted_seams.LEDGER_SLACK_BYTES, insideTheWindowsBound=hosted_seams.ledger_bound_problem(delta, accepted, lines) is None,
                                 logFileSize=log_file.get("size"), logIdentity=record.get("logIdentity"),
                                 logFileIdentityAtCloseIsTheOneAtCreate=[log_file.get("dev"), log_file.get("ino")] == created,
                                 logFileIdentityBits={"devAtClose": bits(log_file.get("dev")), "devAtCreate": bits(created[0]), "inoAtClose": bits(log_file.get("ino")), "inoAtCreate": bits(created[1])},
                                 originReadTotal=record["origin"]["read_total"], originStable=record["origin"].get("stable"))
                  except Exception as error:  # noqa: BLE001
                      row["recordError"] = type(error).__name__
                  row["ledgerProblems"] = guarded(errors, f"ledger_problems[{index}]", lambda record=record, index=index: summarise.ledger_problems(record, index, count))
                  rows.append(row)
              return rows


          def process_rows(private: Path, receipt: dict) -> dict:
              """Names only, from the driver's samples: which kinds of process were sampled and how they hang together. A Windows executable is named by `PureWindowsPath`, which also reads a POSIX path."""
              seen: dict[int, dict] = {}
              samples = 0
              for line in (private / "resources.jsonl").read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  samples += 1
                  for process in json.loads(line).get("processes") or []:
                      seen.setdefault(process["pid"], process)
              backend = (receipt.get("backend") or {}).get("pid")
              kinds = Counter((p.get("component"), p.get("category"), PureWindowsPath(str(p.get("executable") or "")).name, bool(p.get("versionProbe"))) for p in seen.values())
              sidecars = sorted(pid for pid, p in seen.items() if p.get("component") == "sidecar")
              return {"samples": samples, "processesSeen": len(seen), "sidecarPids": sidecars, "sidecarParentIsTheBackend": [seen[pid].get("ppid") == backend for pid in sidecars],
                      "processesWhoseParentWasNotSampled": sum(1 for pid, p in seen.items() if pid != backend and p.get("ppid") not in seen),
                      "kinds": [{"component": c, "category": k, "executable": name, "versionProbe": probe, "processes": n} for (c, k, name, probe), n in sorted(kinds.items(), key=lambda item: tuple(str(x) for x in item[0]))]}


          def build(records: Path, private: Path, f0_path: Path, mode: str, system: str | None = None) -> dict:
              from tests.cli_regression.support.g3 import hosted_posix_stubs
              hosted_posix_stubs.install()      # before the imports below, as the hosted helper does (Windows has no os.getloadavg, which a g1e module reads at import)
              from tests.cli_regression.support.g1e import summarise
              from tests.cli_regression.support.g3 import hosted_seams

              system = system or platform.system()
              errors: dict = {}
              out: dict = {"schema": SCHEMA, "notEvidence": True, "mode": mode, "system": system, "verdicts": []}
              attempt = load(records / "attempt.json")
              receipt = load(private / "receipt.json")
              f0 = load(f0_path)
              undo = guarded(errors, "install-seams", lambda: hosted_seams.install(system))
              try:
                  say = lambda check, verdict, detail=None: out["verdicts"].append({"check": check, "verdict": verdict, **({"detail": detail} if detail not in (None, [], "") else {})})
                  say("the attempt step wrote its record (attempt.json)", "pass" if isinstance(attempt, dict) else "FAIL")
                  for step in (attempt or {}).get("steps") or []:
                      say(f"helper step {step.get('step')}", "pass" if step.get("ok") else "FAIL", step.get("detail"))
                  if isinstance(attempt, dict):
                      say("freeze-verify reports no problem", "not run" if attempt.get("freezeProblems") is None else "pass" if attempt["freezeProblems"] == [] else "FAIL", attempt.get("freezeProblems"))
                      say("the toolchain check matches", "not run" if attempt.get("toolchainMatch") is None else "pass" if attempt["toolchainMatch"] is True else "FAIL", attempt.get("toolchainMismatches"))
                      say("the attempt code returned a receipt", "pass" if attempt.get("attemptRan") else "FAIL", attempt.get("thrown"))
                      out.update(driverLogTee=attempt.get("driverLogTee"), driverLogBytes=attempt.get("driverLogBytes"), rootKept=attempt.get("rootKept"), wallSeconds=attempt.get("wallSeconds"))
                  if not isinstance(receipt, dict):
                      say("every phase", "not reached", "no receipt")
                      out.update(attemptRan=False, phases=[], peers=[], resizeAckMs=[], decider=None, processes=None)
                      return out
                  count = receipt.get("count")
                  outcomes = receipt.get("phaseOutcomes") or {}
                  out.update(attemptRan=True, count=count, passed=receipt.get("passed"), evidenceValid=receipt.get("evidenceValid"), stopReason=receipt.get("stopReason"), failure=receipt.get("failure"))
                  out["phases"] = [{"phase": name, "outcome": outcomes.get(name, "not reached")} for name in (*summarise.PHASE_SEQUENCE, "cleanup")]
                  for row in out["phases"]:
                      say(f"phase {row['phase']}", {"passed": "pass", "failed": "FAIL", "running": "FAIL"}.get(row["outcome"], "not reached"), None if row["outcome"] == "passed" else row["outcome"])
                  say("the attempt passed with valid evidence", "pass" if receipt.get("passed") is True and receipt.get("evidenceValid") is True and not receipt.get("stopReason") else "FAIL", receipt.get("failure"))
                  proof = receipt.get("proof")
                  say("the runtime proof", "not reached" if not isinstance(proof, dict) else "pass" if proof.get("ok") is True else "FAIL", (proof or {}).get("failures") if isinstance(proof, dict) else None)
                  out["processes"] = guarded(errors, "processes", lambda: process_rows(private, receipt))
                  if mode == "rust-shell" and isinstance(out["processes"], dict):
                      named = out["processes"]["sidecarPids"]
                      say("the driver's samples name exactly one sidecar, a child of the backend", "pass" if len(named) == 1 and out["processes"]["sidecarParentIsTheBackend"] == [True] else "FAIL", {"sidecarsNamed": len(named)})
                  out["peers"] = peer_rows(receipt, count, hosted_seams, summarise, errors) if isinstance(count, int) else []
                  if not out["peers"]:
                      say("the byte ledger of every peer", "not reached", "the receipt holds no ledger record (the attempt stopped before its after-exit checks)")
                  for row in out["peers"]:
                      say(f"peer {row['peer']}: the ledger rules (with this platform's seams)", "FAIL" if row["ledgerProblems"] or row["ledgerProblems"] is None else "pass", row["ledgerProblems"])
                      say(f"peer {row['peer']}: delta - accepted - L inside [0, slack]", "not run" if system != "Windows" else "pass" if row.get("insideTheWindowsBound") else "FAIL",
                          {key: row.get(key) for key in ("deltaMinusAcceptedMinusLines", "deltaMinusAccepted", "registeredLines", "slackBytes")})
                      say(f"peer {row['peer']}: the log file's identity at the close is the one at create", "pass" if row.get("logFileIdentityAtCloseIsTheOneAtCreate") else "FAIL", row.get("logFileIdentityBits"))
                  latencies = receipt.get("latencies") or {}
                  out["resizeAckMs"] = latencies.get("resize_ack_ms") or []
                  say("20 resize probes recorded", "pass" if len(out["resizeAckMs"]) == 20 else "not reached" if outcomes.get("resize_ack") is None else "FAIL", len(out["resizeAckMs"]))
                  for index, burst in enumerate(receipt.get("burstChecks") or []):
                      say(f"peer {index}: the burst endpoint check", "pass" if isinstance(burst, dict) and burst.get("kind") == "pass" else "FAIL", burst if isinstance(burst, dict) else None)
                  stages: dict = {}
                  if isinstance(f0, dict):
                      files = Files(private)
                      trial = files.read_json("receipt.json")
                      resources = "receipt" + summarise.RESOURCES_SUFFIX
                      stages["structure"] = guarded(errors, "summarise.structure_problems", lambda: list(summarise.structure_problems(trial, f0, files, resources)[0]))
                      stages["consistency"] = guarded(errors, "summarise.consistency_problems", lambda: list(summarise.consistency_problems(trial)))
                      stages["trial"] = guarded(errors, "summarise.trial_problems", lambda: list(summarise.trial_problems({k: v for k, v in trial.items() if k != "_samples"}, f0, mode, trial.get("count"))))
                  out["decider"] = {"check": "the three stages of rehearsal_verdict._trial_check, each run whatever the others said", "stages": stages}
                  for name, text in (("structure", "the receipt's structure (summarise.structure_problems)"), ("consistency", "the receipt's consistency (summarise.consistency_problems)"),
                                     ("trial", "the trial's evidence (summarise.trial_problems)")):
                      problems = stages.get(name)
                      say(text, "not run" if problems is None else "pass" if problems == [] else "FAIL", problems)
                  return out
              finally:
                  out["checkErrors"] = errors
                  if callable(undo):
                      undo()


          def main(argv: list[str]) -> int:
              if len(argv) != 4:
                  print(__doc__, file=sys.stderr)
                  return 64
              records, private, f0_path, mode = Path(argv[0]), Path(argv[1]), Path(argv[2]), argv[3]
              try:
                  report = build(records, private, f0_path, mode)
              except Exception as error:  # noqa: BLE001 - the report is information; it never fails its step
                  report = {"schema": SCHEMA, "notEvidence": True, "mode": mode, "reportError": type(error).__name__, "verdicts": [{"check": "the report itself", "verdict": "FAIL", "detail": type(error).__name__}]}
              records.mkdir(parents=True, exist_ok=True)
              (records / "attempt-report.json").write_text(json.dumps(report, indent=1, sort_keys=True, default=str) + "\n", encoding="utf-8")
              for row in report.get("verdicts", []):
                  print(f"{mode}: {row['verdict']:<11} {row['check']}")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          DIAG3_EOF_ATTEMPT_REPORT
          cat > "$RUNNER_TEMP/diag3/tools/diag3_probes.py" <<'DIAG3_EOF_PROBES'
          """diag3 (NOT evidence). Two small probes of what the log final check and the ledger's log-file rule rest on, run on the runner with this platform's hosted seams installed.

              uv --project backend run python -B diag3_probes.py holds OUT.json        (from the repository root)
              uv --project backend run python -B diag3_probes.py identity OUT.json

          holds     `log_final.holds` as an attempt's helper calls it: for a file a child process holds open (expected True), for this process (False), for the child after it closed the file (False), and
                    for the child after it ended (an inspection error, never a silent False). On Windows the check is psutil's open-files list, which no hosted run has shown to list a held file.
          identity  one file's identity as the two tools of an attempt take it: Python's `os.stat` (the close side, `log_final.read_once`, read once without the seams and once with them) and the runner's
                    `statSync` on Bun (the create side, as `g3ShellAttempt.ts` reduces it). It records the bit length of every number and whether the pairs are equal, raw and as the attempt compares them.
                    The numbers themselves are a volume serial number and a file index of the runner's temporary directory.
          Exit 0 when what the attempt relies on holds on this platform, 1 when it does not; the record is written either way.
          """
          from __future__ import annotations

          import json
          import os
          import platform
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))

          SCHEMA = "acr-g3h-diag3-probe/1"
          # The holder prints its own pid: under a Windows venv `sys.executable` is a launcher whose child is the interpreter, and the interpreter is the process that holds the file.
          HOLDER = ("import os, sys\nf = open(sys.argv[1], 'ab')\nprint('open', os.getpid(), flush=True)\nsys.stdin.readline()\nf.close()\nprint('closed', flush=True)\nsys.stdin.readline()\n")
          STAT_JS = ("const fs=require('fs');const i=fs.statSync(process.env.DIAG3_STAT_PATH,{bigint:true});"
                     "console.log(JSON.stringify({dev:String(i.dev),ino:String(i.ino),devAsTheAttemptTakesIt:String(process.platform==='win32'?BigInt.asUintN(32,i.dev):i.dev)}))")


          def seams():
              from tests.cli_regression.support.g3 import hosted_posix_stubs
              hosted_posix_stubs.install()
              from tests.cli_regression.support.g1e import log_final
              from tests.cli_regression.support.g3 import hosted_seams
              return log_final, hosted_seams


          def timed(call) -> tuple[object, float]:
              start = time.perf_counter()
              try:
                  value = call()
              except Exception as error:  # noqa: BLE001 - the class of the error is the result
                  value = f"raised {type(error).__name__}"
              return value, round((time.perf_counter() - start) * 1000, 1)


          def holds(system: str) -> dict:
              log_final, hosted_seams = seams()
              with tempfile.TemporaryDirectory(prefix="diag3-holds-") as scratch:
                  target = Path(scratch) / "held.log"
                  target.write_bytes(b"x")
                  child = subprocess.Popen([sys.executable, "-c", HOLDER, str(target)], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
                  undo = hosted_seams.install(system)
                  try:
                      identity = log_final.identity(target)
                      word, _, pid_text = child.stdout.readline().strip().partition(" ")
                      said, holder = [word], int(pid_text)
                      held, held_ms = timed(lambda: log_final.holds(holder, identity))
                      own, own_ms = timed(lambda: log_final.holds(os.getpid(), identity))
                      child.stdin.write("\n")
                      child.stdin.flush()
                      said.append(child.stdout.readline().strip())
                      released, released_ms = timed(lambda: log_final.holds(holder, identity))
                      child.stdin.write("\n")
                      child.stdin.flush()
                      child.wait(timeout=30)
                      time.sleep(0.5)      # the interpreter behind a launcher ends a moment after the launcher does
                      gone, gone_ms = timed(lambda: log_final.holds(holder, identity))
                  finally:
                      undo()
                      if child.poll() is None:
                          child.kill()
              got = {"aChildThatHoldsTheFile": held, "thisProcess": own, "theChildAfterItClosedTheFile": released, "theChildAfterItEnded": gone}
              want = {"aChildThatHoldsTheFile": True, "thisProcess": False, "theChildAfterItClosedTheFile": False, "theChildAfterItEnded": "raised InspectionError"}
              return {"probe": "holds", "checkInstalled": getattr(hosted_seams.hosted_host.holds_for(system), "__name__", "?"), "childSaid": said, "holderIsTheStartedProcess": holder == child.pid, "got": got, "expected": want,
                      "callMs": {"held": held_ms, "own": own_ms, "released": released_ms, "gone": gone_ms}, "ok": got == want}


          def identity(system: str) -> dict:
              log_final, hosted_seams = seams()
              bun = shutil.which("bun")
              with tempfile.TemporaryDirectory(prefix="diag3-identity-") as scratch:
                  target = Path(scratch) / "peer-0.log"
                  target.write_bytes(b"x")
                  info = os.stat(target)
                  raw = log_final.read_once(target)
                  undo = hosted_seams.install(system)
                  try:
                      seamed = log_final.read_once(target)
                  finally:
                      undo()
                  runner = None
                  if bun:
                      done = subprocess.run([bun, "-e", STAT_JS], capture_output=True, text=True, timeout=60, env={**os.environ, "DIAG3_STAT_PATH": str(target)})
                      lines = [line for line in done.stdout.splitlines() if line.strip()]
                      runner = json.loads(lines[-1]) if done.returncode == 0 and lines else None
              bit = lambda value: int(value).bit_length() if value is not None else None
              out = {"probe": "identity", "bunFound": bool(bun), "bunAnswered": runner is not None,
                     "pythonBits": {"dev": bit(info.st_dev), "ino": bit(info.st_ino)}, "pythonBehindTheSeamsBits": {"dev": bit(seamed["dev"]), "ino": bit(seamed["ino"])},
                     "readOnceWithoutTheSeamsIsOsStat": (raw["dev"], raw["ino"]) == (info.st_dev, info.st_ino)}
              if runner is not None:
                  dev, ino, taken = int(runner["dev"]), int(runner["ino"]), int(runner["devAsTheAttemptTakesIt"])
                  out.update(runnerBits={"dev": bit(dev), "ino": bit(ino), "devAsTheAttemptTakesIt": bit(taken)},
                             rawPairsEqual=(dev, ino) == (info.st_dev, info.st_ino), rawDevEqual=dev == info.st_dev, rawInoEqual=ino == info.st_ino,
                             # both sides reach the receipt as JavaScript numbers (doubles): Python's through the helper's JSON, the runner's through `Number(...)`
                             pairsEqualAsTheAttemptComparesThem=float(seamed["dev"]) == float(taken) and float(seamed["ino"]) == float(ino),
                             lowHalfOfPythonsDevIsTheRunnersDev=(info.st_dev & 0xFFFFFFFF) == (dev & 0xFFFFFFFF))
              out["ok"] = bool(out.get("pairsEqualAsTheAttemptComparesThem"))
              return out


          def main(argv: list[str]) -> int:
              if len(argv) != 2 or argv[0] not in ("holds", "identity"):
                  print(__doc__, file=sys.stderr)
                  return 64
              system = platform.system()
              try:
                  record = holds(system) if argv[0] == "holds" else identity(system)
              except Exception as error:  # noqa: BLE001 - a probe that cannot run says so and fails its step
                  record = {"probe": argv[0], "ok": False, "probeError": type(error).__name__}
              record = {"schema": SCHEMA, "notEvidence": True, "system": system, **record}
              out = Path(argv[1])
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_text(json.dumps(record, indent=1, sort_keys=True, default=str) + "\n", encoding="utf-8")
              print(json.dumps(record, indent=1, sort_keys=True, default=str))
              return 0 if record.get("ok") else 1


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          DIAG3_EOF_PROBES
          cat > tests/cli/g3hDiag3Attempt.test.ts <<'DIAG3_EOF_ATTEMPT_TEST'
          // diag3 (NOT evidence). The diag workflow writes this file into tests/cli/ on the runner; it is in no branch and in no pack. Gated: it does nothing unless ACR_DIAG3_ATTEMPT=1 (diag3_attempt_run.py sets it).
          //
          // ACR_DIAG3_KIND=attempt: ONE shell attempt of ONE arm (ACR_DIAG3_ARM: python | rust-shell) and ONE cell (ACR_DIAG3_CELL: 1 | 4) through the pack's own attempt code, `g3ShellAttempt.runAttempt`, with
          // the spec `g3Matrix.test.ts` builds for a discarded warm-up of kind `calibration` (repeat 0) and the same helper calls before it (freeze-verify, toolchain-check, checked-inputs, constants). Two things
          // differ from `g3Matrix`, both so that one run lists every failure: a freeze or toolchain problem is RECORDED and the attempt still runs (g3Matrix would not start it), and the attempt's root is kept when
          // it did not pass (ACR_G1E_KEEP=1, the attempt's own rule for a non-measured attempt). The attempt code itself is untouched.
          //
          // ACR_DIAG3_KIND=shell-ready: no attempt. For one arm it starts the attempt's own driver three times and creates the two ordinary shells exactly as the attempt does, records the raw bytes of each up to
          // its READY line, and says where the console's title sequence stood (inside the line or after it) and whether the line parses with CSI sequences removed only (rh18) and through the pack's view (rh19).
          // It exists because the cause of diag2's first Rust-arm failure was inferred: this records the shape itself.
          //
          // What an attempt writes:
          //   <ACR_DIAG3_PRIVATE>/receipt.json, resources.jsonl   the whole receipt and the resource samples; NOT uploaded: diag3_attempt_report.py reads them on the runner and writes verdict texts only
          //   <ACR_G3_OUT>/receipt.json    the receipt with every latency array given as its length, but for `resize_ack_ms` (the 20 report-only resize probes), which is kept
          //   <ACR_G3_OUT>/attempt.json    the helper steps, the failure text, every phase outcome, the redacted tail of the driver's own output, and what the kept root holds
          //   <ACR_G3_OUT>/root/           from a kept root: the peer receipts, the CK proof, the identities, the runtime receipts, the redacted tails of the backend logs, the peer logs and the peer bytes
          // The driver's output: `runAttempt` owns the driver process, so this file wraps `ChildProcess.prototype.spawn`, through which every spawn goes, and adds its own listener to the driver's stdout and
          // stderr (nothing is taken away from the attempt, which adds its listeners right after). If that cannot be installed the attempt runs all the same and `driverLogTee` says so.
          import childProcess, { execFileSync, spawn } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { copyFileSync, existsSync, mkdirSync, mkdtempSync, readdirSync, readFileSync, realpathSync, rmSync, statSync, writeFileSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join, resolve } from 'node:path'
          import { setTimeout as delay } from 'node:timers/promises'
          import { expect, it } from 'vitest'
          import { buildAgentPaneCommand } from '../../src/main/plugins/agentPaneCommand'
          import { createWsClient, type TerminalOutputFrame } from '../../src/shared/wsClient'
          import { redactDiagnostic } from './baselineArtifacts'
          import { classifyAttempt, type ToolchainRecord } from './g1eRun'
          import { conptyColumns, conptyView } from './g3hConpty'
          import { runAttempt, type AttemptSpec, type FreezeBinding } from './g3ShellAttempt'

          const enabled = process.env.ACR_DIAG3_ATTEMPT === '1'
          const selfCheck = process.env.ACR_DIAG3_SELFCHECK === '1'
          const kind = process.env.ACR_DIAG3_KIND ?? 'attempt'
          const mode = process.env.ACR_DIAG3_ARM ?? ''
          const cell = Number(process.env.ACR_DIAG3_CELL ?? '1') // the registered cells: 1 (one measured peer, 40 burst rounds) and 4 (four peers, 10 rounds each; peer 0 gets the 20 resize probes)
          const DRIVER_MODULE = 'tests.cli_regression.support.g1e.driver'
          const ROOT_PREFIX = 'navide-g1e-' // `runAttempt`: mkdtempSync(join(tmpdir(), 'navide-g1e-'))
          const TAIL_CHARS = 20_000
          const COPY_LIMIT = 24 * 1024 * 1024
          const python = resolve('backend/.venv', process.platform === 'win32' ? 'Scripts/python.exe' : 'bin/python')
          const out = resolve(process.env.ACR_G3_OUT ?? 'test-results/ci/g3/diag3-attempt')
          const priv = resolve(process.env.ACR_DIAG3_PRIVATE ?? join(out, 'private'))
          const sidecar = process.env.ACR_G3_SIDECAR ? resolve(process.env.ACR_G3_SIDECAR) : null
          const sidecarArg = sidecar ?? '-'
          const root = resolve('.')
          const helper = (args: string[]): string => execFileSync(python, ['-B', '-m', 'tests.cli_regression.support.g3.helper', ...args], { cwd: resolve('backend'), encoding: 'utf8', timeout: 180_000, maxBuffer: 64 * 1024 * 1024 })
          const sha256 = (data: Buffer | string): string => createHash('sha256').update(data).digest('hex')
          const brief = (error: unknown, limit = 2000): string => redactDiagnostic(error instanceof Error ? `${error.name}: ${error.message}` : String(error)).slice(0, limit)

          // ---------------------------------------------------------------------------------------------------------------- the driver's own output
          const driverLog: string[] = []
          let driverSpawns = 0
          let teeState = 'not installed'
          try {
            // Every `spawn` of node:child_process goes through this one method, whichever way a module imported `spawn`; `options.args` is the argv of the child (argv[0] included).
            const proto = (childProcess as unknown as { ChildProcess?: { prototype: Record<string, any> } }).ChildProcess?.prototype
            const original = proto ? proto.spawn : undefined
            if (!proto || typeof original !== 'function') teeState = 'not installed: ChildProcess.prototype.spawn is not a function on this runtime'
            else {
              proto.spawn = function (this: any, options: any, ...rest: unknown[]): unknown {
                const result = original.call(this, options, ...rest)
                try {
                  if (options && Array.isArray(options.args) && options.args.includes(DRIVER_MODULE)) {
                    driverSpawns++
                    for (const stream of [this.stdout, this.stderr]) if (stream) stream.on('data', (chunk: Buffer | string) => { driverLog.push(typeof chunk === 'string' ? chunk : chunk.toString('utf8')) })
                  }
                } catch { /* the listener is information only: the spawn itself is the attempt's and has already happened */ }
                return result
              }
              teeState = 'installed'
            }
          } catch (error) {
            teeState = `failed: ${error instanceof Error ? error.name : 'error'}`
          }

          // ---------------------------------------------------------------------------------------------------------------- pure helpers
          /** The receipt as it is uploaded: every latency array as its length, but for the 20 report-only resize probes. */
          export function trimmedReceipt(receipt: Record<string, any>): Record<string, unknown> {
            const latencies = (receipt.latencies ?? {}) as Record<string, unknown[]>
            const { latencies: _dropped, ...rest } = receipt
            return { ...rest, diag3: 'NOT evidence; the latency arrays are given as their lengths (latencyCounts), but for resize_ack_ms', latencyCounts: Object.fromEntries(Object.entries(latencies).map(([key, values]) => [key, Array.isArray(values) ? values.length : null])),
              resizeAckMs: Array.isArray(latencies.resize_ack_ms) ? latencies.resize_ack_ms : [] }
          }

          function walk(directory: string, relative = '', found: Array<{ path: string; bytes: number }> = []): Array<{ path: string; bytes: number }> {
            for (const name of readdirSync(directory).sort()) {
              if (found.length >= 600) break
              const rel = relative ? `${relative}/${name}` : name
              try {
                const info = statSync(join(directory, name))
                if (info.isDirectory()) walk(join(directory, name), rel, found)
                else found.push({ path: rel, bytes: info.size })
              } catch { found.push({ path: rel, bytes: -1 }) }
            }
            return found
          }

          const flat = (rel: string): string => rel.replace(/[\\/]/g, '__')
          const REDACTED_COPIES = [/^identity\.json$/, /^first-identity\.json$/, /^restart-identity\.json$/, /^runtime-receipts\.jsonl$/, /^g1e\/[^/]+\.peer\.json$/, /^g1e\/ck-proof\.json$/, /^g1e\/ts-final\.json$/]
          const TAILS = [/^first-backend\.log$/, /^restart-backend\.log$/, /^data\/logs\/backend\.log$/]
          const RAW_COPIES = [/^logs\/peer-\d+\.log$/, /^g1e\/[^/]+\.peerbytes$/]

          /** What a kept attempt root holds (names and sizes, 600 entries at most), and the files copied from it into `target`. `endpoint.json` (it carries the backend's URL), the home and the stores are never copied. */
          export function stageRoot(kept: string, target: string): { files: Array<{ path: string; bytes: number }>; staged: string[]; problems: string[] } {
            const files = walk(kept)
            const staged: string[] = []
            const problems: string[] = []
            mkdirSync(target, { recursive: true })
            for (const file of files) {
              try {
                const source = join(kept, file.path)
                if (REDACTED_COPIES.some((rule) => rule.test(file.path)) && file.bytes <= 4 * 1024 * 1024) { writeFileSync(join(target, flat(file.path)), redactDiagnostic(readFileSync(source, 'utf8'))); staged.push(file.path) }
                else if (TAILS.some((rule) => rule.test(file.path))) { writeFileSync(join(target, `${flat(file.path)}.tail.txt`), redactDiagnostic(readFileSync(source, 'utf8')).slice(-TAIL_CHARS)); staged.push(file.path) }
                else if (RAW_COPIES.some((rule) => rule.test(file.path)) && file.bytes <= COPY_LIMIT) { copyFileSync(source, join(target, flat(file.path))); staged.push(file.path) }
              } catch (error) { problems.push(`${file.path}: ${error instanceof Error ? error.name : 'error'}`) }
            }
            return { files, staged, problems }
          }

          const rootsNow = (): string[] => { try { return readdirSync(tmpdir()).filter((name) => name.startsWith(ROOT_PREFIX)) } catch { return [] } }

          const ESC = 0x1b
          /** The attempt's own reading of a READY line (`g3ShellAttempt.ts:242`). */
          const readyOf = (text: string): unknown => JSON.parse(text.split('BASELINE_READY ')[1].split('\n')[0].split('\r')[0])
          /** Where the console's title sequence stands in the raw bytes of one shell, and whether its READY line parses with CSI sequences removed only (the rh18 view) and through the pack's view. */
          export function shellReadyFacts(raw: Buffer): Record<string, unknown> {
            const readyAt = raw.indexOf(Buffer.from('BASELINE_READY '))
            const lineEnd = readyAt >= 0 ? raw.indexOf(0x0a, readyAt) : -1
            const oscAt = raw.indexOf(Buffer.from([ESC, 0x5d]))
            const parses = (text: string): string | null => { try { readyOf(text); return null } catch (error) { return error instanceof Error ? error.message : 'error' } }
            const csiOnly = raw.toString('utf8').replace(/\u001b\[[0-9;?]*[ -/]*[@-~]/g, '').replace(/\r\n/g, '\n')
            return { rawBytes: raw.length, readyAt, lineEnd, oscSequences: raw.toString('latin1').split('\u001b]').length - 1, firstOscAt: oscAt,
              titleInsideTheLine: readyAt >= 0 && lineEnd >= 0 && oscAt > readyAt && oscAt < lineEnd, titleAfterTheLine: lineEnd >= 0 && oscAt > lineEnd,
              csiOnlyError: readyAt < 0 || lineEnd < 0 ? 'no READY line' : parses(csiOnly), viewError: readyAt < 0 || lineEnd < 0 ? 'no READY line' : parses(conptyView(raw).toString('utf8')) }
          }

          // ---------------------------------------------------------------------------------------------------------------- the attempt
          it.runIf(enabled && !selfCheck && kind === 'attempt')('G3 diag3 (NOT evidence): one shell attempt of one arm and one cell through the attempt code, every failure recorded', async () => {
            expect(['python', 'rust-shell'], 'ACR_DIAG3_ARM is python or rust-shell').toContain(mode)
            expect([1, 4], 'ACR_DIAG3_CELL is 1 or 4').toContain(cell)
            mkdirSync(out, { recursive: true })
            mkdirSync(priv, { recursive: true })
            const steps: Array<{ step: string; ok: boolean; detail?: string }> = []
            const tryStep = <T>(name: string, run: () => T): T | null => {
              try { const value = run(); steps.push({ step: name, ok: true }); return value } catch (error) { steps.push({ step: name, ok: false, detail: brief(error, 800) }); return null }
            }
            const f0 = resolve(process.env.ACR_G3_FREEZE ?? '')
            const freeze = tryStep('read-f0', () => JSON.parse(readFileSync(f0, 'utf8')) as Record<string, any>)
            const freezeProblems = tryStep('freeze-verify', () => (JSON.parse(helper(['freeze-verify', root, f0, sidecarArg])) as { problems: string[] }).problems)
            const check = tryStep('toolchain-check', () => JSON.parse(helper(['toolchain-check', root, f0, sidecarArg])) as ToolchainRecord)
            const checkedInputs = tryStep('checked-inputs', () => (JSON.parse(helper(['checked-inputs', f0])) as { checkedInputs: number }).checkedInputs)
            const fixture = tryStep('constants', () => JSON.parse(helper(['constants'])) as { fixtureRegistrySha256: string; logPolicySha256: string })
            const spec = tryStep('spec', (): AttemptSpec => {
              if (!freeze || !check || checkedInputs === null || !fixture) throw new Error('an input of the attempt spec is missing (see the steps above)')
              const binding: FreezeBinding = { sha256: sha256(readFileSync(f0)), checkedInputs, evidenceRevision: freeze.evidenceRevision, methodRevision: freeze.methodRevision, sidecarSha256: freeze.sidecarSha256, vendors: freeze.vendors }
              return { kind: 'calibration', mode: mode as AttemptSpec['mode'], count: cell, repeat: 0, slot: null, firstArm: null, warmup: true, freeze: binding, python, sidecarBin: sidecar,
                fixtureRegistrySha256: fixture.fixtureRegistrySha256, logPolicySha256: fixture.logPolicySha256, toolchain: check, expectedReadyVersion: freeze.toolchain.sidecar.readyVersion }
            })
            const rootsBefore = new Set(rootsNow())
            const startedAt = Date.now()
            let receipt: Record<string, any> | null = null
            let failures: string[] = []
            let thrown: string | null = null
            if (spec) {
              try {
                const result = await runAttempt(spec, out)
                receipt = result.receipt as Record<string, any>
                failures = result.failures
                writeFileSync(join(priv, 'receipt.json'), `${redactDiagnostic(JSON.stringify(receipt, null, 1))}\n`)
                writeFileSync(join(priv, 'resources.jsonl'), result.resourcesJsonl)
                writeFileSync(join(out, 'receipt.json'), `${redactDiagnostic(JSON.stringify(trimmedReceipt(receipt), null, 1))}\n`)
              } catch (error) { thrown = brief(error) }
            }
            const kept = rootsNow().filter((name) => !rootsBefore.has(name))
            const roots = kept.map((name, index) => {
              try { return { name, ...stageRoot(join(tmpdir(), name), join(out, kept.length === 1 ? 'root' : `root-${index}`)) } } catch (error) { return { name, files: [], staged: [], problems: [brief(error, 300)] } }
            })
            const verdict = receipt ? classifyAttempt(receipt) : null
            const log = driverLog.join('')
            const record = {
              schema: 'acr-g3h-diag3-attempt/1', notEvidence: true, mode, count: cell, kind: 'calibration', warmup: true, platform: process.platform, wallSeconds: Math.round((Date.now() - startedAt) / 1000),
              steps, freezeProblems, toolchainMatch: check ? check.match : null, toolchainMismatches: check ? check.mismatches : null,
              attemptRan: receipt !== null, thrown, validity: verdict ? verdict.validity : null, stopReason: verdict ? verdict.stopReason : null,
              passed: receipt ? receipt.passed : null, evidenceValid: receipt ? receipt.evidenceValid : null, failure: receipt ? (receipt.failure ?? null) : null, failures: failures.map((text) => redactDiagnostic(text)),
              phaseOutcomes: receipt ? receipt.phaseOutcomes : null, phases: receipt ? receipt.phases : null, driverExitCode: receipt ? (receipt.driverExitCode ?? null) : null,
              driverLogTee: teeState, driverSpawnsSeen: driverSpawns, driverLogBytes: Buffer.byteLength(log), driverLogTail: redactDiagnostic(log).slice(-4000),
              rootKept: kept.length > 0, roots,
            }
            writeFileSync(join(out, 'attempt.json'), `${redactDiagnostic(JSON.stringify(record, null, 1))}\n`)
            process.stdout.write(`diag3 attempt ${mode} cell ${cell}: ${verdict ? verdict.validity : 'not run'}${receipt && receipt.failure ? ` failure=${String(receipt.failure).slice(0, 600)}` : ''}${thrown ? ` thrown=${thrown.slice(0, 300)}` : ''}\n`)
            expect({ thrown, validity: record.validity, freezeProblems, toolchainMatch: record.toolchainMatch }).toEqual({ thrown: null, validity: 'clean', freezeProblems: [], toolchainMatch: true })
          }, 900_000)

          // ---------------------------------------------------------------------------------------------------------------- the READY line of the ordinary shells (no attempt)
          const ROUNDS = 3
          it.runIf(enabled && !selfCheck && kind === 'shell-ready')('G3 diag3 (NOT evidence): the READY line of the two ordinary shells of one arm, three driver starts, the raw bytes recorded', async () => {
            expect(['python', 'rust-shell'], 'ACR_DIAG3_ARM is python or rust-shell').toContain(mode)
            mkdirSync(out, { recursive: true })
            const workload = JSON.parse(readFileSync(resolve('tests/fixtures/cli-regression/runtime-workload-g1e.json'), 'utf8'))
            const rows: Array<Record<string, unknown>> = []
            const problems: string[] = []
            for (let round = 0; round < ROUNDS; round++) {
              const isolated = realpathSync(mkdtempSync(join(tmpdir(), 'navide-g3h-shellready-')))
              const driver = spawn(python, ['-m', DRIVER_MODULE, isolated, '1', String(round), mode], { cwd: resolve('backend'), stdio: ['pipe', 'pipe', 'pipe'], windowsHide: true, env: { ...process.env, ...(sidecar ? { ACR_SIDECAR_BIN: sidecar } : {}) } })
              let exited: number | null | undefined
              let log = ''
              driver.stdout.on('data', (chunk) => { log += chunk })
              driver.stderr.on('data', (chunk) => { log += chunk })
              driver.on('error', (error) => { log += error.message; exited = -1 })
              driver.on('exit', (code) => { exited = code })
              let connections = 0
              const client = createWsClient({ onStatus: (status) => { if (status === 'connected') connections++ } })
              const raw = new Map<string, Buffer[]>()
              client.on('terminal.output', (payload) => {
                const frame = payload as TerminalOutputFrame
                raw.set(frame.terminal_session_id, [...(raw.get(frame.terminal_session_id) ?? []), Buffer.from(frame.data)])
              })
              const until = async (ok: () => boolean, message: string, timeout: number): Promise<void> => {
                const deadline = performance.now() + timeout
                while (!ok()) {
                  if (exited !== undefined) throw new Error(`${message}: driver exited: ${log.slice(-300)}`)
                  if (performance.now() >= deadline) throw new Error(message)
                  await delay(20)
                }
              }
              try {
                await until(() => existsSync(join(isolated, 'endpoint.json')), 'backend readiness deadline', 60_000)
                const endpoint = JSON.parse(readFileSync(join(isolated, 'endpoint.json'), 'utf8'))
                client.connect(endpoint.url)
                await until(() => connections === 1, 'authenticated WS connection deadline', workload.deadlineMs)
                for (const [index, shell] of (endpoint.shells as Array<Record<string, any>>).entries()) {
                  const response = await client.send<{ terminal_session_id: string }>('terminal.create', {
                    pane_id: shell.pane, agent_key: shell.vendor, cwd: shell.workspace, command: shell.wrapped ? buildAgentPaneCommand(endpoint.shell, [shell.commandLine]) : shell.command,
                    cols: conptyColumns(100), rows: 30, create_generation: `${shell.pane}-generation`, metadata: { workspace_path: shell.workspace, session_marker: `at-pane:${shell.pane}` },
                  }, workload.deadlineMs)
                  if (!response.ok) { problems.push(`round ${round} shell ${index}: terminal.create refused`); continue }
                  const tid = response.payload!.terminal_session_id
                  const bytes = (): Buffer => Buffer.concat(raw.get(tid) ?? [])
                  let reached = true
                  try { await until(() => { const view = conptyView(bytes()); const at = view.indexOf('BASELINE_READY '); return at >= 0 && view.includes('\n', at) }, 'READY line deadline', workload.deadlineMs) } catch { reached = false }
                  await delay(300) // the frame that holds the line may end after it: take what follows too
                  const seen = bytes()
                  const name = `round-${round}-shell-${index}.bin`
                  mkdirSync(join(out, 'raw'), { recursive: true })
                  writeFileSync(join(out, 'raw', name), seen)
                  rows.push({ round, shell: index, wrapped: shell.wrapped === true, readyLineReached: reached, raw: `raw/${name}`, ...shellReadyFacts(seen) })
                  await client.send('terminal.kill', { terminal_session_id: tid }, workload.deadlineMs)
                }
              } catch (error) {
                problems.push(`round ${round}: ${brief(error, 400)}`)
              } finally {
                client.dispose('diag3 shell-ready finished')
                driver.stdin.end('\n')
                try { await until(() => exited !== undefined, 'driver shutdown deadline', 60_000) } catch (error) { problems.push(`round ${round}: ${brief(error, 200)}`) }
                rmSync(isolated, { recursive: true, force: true })
              }
            }
            const count = (key: string): number => rows.filter((row) => row[key] === true).length
            const summary = { schema: 'acr-g3h-diag3-shell-ready/1', notEvidence: true, mode, platform: process.platform, shellsCreated: rows.length, shellsExpected: ROUNDS * 2,
              titleInsideTheLine: count('titleInsideTheLine'), titleAfterTheLine: count('titleAfterTheLine'), withAnOscSequence: rows.filter((row) => (row.oscSequences as number) > 0).length,
              readWithCsiRemovedOnly: rows.filter((row) => row.csiOnlyError === null).length, readThroughTheView: rows.filter((row) => row.viewError === null).length, problems, rows }
            writeFileSync(join(out, 'shell-ready.json'), `${redactDiagnostic(JSON.stringify(summary, null, 1))}\n`)
            process.stdout.write(`diag3 shell-ready ${mode}: ${summary.readThroughTheView} of ${rows.length} READY lines read through the view, the title inside the line in ${summary.titleInsideTheLine}\n`)
            expect({ problems, created: rows.length, readThroughTheView: summary.readThroughTheView }).toEqual({ problems: [], created: ROUNDS * 2, readThroughTheView: ROUNDS * 2 })
          }, 600_000)

          // ---------------------------------------------------------------------------------------------------------------- self-check (no backend, no driver, no attempt): run off the runner by test_g3h_diag3.py
          it.runIf(enabled && selfCheck)('diag3 self-check: the driver-output listener sees a child started through the named `spawn`, and the record helpers do what they say', async () => {
            expect(teeState).toBe('installed')
            const child = spawn(process.execPath, ['-e', "console.log('diag3-selfcheck-line')", DRIVER_MODULE], { stdio: ['ignore', 'pipe', 'pipe'] })
            const own: string[] = []
            child.stdout!.on('data', (chunk) => { own.push(String(chunk)) }) // the attempt's own listener: it must still get every byte
            await new Promise<void>((done) => { child.on('close', () => done()) })
            expect(driverSpawns).toBe(1)
            expect(driverLog.join('')).toContain('diag3-selfcheck-line')
            expect(own.join('')).toContain('diag3-selfcheck-line')
            const other = spawn(process.execPath, ['-e', "console.log('not the driver')"], { stdio: ['ignore', 'pipe', 'pipe'] })
            await new Promise<void>((done) => { other.on('close', () => done()) })
            expect(driverSpawns).toBe(1) // only a command that names the driver module is listened to
            const trimmed = trimmedReceipt({ passed: false, failure: 'x', latencies: { io_ms: [1, 2, 3], resize_ack_ms: [4, 5] }, ledgers: [{ logFile: { size: 9 } }] }) as Record<string, any>
            expect(trimmed.latencies).toBeUndefined()
            expect(trimmed.latencyCounts).toEqual({ io_ms: 3, resize_ack_ms: 2 })
            expect(trimmed.resizeAckMs).toEqual([4, 5])
            expect(trimmed.ledgers).toEqual([{ logFile: { size: 9 } }])
            const kept = mkdtempSync(join(tmpdir(), 'diag3-selfcheck-'))
            for (const directory of ['g1e', 'logs', 'home', 'data/logs']) mkdirSync(join(kept, directory), { recursive: true })
            const token = 'S'.repeat(24) // a backend URL token as `redactDiagnostic` knows it (`?token=...`), made here at run time
            writeFileSync(join(kept, 'endpoint.json'), `{"url": "ws://127.0.0.1:1/?token=${token}"}`)
            writeFileSync(join(kept, 'g1e/pane.peer.json'), `{"acceptedSinceOrigin": 5, "note": "ws://127.0.0.1:1/?token=${token}"}`)
            writeFileSync(join(kept, 'first-backend.log'), `${'line\n'.repeat(10_000)}last line ws://127.0.0.1:1/?token=${token}\n`)
            writeFileSync(join(kept, 'logs/peer-0.log'), 'peer text\n')
            writeFileSync(join(kept, 'home/secret.txt'), 'never copied')
            const target = join(kept, 'staged')
            const staged = stageRoot(kept, target)
            expect(staged.staged.sort()).toEqual(['first-backend.log', 'g1e/pane.peer.json', 'logs/peer-0.log'])
            expect(staged.problems).toEqual([])
            expect(readdirSync(target).sort()).toEqual(['first-backend.log.tail.txt', 'g1e__pane.peer.json', 'logs__peer-0.log'])
            expect(readFileSync(join(target, 'g1e__pane.peer.json'), 'utf8')).not.toContain(token)
            const tail = readFileSync(join(target, 'first-backend.log.tail.txt'), 'utf8')
            expect(tail.length).toBeLessThanOrEqual(TAIL_CHARS)
            expect(tail).toContain('last line')
            expect(tail).not.toContain(token)
            expect(staged.files.map((file) => file.path)).toContain('endpoint.json') // listed by name and size, never copied
            expect(existsSync(join(target, 'endpoint.json'))).toBe(false)
            // the two shapes of an ordinary shell's READY line on the inbox console: the title after the line's CR LF (read by rh18 too), and between the text and the CR LF (diag2's first Rust-arm failure)
            const head = '\u001b[?9001h\u001b[?1004h\u001b[?25l\u001b[2J\u001b[m\u001b[H'
            const title = '\u001b]0;C:\\hostedtoolcache\\python.exe\u0007'
            const after = shellReadyFacts(Buffer.from(`${head}BASELINE_READY {"pid":7}\r\n${title}\u001b[?25h`))
            expect([after.titleInsideTheLine, after.titleAfterTheLine, after.csiOnlyError, after.viewError]).toEqual([false, true, null, null])
            const inside = shellReadyFacts(Buffer.from(`${head}BASELINE_READY {"pid":7}${title}\u001b[?25h\r\n`))
            expect([inside.titleInsideTheLine, inside.titleAfterTheLine, inside.viewError, inside.oscSequences]).toEqual([true, false, null, 1])
            expect(inside.csiOnlyError).not.toBeNull()
            expect(shellReadyFacts(Buffer.from('no line yet')).viewError).toBe('no READY line')
            mkdirSync(out, { recursive: true })
            writeFileSync(join(out, 'selfcheck.json'), `${JSON.stringify({ teeState, runtime: process.versions.bun ? 'bun' : 'node', cell, kind })}\n`)
          }, 60_000)
          DIAG3_EOF_ATTEMPT_TEST
          test "$(shasum -a 256 < "$RUNNER_TEMP/diag3/tools/diag3_attempt_run.py" | cut -d' ' -f1)" = "30b60ce1635d912950a1610711fb52fe9ff45674e34769c747070a0ff8a85519"
          test "$(shasum -a 256 < "$RUNNER_TEMP/diag3/tools/diag3_attempt_report.py" | cut -d' ' -f1)" = "25ace039ef7e3353c7d8df45f14401ab153330164139da22045e5c025669add3"
          test "$(shasum -a 256 < "$RUNNER_TEMP/diag3/tools/diag3_probes.py" | cut -d' ' -f1)" = "40fc44d4b412cbc5b1e97a1573f288035726eda98b86103f5859369b0f9e9313"
          test "$(shasum -a 256 < tests/cli/g3hDiag3Attempt.test.ts | cut -d' ' -f1)" = "ba88104329d7acb14d8433895f9fae192f2d5288043e64b6e6dc8fa383c660f8"

      - name: diag3, the log final check's open-files test sees a held file, a released one and a process that is gone (NOT evidence)
        id: holdsprobe
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          uv --project backend run python -B "$RUNNER_TEMP/diag3/tools/diag3_probes.py" holds "$RUNNER_TEMP/diag3/out/holds-probe.json"

      - name: diag3, the log file's identity as Python and the runner take it, raw and as the attempt compares them (NOT evidence)
        id: identityprobe
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          uv --project backend run python -B "$RUNNER_TEMP/diag3/tools/diag3_probes.py" identity "$RUNNER_TEMP/diag3/out/identity-probe.json"

      - name: Build F0
        timeout-minutes: 10
        id: f0
