        run: |
          uv --project backend run python "$RUNNER_TEMP/diag3/tools/diag3_attempt_run.py" "$PWD" "$RUNNER_TEMP/g3r2/rehearsal/attempt-2" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" rust-shell 1 attempt "$RUNNER_TEMP/diag3/out/attempt-rust-c1" "$RUNNER_TEMP/diag3/private/attempt-rust-c1"

      - name: diag3, one cell-4 shell attempt of the Python arm through the attempt code and the cost plan's own step (NOT evidence, not a measurement)
        id: attempt_python_c4
        if: ${{ !cancelled() && steps.f0.outcome == 'success' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          uv --project backend run python "$RUNNER_TEMP/diag3/tools/diag3_attempt_run.py" "$PWD" "$RUNNER_TEMP/g3r2/rehearsal/attempt-3" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" python 4 attempt "$RUNNER_TEMP/diag3/out/attempt-python-c4" "$RUNNER_TEMP/diag3/private/attempt-python-c4"

      - name: diag3, one cell-4 shell attempt of the Rust arm through the attempt code and the cost plan's own step (NOT evidence, not a measurement)
        id: attempt_rust_c4
        if: ${{ !cancelled() && steps.f0.outcome == 'success' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 15
        run: |
          uv --project backend run python "$RUNNER_TEMP/diag3/tools/diag3_attempt_run.py" "$PWD" "$RUNNER_TEMP/g3r2/rehearsal/attempt-4" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" rust-shell 4 attempt "$RUNNER_TEMP/diag3/out/attempt-rust-c4" "$RUNNER_TEMP/diag3/private/attempt-rust-c4"

      - name: diag3, one verdict per check of each attempt (always runs; information only, it cannot fail the job)
        id: verdicts
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv --project backend run python -B "$RUNNER_TEMP/diag3/tools/diag3_attempt_report.py" "$RUNNER_TEMP/diag3/out/attempt-python-c1" "$RUNNER_TEMP/diag3/private/attempt-python-c1" "$RUNNER_TEMP/g3r2h/F0.json" python || echo "the report of the python cell-1 attempt could not be written"
          uv --project backend run python -B "$RUNNER_TEMP/diag3/tools/diag3_attempt_report.py" "$RUNNER_TEMP/diag3/out/attempt-rust-c1" "$RUNNER_TEMP/diag3/private/attempt-rust-c1" "$RUNNER_TEMP/g3r2h/F0.json" rust-shell || echo "the report of the rust-shell cell-1 attempt could not be written"
          uv --project backend run python -B "$RUNNER_TEMP/diag3/tools/diag3_attempt_report.py" "$RUNNER_TEMP/diag3/out/attempt-python-c4" "$RUNNER_TEMP/diag3/private/attempt-python-c4" "$RUNNER_TEMP/g3r2h/F0.json" python || echo "the report of the python cell-4 attempt could not be written"
          uv --project backend run python -B "$RUNNER_TEMP/diag3/tools/diag3_attempt_report.py" "$RUNNER_TEMP/diag3/out/attempt-rust-c4" "$RUNNER_TEMP/diag3/private/attempt-rust-c4" "$RUNNER_TEMP/g3r2h/F0.json" rust-shell || echo "the report of the rust-shell cell-4 attempt could not be written"

      - name: diag3, stage the records and write the step outcomes (always runs; it decides nothing and cannot fail the job)
        id: stage
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          JOB_STATUS: ${{ job.status }}
          O_PINS: ${{ steps.pins.outcome }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          O_PBS: ${{ steps.pbs.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_SQLITE: ${{ steps.sqlite.outcome }}
          O_RUNNERFACTS: ${{ steps.runnerfacts.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_PACKAGED: ${{ steps.packaged.outcome }}
          O_CARGOBUILD: ${{ steps.cargobuild.outcome }}
          O_RUSTSETTLE: ${{ steps.rustsettle.outcome }}
          O_COALESCE: ${{ steps.coalesce.outcome }}
          O_LAYOUT: ${{ steps.layout.outcome }}
          O_TIMERBEFORE: ${{ steps.timerbefore.outcome }}
          O_CARGO: ${{ steps.cargo.outcome }}
          O_TIMERAFTER: ${{ steps.timerafter.outcome }}
          O_CORRECTNESS: ${{ steps.correctness.outcome }}
          O_COALESCERESTORE: ${{ steps.coalescerestore.outcome }}
          O_IMAGE: ${{ steps.image.outcome }}
          O_TOOLS: ${{ steps.tools.outcome }}
          O_HOLDSPROBE: ${{ steps.holdsprobe.outcome }}
          O_IDENTITYPROBE: ${{ steps.identityprobe.outcome }}
          O_F0: ${{ steps.f0.outcome }}
          O_SHELLREADY_PYTHON: ${{ steps.shellready_python.outcome }}
          O_SHELLREADY_RUST: ${{ steps.shellready_rust.outcome }}
          O_ATTEMPT_PYTHON_C1: ${{ steps.attempt_python_c1.outcome }}
          O_ATTEMPT_RUST_C1: ${{ steps.attempt_rust_c1.outcome }}
          O_ATTEMPT_PYTHON_C4: ${{ steps.attempt_python_c4.outcome }}
          O_ATTEMPT_RUST_C4: ${{ steps.attempt_rust_c4.outcome }}
          O_VERDICTS: ${{ steps.verdicts.outcome }}
        run: |
          out="$RUNNER_TEMP/diag3/out"
          mkdir -p "$out"
          mkdir -p "$out/journals" "$out/markers" "$out/smoke"
          for f in "$RUNNER_TEMP"/g3r2h/pre/run-*.json "$RUNNER_TEMP"/g3r2h/smoke/run-*.json "$RUNNER_TEMP"/g3r2h/conpty-probe/run-*.json; do if [ -f "$f" ]; then cp "$f" "$out/journals/$(basename "$(dirname "$f")")-$(basename "$f")" || true; fi; done
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-1/run-diag3-attempt.json" ]; then mkdir -p "$out/attempt-python-c1" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-1/run-diag3-attempt.json" "$out/attempt-python-c1/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-2/run-diag3-attempt.json" ]; then mkdir -p "$out/attempt-rust-c1" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-2/run-diag3-attempt.json" "$out/attempt-rust-c1/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-3/run-diag3-attempt.json" ]; then mkdir -p "$out/attempt-python-c4" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-3/run-diag3-attempt.json" "$out/attempt-python-c4/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-4/run-diag3-attempt.json" ]; then mkdir -p "$out/attempt-rust-c4" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-4/run-diag3-attempt.json" "$out/attempt-rust-c4/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-5/run-diag3-attempt.json" ]; then mkdir -p "$out/shell-ready-python" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-5/run-diag3-attempt.json" "$out/shell-ready-python/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-6/run-diag3-attempt.json" ]; then mkdir -p "$out/shell-ready-rust" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-6/run-diag3-attempt.json" "$out/shell-ready-rust/plan-journal.json" || true; fi
          if [ -d "$RUNNER_TEMP/g3r2h/markers" ]; then cp -r "$RUNNER_TEMP/g3r2h/markers/." "$out/markers/" || echo "the markers could not be copied"; fi
          uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_diag.py stage-smoke "$RUNNER_TEMP/g3r2h/smoke" "$out/smoke" > "$out/smoke/staged.txt" 2>&1 || echo "stage-smoke failed" >> "$out/smoke/staged.txt"
          for f in "$RUNNER_TEMP/g3r2h/rustc-vV.txt" "$RUNNER_TEMP/g3r2h/pre/correctness-gate.json" "$RUNNER_TEMP/g3r2h/pre/correctness-receipt.json" "$RUNNER_TEMP/g3r2h/pre/g2-receipt-binding.json"; do if [ -f "$f" ]; then cp "$f" "$out/" || true; fi; done
          mkdir -p "$out/rehearsal-records"
          for f in "$RUNNER_TEMP"/g3r2h-summary/*.json "$RUNNER_TEMP"/g3r2h-summary/*.txt; do if [ -f "$f" ]; then cp "$f" "$out/rehearsal-records/" || true; fi; done
          {
            printf 'NOT-EVIDENCE diag3\njob=%s\n' "$JOB_STATUS"
            printf 'step=%s outcome=%s%s\n' pins "$O_PINS" ""
            printf 'step=%s outcome=%s%s\n' identity "$O_IDENTITY" ""
            printf 'step=%s outcome=%s%s\n' pbs "$O_PBS" ""
            printf 'step=%s outcome=%s%s\n' install "$O_INSTALL" ""
            printf 'step=%s outcome=%s%s\n' sqlite "$O_SQLITE" ""
            printf 'step=%s outcome=%s%s\n' runnerfacts "$O_RUNNERFACTS" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' build "$O_BUILD" ""
            printf 'step=%s outcome=%s%s\n' packaged "$O_PACKAGED" ""
            printf 'step=%s outcome=%s%s\n' cargobuild "$O_CARGOBUILD" ""
            printf 'step=%s outcome=%s%s\n' rustsettle "$O_RUSTSETTLE" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' coalesce "$O_COALESCE" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' layout "$O_LAYOUT" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' timerbefore "$O_TIMERBEFORE" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' cargo "$O_CARGO" ""
            printf 'step=%s outcome=%s%s\n' timerafter "$O_TIMERAFTER" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' correctness "$O_CORRECTNESS" ""
            printf 'step=%s outcome=%s%s\n' coalescerestore "$O_COALESCERESTORE" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' image "$O_IMAGE" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' tools "$O_TOOLS" ""
            printf 'step=%s outcome=%s%s\n' holdsprobe "$O_HOLDSPROBE" ""
            printf 'step=%s outcome=%s%s\n' identityprobe "$O_IDENTITYPROBE" ""
            printf 'step=%s outcome=%s%s\n' f0 "$O_F0" ""
            printf 'step=%s outcome=%s%s\n' shellready_python "$O_SHELLREADY_PYTHON" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' shellready_rust "$O_SHELLREADY_RUST" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' attempt_python_c1 "$O_ATTEMPT_PYTHON_C1" ""
            printf 'step=%s outcome=%s%s\n' attempt_rust_c1 "$O_ATTEMPT_RUST_C1" ""
            printf 'step=%s outcome=%s%s\n' attempt_python_c4 "$O_ATTEMPT_PYTHON_C4" ""
            printf 'step=%s outcome=%s%s\n' attempt_rust_c4 "$O_ATTEMPT_RUST_C4" ""
            printf 'step=%s outcome=%s%s\n' verdicts "$O_VERDICTS" " kind=information-only"
          } > "$out/diag-summary.txt" || echo "the summary could not be written"
          cat "$out/diag-summary.txt" || true
          find "$out" -type f | sort > "$RUNNER_TEMP/diag3/files.txt" || true
          cp "$RUNNER_TEMP/diag3/files.txt" "$out/files.txt" || true

      - name: Leak check (no token or runner secret in the upload)
        id: leak
        if: always()
        timeout-minutes: 2
        run: if grep -r -l -E '(ghs|ghp|gho|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$RUNNER_TEMP/diag3/out"; then echo "credential-like text found"; exit 1; fi

      - name: Upload everything the diagnostic recorded (always runs, after the leak check)
        if: always() && steps.leak.outcome == 'success'
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g3h-diag3-macos
          path: ${{ runner.temp }}/diag3/out
          if-no-files-found: warn
          retention-days: 7

      - name: diag3, fail the job when a decisive step did not succeed (last step, after the upload; an information-only step never fails the job)
        id: verdict
        if: always()
        timeout-minutes: 1
        env:
          O_PINS: ${{ steps.pins.outcome }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          O_PBS: ${{ steps.pbs.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_SQLITE: ${{ steps.sqlite.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_PACKAGED: ${{ steps.packaged.outcome }}
          O_CARGOBUILD: ${{ steps.cargobuild.outcome }}
          O_CARGO: ${{ steps.cargo.outcome }}
          O_CORRECTNESS: ${{ steps.correctness.outcome }}
          O_TOOLS: ${{ steps.tools.outcome }}
          O_HOLDSPROBE: ${{ steps.holdsprobe.outcome }}
          O_IDENTITYPROBE: ${{ steps.identityprobe.outcome }}
          O_F0: ${{ steps.f0.outcome }}
          O_ATTEMPT_PYTHON_C1: ${{ steps.attempt_python_c1.outcome }}
          O_ATTEMPT_RUST_C1: ${{ steps.attempt_rust_c1.outcome }}
          O_ATTEMPT_PYTHON_C4: ${{ steps.attempt_python_c4.outcome }}
          O_ATTEMPT_RUST_C4: ${{ steps.attempt_rust_c4.outcome }}
        run: |
          failed=0
          for pair in "pins=$O_PINS" "identity=$O_IDENTITY" "pbs=$O_PBS" "install=$O_INSTALL" "sqlite=$O_SQLITE" "build=$O_BUILD" "packaged=$O_PACKAGED" "cargobuild=$O_CARGOBUILD" "cargo=$O_CARGO" "correctness=$O_CORRECTNESS" "tools=$O_TOOLS" "holdsprobe=$O_HOLDSPROBE" "identityprobe=$O_IDENTITYPROBE" "f0=$O_F0" "attempt_python_c1=$O_ATTEMPT_PYTHON_C1" "attempt_rust_c1=$O_ATTEMPT_RUST_C1" "attempt_python_c4=$O_ATTEMPT_PYTHON_C4" "attempt_rust_c4=$O_ATTEMPT_RUST_C4"; do
            case "${pair#*=}" in success) ;; *) echo "the step ${pair%%=*} did not succeed (${pair#*=})"; failed=1 ;; esac
          done
          exit "$failed"
