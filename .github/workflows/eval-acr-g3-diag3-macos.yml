        continue-on-error: true
        run: |
          H="uv --project backend run python -B -m tests.cli_regression.support.g3.hosted_helper"
          $H f0-spec "$PWD" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/f0-spec.json" "$GITHUB_REF_NAME"
          $H f0-build "$PWD" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/f0-spec.json"

      - name: diag3, the READY line of the two ordinary shells of the Python arm, three driver starts, raw bytes recorded (NOT evidence; information only, it cannot fail the job)
        id: shellready_python
        if: ${{ !cancelled() && steps.f0.outcome == 'success' && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          uv --project backend run python "$RUNNER_TEMP/diag3/tools/diag3_attempt_run.py" "$PWD" "$RUNNER_TEMP/g3r2/rehearsal/attempt-5" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" python 1 shell-ready "$RUNNER_TEMP/diag3/out/shell-ready-python" "$RUNNER_TEMP/diag3/private/shell-ready-python"

