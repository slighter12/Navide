name: E5 Windows Agent CLI Runtime Gates

on:
  push:
    branches:
      - eval/agent-cli-runtime
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e5-windows-gates:
    runs-on: windows-2025
    timeout-minutes: 70
    env:
      E5_RECEIPT_DIR: ${{ github.workspace }}\test-results\ci
    steps:
      - name: Set evaluation paths
        shell: pwsh
        run: |
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP\e5-cargo-target" >> $env:GITHUB_ENV

      - name: Check out evaluation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare the receipts directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force test-results/ci | Out-Null

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      # ---- checkpoint 1: the three gates, on the fixture probe ----------------------------------
      - name: Build real-kernel gate probe
        id: probe_build
        continue-on-error: true
        shell: pwsh
        run: cargo build --locked --release --manifest-path native/navide-cli-runtime/Cargo.toml --features windows-gates --bin e5-windows-probe

      - name: G-W1 Popen process handle transfers a pipe
        id: w1
        if: always() && steps.probe_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -I -B native/navide-cli-runtime/tests/support/e5_windows_gates.py --gate w1 --probe "$env:CARGO_TARGET_DIR\release\e5-windows-probe.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: G-W2 pipe type direction and identity checks
        id: w2
        if: always() && steps.probe_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -I -B native/navide-cli-runtime/tests/support/e5_windows_gates.py --gate w2 --probe "$env:CARGO_TARGET_DIR\release\e5-windows-probe.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: G-W3 ConPTY with cross-process pipe duplicates
        id: w3
        if: always() && steps.probe_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          python -I -B native/navide-cli-runtime/tests/support/e5_windows_gates.py --gate w3 --probe "$env:CARGO_TARGET_DIR\release\e5-windows-probe.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ---- checkpoint 2, round A: the product sidecar on Windows, driven frame by frame ---------
      - name: Build product sidecar
        id: product_build
        continue-on-error: true
        shell: pwsh
        run: cargo build --locked --release --manifest-path native/navide-cli-runtime/Cargo.toml --bin navide-cli-runtime

      - name: Rust unit tests (R-U1, close gate, registry, command line)
        id: rust_unit
        if: always()
        continue-on-error: true
        shell: pwsh
        run: cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --bins

      - name: Sidecar handshake
        id: sc_ready
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CASE: the_handshake_names_conpty_and_the_duplicate_handle_transfer
        run: |
          $out = cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --test sidecar_windows $env:CASE -- --exact --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch 'test result: ok\. 1 passed') { Write-Host "case not collected: $env:CASE"; exit 1 }

      - name: Sidecar shell round trip through pulled handles, resize, kill
        id: sc_roundtrip
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CASE: a_shell_round_trips_bytes_through_the_pulled_handles_and_a_kill_cleans_the_console
        run: |
          $out = cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --test sidecar_windows $env:CASE -- --exact --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch 'test result: ok\. 1 passed') { Write-Host "case not collected: $env:CASE"; exit 1 }

      - name: G-W4 ClosePseudoConsole under a saturating CLI (24H2 or later)
        id: gw4
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CASE: closing_the_console_completes_under_a_saturating_cli_both_ways
        run: |
          $out = cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --test sidecar_windows $env:CASE -- --exact --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch 'test result: ok\. 1 passed') { Write-Host "case not collected: $env:CASE"; exit 1 }

      - name: W10 two sessions never see each other's bytes
        id: w10
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CASE: two_sessions_never_see_each_others_bytes
        run: |
          $out = cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --test sidecar_windows $env:CASE -- --exact --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch 'test result: ok\. 1 passed') { Write-Host "case not collected: $env:CASE"; exit 1 }

      - name: G-W5 sessions, threads, memory and cancellation join
        id: gw5
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CASE: many_sessions_cost_bounded_threads_and_cancellation_joins_within_the_bound
        run: |
          $out = cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --test sidecar_windows $env:CASE -- --exact --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch 'test result: ok\. 1 passed') { Write-Host "case not collected: $env:CASE"; exit 1 }

      - name: Uniform loss on stdin EOF
        id: loss
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CASE: closing_stdin_ends_every_session_and_the_sidecar
        run: |
          $out = cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --test sidecar_windows $env:CASE -- --exact --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch 'test result: ok\. 1 passed') { Write-Host "case not collected: $env:CASE"; exit 1 }

      - name: Unserviced natural exit reports incomplete cleanup
        id: unserviced
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          CASE: an_unserviced_natural_exit_is_reported_incomplete_within_the_cleanup_bound
        run: |
          $out = cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --test sidecar_windows $env:CASE -- --exact --nocapture 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch 'test result: ok\. 1 passed') { Write-Host "case not collected: $env:CASE"; exit 1 }

      - name: Install the backend test environment
        id: py_env
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          python -m pip install uv
          uv sync --project backend --frozen
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Python client - 4 concurrent isolated sessions, unicode, resize, exit
        id: py_concurrent
        if: always() && steps.py_env.outcome == 'success' && steps.product_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          CASE: test_windows_service_runs_concurrent_isolated_sessions_with_unicode_resize_and_exit
          NAVIDE_CLI_RUNTIME_BIN: ${{ runner.temp }}\e5-cargo-target\release\navide-cli-runtime.exe
        run: |
          $out = uv --project backend run pytest "backend/tests/test_cli_runtime_windows.py::$env:CASE" -q -p no:cacheprovider 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch '1 passed') { Write-Host "case not collected or skipped: $env:CASE"; exit 1 }

      - name: Python client - sidecar death recovers on a fresh runtime
        id: py_recovery
        if: always() && steps.py_env.outcome == 'success' && steps.product_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          CASE: test_windows_sidecar_death_with_sessions_fails_visibly_and_recovers_on_a_fresh_runtime
          NAVIDE_CLI_RUNTIME_BIN: ${{ runner.temp }}\e5-cargo-target\release\navide-cli-runtime.exe
        run: |
          $out = uv --project backend run pytest "backend/tests/test_cli_runtime_windows.py::$env:CASE" -q -p no:cacheprovider 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch '1 passed') { Write-Host "case not collected or skipped: $env:CASE"; exit 1 }

      - name: Python client - missing binary fails the create
        id: py_missing
        if: always() && steps.py_env.outcome == 'success' && steps.product_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          CASE: test_windows_missing_binary_fails_the_create_instead_of_skipping
          NAVIDE_CLI_RUNTIME_BIN: ${{ runner.temp }}\e5-cargo-target\release\navide-cli-runtime.exe
        run: |
          $out = uv --project backend run pytest "backend/tests/test_cli_runtime_windows.py::$env:CASE" -q -p no:cacheprovider 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) { exit 1 }
          if ($out -notmatch '1 passed') { Write-Host "case not collected or skipped: $env:CASE"; exit 1 }

      # ---- the two required cases through the production TypeScript WebSocket client ----------
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install the frontend test dependencies
        id: js_env
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Run the two required production WebSocket cases
        id: ts_seam
        if: always() && steps.js_env.outcome == 'success' && steps.py_env.outcome == 'success' && steps.product_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ runner.temp }}\e5-cargo-target\release\navide-cli-runtime.exe
          NAVIDE_T05_SIDECAR: ${{ runner.temp }}\e5-cargo-target\release\navide-cli-runtime.exe
        run: |
          bun run vitest run tests/cli/shellRuntime.test.ts tests/cli/runtimeRecovery.test.ts -t 'uses one actual native runtime|sidecar death with sessions and a pending request' --reporter=json --outputFile=test-results/ci/e5-windows-ts-results.json
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Show the TypeScript case failures (endpoint tokens redacted)
        if: always() && steps.ts_seam.outcome == 'failure'
        shell: pwsh
        run: |
          $results = Get-Content test-results/ci/e5-windows-ts-results.json -Raw | ConvertFrom-Json
          foreach ($file in @($results.testResults)) {
            if ($file.message) { Write-Host ("---- suite: " + ([string]$file.message -replace 't=[A-Za-z0-9_\-]+', 't=REDACTED')) }
            foreach ($case in @($file.assertionResults)) {
              foreach ($message in @($case.failureMessages)) {
                $text = [string]$message -replace 't=[A-Za-z0-9_\-]+', 't=REDACTED'
                Write-Host "---- $($case.title) [$($case.status)]"
                Write-Host $text.Substring(0, [Math]::Min(8000, $text.Length))
              }
            }
          }

      - name: Require both TypeScript cases to be collected and pass
        id: ts_guard
        if: always() && steps.ts_seam.outcome == 'success'
        shell: pwsh
        run: |
          $names = @(
            'uses one actual native runtime for concurrent shells, ordered Unicode, resize, reconnect and exits',
            'sidecar death with sessions and a pending request fails visibly, cleans owned trees only and recovers on a fresh runtime')
          $results = Get-Content test-results/ci/e5-windows-ts-results.json -Raw | ConvertFrom-Json
          $required = @($results.testResults.assertionResults | Where-Object { $names -contains $_.fullName })
          if ($required.Count -ne 2 -or @($required | Where-Object { $_.status -ne 'passed' }).Count -ne 0) {
            Write-Host "required cases collected: $($required.Count); statuses: $(($required | ForEach-Object { $_.status }) -join ',')"
            exit 1
          }

      - name: Negative control - a missing runtime binary fails both TypeScript cases
        id: ts_negative
        if: always() && steps.js_env.outcome == 'success' && steps.py_env.outcome == 'success' && steps.product_build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ runner.temp }}\e5-cargo-target\release\no-such-runtime.exe
          NAVIDE_T05_SIDECAR: ${{ runner.temp }}\e5-cargo-target\release\no-such-runtime.exe
        run: |
          bun run vitest run tests/cli/shellRuntime.test.ts tests/cli/runtimeRecovery.test.ts -t 'uses one actual native runtime|sidecar death with sessions and a pending request' --reporter=json --outputFile=test-results/ci/e5-windows-ts-negative.json
          $names = @(
            'uses one actual native runtime for concurrent shells, ordered Unicode, resize, reconnect and exits',
            'sidecar death with sessions and a pending request fails visibly, cleans owned trees only and recovers on a fresh runtime')
          $results = Get-Content test-results/ci/e5-windows-ts-negative.json -Raw | ConvertFrom-Json
          $required = @($results.testResults.assertionResults | Where-Object { $names -contains $_.fullName })
          if ($required.Count -ne 2 -or @($required | Where-Object { $_.status -ne 'failed' }).Count -ne 0) {
            Write-Host "negative control: collected $($required.Count); statuses: $(($required | ForEach-Object { $_.status }) -join ',')"
            exit 1
          }
          # vitest exited non-zero by design; the checks above are the verdict.
          exit 0

      - name: Write redacted outcomes
        if: always()
        shell: pwsh
        env:
          PROBE_BUILD: ${{ steps.probe_build.outcome }}
          GATE_W1: ${{ steps.w1.outcome }}
          GATE_W2: ${{ steps.w2.outcome }}
          GATE_W3: ${{ steps.w3.outcome }}
          PRODUCT_BUILD: ${{ steps.product_build.outcome }}
          RUST_UNIT: ${{ steps.rust_unit.outcome }}
          SC_READY: ${{ steps.sc_ready.outcome }}
          SC_ROUNDTRIP: ${{ steps.sc_roundtrip.outcome }}
          GATE_W4: ${{ steps.gw4.outcome }}
          CASE_W10: ${{ steps.w10.outcome }}
          GATE_W5: ${{ steps.gw5.outcome }}
          LOSS: ${{ steps.loss.outcome }}
          UNSERVICED: ${{ steps.unserviced.outcome }}
          PY_ENV: ${{ steps.py_env.outcome }}
          PY_CONCURRENT: ${{ steps.py_concurrent.outcome }}
          PY_RECOVERY: ${{ steps.py_recovery.outcome }}
          PY_MISSING: ${{ steps.py_missing.outcome }}
          JS_ENV: ${{ steps.js_env.outcome }}
          TS_SEAM: ${{ steps.ts_seam.outcome }}
          TS_GUARD: ${{ steps.ts_guard.outcome }}
          TS_NEGATIVE: ${{ steps.ts_negative.outcome }}
        run: |
          $build = [System.Environment]::OSVersion.Version.Build
          $seam = @{
            'shell' = 'uses one actual native runtime for concurrent shells, ordered Unicode, resize, reconnect and exits'
            'recovery' = 'sidecar death with sessions and a pending request fails visibly, cleans owned trees only and recovers on a fresh runtime'
          }
          $seamRows = foreach ($key in 'shell', 'recovery') {
            $status = 'not-run'
            if (Test-Path test-results/ci/e5-windows-ts-results.json) {
              $found = @((Get-Content test-results/ci/e5-windows-ts-results.json -Raw | ConvertFrom-Json).testResults.assertionResults | Where-Object { $_.fullName -eq $seam[$key] })
              $status = if ($found.Count -eq 1) { $found[0].status } else { 'not-collected' }
            }
            "runtime=navide-cli-runtime platform=windows build=$build case=ts-$key status=$status stage=principal-seam"
          }
          $rows = @(
            "runtime=navide-cli-runtime platform=windows build=$build case=probe-build status=$env:PROBE_BUILD stage=build",
            "runtime=navide-cli-runtime platform=windows build=$build case=G-W1 status=$env:GATE_W1 stage=duplicate-handle",
            "runtime=navide-cli-runtime platform=windows build=$build case=G-W2 status=$env:GATE_W2 stage=pipe-binding",
            "runtime=navide-cli-runtime platform=windows build=$build case=G-W3 status=$env:GATE_W3 stage=conpty-handoff",
            "runtime=navide-cli-runtime platform=windows build=$build case=product-build status=$env:PRODUCT_BUILD stage=build",
            "runtime=navide-cli-runtime platform=windows build=$build case=rust-unit status=$env:RUST_UNIT stage=rust-test",
            "runtime=rust-sidecar platform=windows build=$build case=handshake status=$env:SC_READY stage=ready",
            "runtime=rust-sidecar platform=windows build=$build case=shell-roundtrip-kill status=$env:SC_ROUNDTRIP stage=cleaned",
            "runtime=rust-sidecar platform=windows build=$build case=G-W4 status=$env:GATE_W4 stage=close-under-saturation",
            "runtime=rust-sidecar platform=windows build=$build case=W10 status=$env:CASE_W10 stage=isolation",
            "runtime=rust-sidecar platform=windows build=$build case=G-W5 status=$env:GATE_W5 stage=scale-and-cancel",
            "runtime=rust-sidecar platform=windows build=$build case=uniform-loss status=$env:LOSS stage=stdin-eof",
            "runtime=rust-sidecar platform=windows build=$build case=unserviced-exit status=$env:UNSERVICED stage=cleanup-bound",
            "runtime=python-client platform=windows build=$build case=py-env status=$env:PY_ENV stage=install",
            "runtime=python-client platform=windows build=$build case=py-concurrent-w10 status=$env:PY_CONCURRENT stage=production-client",
            "runtime=python-client platform=windows build=$build case=py-sidecar-death status=$env:PY_RECOVERY stage=recovery",
            "runtime=python-client platform=windows build=$build case=py-missing-binary status=$env:PY_MISSING stage=negative-control",
            "runtime=frontend platform=windows build=$build case=js-env status=$env:JS_ENV stage=install"
          ) + @($seamRows) + @(
            "runtime=navide-cli-runtime platform=windows build=$build case=ts-seam-run status=$env:TS_SEAM stage=principal-seam",
            "runtime=navide-cli-runtime platform=windows build=$build case=ts-seam-guard status=$env:TS_GUARD stage=collection",
            "runtime=navide-cli-runtime platform=windows build=$build case=ts-missing-binary status=$env:TS_NEGATIVE stage=negative-control"
          )
          $rows | Set-Content test-results/ci/e5-windows-outcomes.log

      - name: Upload redacted outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e5-windows-outcomes
          path: |
            test-results/ci/e5-windows-outcomes.log
            test-results/ci/rust-receipts.jsonl
          if-no-files-found: warn
          retention-days: 7

      - name: Require every Windows case
        if: always()
        shell: pwsh
        env:
          OUTCOMES: ${{ join(steps.*.outcome, ' ') }}
        run: |
          foreach ($outcome in $env:OUTCOMES.Split(' ')) {
            if ($outcome -ne 'success' -and $outcome -ne 'skipped') { exit 1 }
          }
