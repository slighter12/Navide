name: G3 Diag4 Windows (not evidence)

# DRAFT (diag4). Evaluation only. A FOURTH SHORT DIAGNOSTIC on the real Windows x64 runner image (windows-2025), built from the rehearsal draft on the rh20 pack. It is NOT evidence, it is NOT a rehearsal
# and it does not count against the rehearsal cap (D11): it runs no cost run, no matrix, no calibration chain and no measurement. diag3 (run 43223963037) passed all four shell attempts for the first
# time and failed four of the rehearsal's test steps for harness reasons (OUT/diag3/results.md, D3-1 to D3-5); the rh20 pack fixes them.
# TRIGGER: a push of a branch whose name matches eval/agent-cli-runtime-windows-diag-r4* (first eval/agent-cli-runtime-windows-diag-r4; a retry is the same commit under a longer name). The tip is the freeze head plus this one file.
# STAGE H5 FILLS, before this file is committed to the workflows directory of the branch: H5_FILL_PACK_COMMIT, H5_FILL_PACK_DIGEST.
# The identity step is the registered one with this file's own name: the commit is the freeze head plus exactly this workflow file.
# STEPS, copied block for block from the rehearsal draft, in its order: checkouts, head check, pack digest and overlay, pins, identity, toolchains, install, the ps shim, the sidecar build, the packaged
# build, Smoke, the ConPTY probe, then the rehearsal's own test steps: the fault-hook proof, `Rust tests` (pwsh, --no-fail-fast), the G2 environment and pytest with its two guards, the three principal
# steps, the correctness step and `bind`; then `Build F0`, also the rehearsal's own block. A copied step that has no bound in the rehearsal draft gets a `timeout-minutes` line here and nothing else
# changes in it. Not copied: the quiet gate and the cost run.
# DIAG STEPS. `queue`, the job's first step, records how long the job waited for its runner (the push time of the event against the clock, and the run's and the job's own times from the API when it
# answers without a token; information only). `teststeps`, after `bind`, runs the `receipts` and `principal_cases` commands once more with their error output kept and lists their input files
# (information only: in diag3 both failed with nothing on record). The stage step keeps the redacted tail of every plan step's log and the correctness result files.
# `image` records the runner image and the inbox console's file version. `tools` writes four files that are in no branch and no pack. `holdsprobe` runs the log final check's open-files
# test on a held file, a released one and a process that is gone; `identityprobe` takes one file's identity with Python and with the runner's stat. `shellready_python` and `shellready_rust` (information
# only) record the raw bytes of the ordinary shells' READY lines. Then four shell attempts, each its own step: cell 1 and cell 4 (four peers, 21 size changes to peer 0) of the Python arm and of the
# Rust arm. `diag4_attempt_run.py` asks the pack's own `hosted_driver` for the rehearsal's cost plan, takes its `calibrate-shell` step (its environment, its argv), puts the diag test file in the place
# of the matrix file and runs that ONE step through the pack's plan runner; the test file calls the pack's `g3ShellAttempt.runAttempt` once: a discarded warm-up, its root kept when it did not pass.
# The attempt steps run whatever the test steps, Smoke and the probes did, as long as F0, the sidecar build and the tools exist; each begins with the cost step's own ps-shim guard. `verdicts` then
# writes one verdict per check of each attempt (every phase, the ledger rules, `delta - accepted - L` per peer, the three stages of the rehearsal verdict's per-receipt check).
# UPLOADED per attempt: the receipt (its latency arrays as lengths, but for the 20 report-only resize probes) and its failure text, every phase outcome, the redacted tail of the driver's output and of the
# step log, the ledger records, per peer `delta - accepted - L`, `logFile.size` and `resize_ack_ms`, and from a kept root the peer receipts, the redacted backend log tails, the peer logs and peer bytes.
# The resource samples and the full latency arrays stay on the runner. Every step after install is `continue-on-error` with an id; the last step, after the upload, fails the job when a decisive step did
# not succeed. Every step has a bound and the job's timeout is their sum. The JavaScript runtime is plain default Bun; the pinned actions are the rehearsal draft's.

on:
  push:
    branches:
      - 'eval/agent-cli-runtime-windows-diag-r4*'

permissions:
  contents: read

env:
  FREEZE_H: 202084cf74eccb07bec366897ebf4c588799e72e
  PACK_COMMIT: "d19adfe9e40aa280357c33829a2bb1f8def31864"
  PACK_DIGEST: "4eec85e6d344b77e6f23c341a7df5668f7e5061b63093c3ffecda26bad4adf18"

jobs:
  diag:
    name: diag4-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 613
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            runner: windows-2025
            system: Windows
    defaults:
      run:
        shell: bash
    env:
      G3H_OS: ${{ matrix.system }}
    steps:
      - name: diag4, record how long the job waited for its runner (first step; information only, it cannot fail the job)
        id: queue
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        env:
          PUSHED_AT: ${{ github.event.repository.pushed_at }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          now="$(date -u +%s)"
          mkdir -p "$RUNNER_TEMP/diag4/out"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$RUN_ATTEMPT"
          run="$(curl -sS --max-time 20 -H 'Accept: application/vnd.github+json' "$api" 2>/dev/null | jq -c '{created_at, run_started_at}' 2>/dev/null || true)"
          jobs="$(curl -sS --max-time 20 -H 'Accept: application/vnd.github+json' "$api/jobs" 2>/dev/null | jq -c '[.jobs[]? | {created_at, started_at}]' 2>/dev/null || true)"
          jq -n --arg now "$now" --arg pushed "$PUSHED_AT" --arg attempt "$RUN_ATTEMPT" --arg ref "$REF_NAME" --argjson run "${run:-null}" --argjson jobs "${jobs:-null}" \
            '($pushed | tonumber? // null) as $p | {schema: "acr-g3h-diag4-queue/1", notEvidence: true, ref: $ref, runAttempt: $attempt, firstStepAtEpoch: ($now | tonumber), pushedAtEpoch: $p, secondsFromThePushToTheFirstStep: (if $p then ($now | tonumber) - $p else null end), apiRun: $run, apiJobs: $jobs}' \
            > "$RUNNER_TEMP/diag4/out/queue-wait.json" || echo "the queue record could not be written"
          cat "$RUNNER_TEMP/diag4/out/queue-wait.json" || true

      - name: Pin line endings before any checkout
        timeout-minutes: 1
        run: git config --global core.autocrlf false

      - name: Check out evaluation branch
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the harness pack
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACK_COMMIT }}
          path: pack
          persist-credentials: false

      - name: Check the run head and the checked-out bytes
        timeout-minutes: 1
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git config --get core.autocrlf)" = "false"
          test -z "$(git status --porcelain -- . ':(exclude)pack')"

      - name: Verify the pack digest, then overlay it
        timeout-minutes: 3
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" pack/backend/tests/cli_regression/support/g3/hosted_pack.py digest pack > "$RUNNER_TEMP/pack-digest.txt"
          cat "$RUNNER_TEMP/pack-digest.txt"
          grep -q -F "$PACK_DIGEST" "$RUNNER_TEMP/pack-digest.txt"
          tar -C pack --exclude=.git -cf - . | tar -C . -xf -

      - name: Verify the g1e pins and the hosted inputs (first step after the overlay)
        timeout-minutes: 3
        id: pins
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" -B backend/tests/cli_regression/support/g3/hosted_preflight.py "$PWD"

      - name: Product identity against the freeze head (rf4c D7)
        timeout-minutes: 2
        id: identity
        run: |
          git cat-file -e "$FREEZE_H^{commit}"
          git diff --exit-code "$FREEZE_H" -- native src backend/agent_team_backend
          test -z "$(git status --porcelain --ignored -- native src backend/agent_team_backend)"
          test "$(git diff --name-only --no-renames "$FREEZE_H" "$GITHUB_SHA")" = ".github/workflows/eval-acr-g3-diag4-windows.yml"

      - name: Set up Bun (default version, no input)
        timeout-minutes: 5
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Python
        timeout-minutes: 5
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        timeout-minutes: 5
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Rust
        timeout-minutes: 10
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1

      - name: Install locked dependencies and record the toolchain
        timeout-minutes: 15
        id: install
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked
          mkdir -p "$RUNNER_TEMP/g3r2h" "$RUNNER_TEMP/g3r2/rehearsal" "$RUNNER_TEMP/g3r2h-summary"
          rustc -vV | tee "$RUNNER_TEMP/g3r2h/rustc-vV.txt"

      - name: Build the ps shim and put it first on PATH
        timeout-minutes: 10
        id: shim
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          cargo build --release --locked --manifest-path backend/tests/cli_regression/support/g3/hosted_ps_shim/Cargo.toml
          cygpath -w "$PWD/backend/tests/cli_regression/support/g3/hosted_ps_shim/target/release" >> "$GITHUB_PATH"

      - name: Build the sidecars and the reader fixtures
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py build "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Build the packaged app
        id: packaged
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py packaged "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Smoke
        id: smoke
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py smoke "$PWD" "$RUNNER_TEMP/g3r2h/smoke" --rehearsal

      - name: ConPTY probe (NOT evidence, rh16 windows-4c)
        id: conptyprobe
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 30
        run: |
          shim="$PWD/backend/tests/cli_regression/support/g3/hosted_ps_shim/target/release"
          export PATH="$shim:$PATH"
          case "$(command -v ps)" in "$shim"/ps|"$shim"/ps.exe) ;; *) echo "ps does not resolve to the G3 shim: $(command -v ps)"; exit 1 ;; esac
          listing="$(ps -A -o pid=)"
          if [ -z "$listing" ] || printf '%s\n' "$listing" | grep -v -E '^ *[0-9]+$' > /dev/null; then echo "ps -A -o pid= is not shim-shaped"; exit 1; fi
          shaped=""
          for pid in $(printf '%s\n' "$listing" | tr -d ' ' | head -n 20); do
            if ps -o lstart= -p "$pid" | grep -q -E '^[A-Z][a-z]{2} [A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4}$'; then shaped=1; break; fi
          done
          test -n "$shaped"
          uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py conpty-probe "$PWD" "$RUNNER_TEMP/g3r2h/conpty-probe" --rehearsal

      - name: Prove the release sidecar has no fault hooks (the F0 sidecar and its harness)
        timeout-minutes: 5
        id: proof
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}\g3r2h\pre\harness-target\release\navide-cli-runtime.exe
          G2_BASETEMP: ${{ runner.temp }}\g2-basetemp
        run: bun tests/cli/g2Native.mjs proof --release "$NAVIDE_CLI_RUNTIME_BIN" --harness "$NAVIDE_CLI_RUNTIME_HARNESS_BIN"

      - name: Rust tests
        timeout-minutes: 60
        id: cargo
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        run: cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --no-fail-fast

      - name: Install the G2 test environment (the interpreter path the G2 receipt pins were taken with)
        timeout-minutes: 10
        id: g2env
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}\g2-venv
        run: uv --project backend sync --locked

      - name: Required backend cases on the F0 sidecar (G2 required list)
        id: pytest
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.g2env.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 75
        shell: pwsh
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}\g3r2h\pre\harness-target\release\navide-cli-runtime.exe
          G2_BASETEMP: ${{ runner.temp }}\g2-basetemp
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}\g2-venv
        run: pwsh -NoProfile -File tests/cli/g2-windows-pytest.ps1

      - name: Require every listed case to be collected and passed
        timeout-minutes: 3
        id: guard
        if: ${{ !cancelled() && hashFiles('test-results/ci/g2-windows-junit.xml') != '' }}
        continue-on-error: true
        run: bun tests/cli/g2Native.mjs guard --platform windows --arch x64 --required tests/cli/g2-required-windows.txt --junit test-results/ci/g2-windows-junit.xml --out test-results/ci/g2-windows-outcomes.log

      - name: Require every ready receipt to name the F0 sidecar and its harness
        timeout-minutes: 5
        id: receipts
        if: ${{ !cancelled() && steps.pytest.outcome != 'skipped' }}
        continue-on-error: true
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}\g3r2h\pre\harness-target\release\navide-cli-runtime.exe
          G2_BASETEMP: ${{ runner.temp }}\g2-basetemp
        run: |
          rc=0
          mkdir -p test-results/ci
          bun tests/cli/g2Native.mjs receipts --root "$G2_BASETEMP" --sha "$(sha256sum < "$NAVIDE_CLI_RUNTIME_BIN" | cut -d' ' -f1)" --harness-sha "$(sha256sum < "$NAVIDE_CLI_RUNTIME_HARNESS_BIN" | cut -d' ' -f1)" --required tests/cli/g2-required-windows.txt --expect tests/cli/g2-receipt-expectations-windows.json > test-results/ci/g2-windows-receipts.txt || rc=$?
          cat test-results/ci/g2-windows-receipts.txt
          exit $rc

      - name: Run the production WebSocket cases on the F0 sidecar
        timeout-minutes: 20
        id: principal
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        shell: pwsh
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}\g3r2h\pre\harness-target\release\navide-cli-runtime.exe
          G2_BASETEMP: ${{ runner.temp }}\g2-basetemp
        run: bun run vitest run tests/cli/shellRuntime.test.ts tests/cli/runtimeRecovery.test.ts -t 'uses one actual native runtime|sidecar death with sessions and a pending request' --reporter=default --reporter=json --outputFile.json=test-results/ci/g2-windows-ts-results.json

      - name: Require both shared WebSocket cases to be collected and pass
        timeout-minutes: 2
        id: principal_guard
        if: ${{ !cancelled() && hashFiles('test-results/ci/g2-windows-ts-results.json') != '' }}
        continue-on-error: true
        run: jq -e '[.testResults[].assertionResults[] | select(.fullName == "uses one actual native runtime for concurrent shells, ordered Unicode, resize, reconnect and exits" or .fullName == "sidecar death with sessions and a pending request fails visibly, cleans owned trees only and recovers on a fresh runtime")] as $required | ($required | length) == 2 and ($required | all(.status == "passed"))' test-results/ci/g2-windows-ts-results.json

      - name: Require the Windows-only production cases to be collected and pass
        timeout-minutes: 2
        id: principal_cases
        if: ${{ !cancelled() && hashFiles('test-results/ci/g2-windows-ts-results.json') != '' }}
        continue-on-error: true
        run: jq -e -f tests/cli/g2-windows-principal.jq test-results/ci/g2-windows-ts-results.json

      - name: Correctness, the 21 G1-E rows from the gates registry on the F0 sidecar, gated by case (row table, collected-and-passed gate, sidecar receipt, E1, G1)
        id: correctness
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 75
        shell: pwsh
        run: |
          $shim = [IO.Path]::GetFullPath((Join-Path $PWD.Path 'backend\tests\cli_regression\support\g3\hosted_ps_shim\target\release'))
          $psCommand = Get-Command ps -CommandType Application -ErrorAction Stop | Select-Object -First 1
          if ([IO.Path]::GetFullPath($psCommand.Source) -ne [IO.Path]::GetFullPath((Join-Path $shim 'ps.exe'))) { throw "ps does not resolve to the G3 shim: $($psCommand.Source)" }
          $listing = @(& $psCommand.Source -A -o pid=)
          if ($LASTEXITCODE -ne 0 -or $listing.Count -eq 0 -or @($listing | Where-Object { $_ -notmatch '^\s*\d+\s*$' }).Count -gt 0) { throw 'ps -A -o pid= is not shim-shaped' }
          uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py correctness "$PWD" "$env:RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Bind the G2 required cases (by name) and the receipts to the F0 sidecar (E1)
        timeout-minutes: 5
        id: bind
        if: ${{ !cancelled() && steps.correctness.outcome != 'skipped' }}
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: uv --project backend run python -B -m tests.cli_regression.support.g3.hosted_correctness bind "$PWD" "$RUNNER_TEMP/g3r2h/pre" Windows test-results/ci/g2-windows-receipts.txt test-results/ci/g2-windows-outcomes.log test-results/ci/g2-windows-junit.xml tests/cli/g2-required-windows.txt

      - name: diag4, the receipts and principal_cases commands once more with their error output kept (always runs; information only, it cannot fail the job)
        id: teststeps
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}\native\navide-cli-runtime\target\release\navide-cli-runtime.exe
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}\g3r2h\pre\harness-target\release\navide-cli-runtime.exe
          G2_BASETEMP: ${{ runner.temp }}\g2-basetemp
        run: |
          record="$RUNNER_TEMP/diag4/out/test-steps-record"
          mkdir -p "$record"
          {
            for f in tests/cli/g2-receipt-expectations-windows.json tests/cli/g2-windows-principal.jq tests/cli/g2-required-windows.txt tests/cli/g2Native.mjs test-results/ci/g2-windows-junit.xml test-results/ci/g2-windows-ts-results.json; do
              if [ -f "$f" ]; then echo "present $(sha256sum < "$f" | cut -d' ' -f1) $f"; else echo "MISSING $f"; fi
            done
            if [ -d "$G2_BASETEMP" ]; then echo "receipt files under the G2 basetemp: $(find "$G2_BASETEMP" -name runtime-receipts.jsonl | wc -l | tr -d ' ')"; else echo "MISSING the G2 basetemp"; fi
          } > "$record/inputs.txt" 2>&1 || true
          cat "$record/inputs.txt" || true
          rc=0
          bun tests/cli/g2Native.mjs receipts --root "$G2_BASETEMP" --sha "$(sha256sum < "$NAVIDE_CLI_RUNTIME_BIN" | cut -d' ' -f1)" --harness-sha "$(sha256sum < "$NAVIDE_CLI_RUNTIME_HARNESS_BIN" | cut -d' ' -f1)" --required tests/cli/g2-required-windows.txt --expect tests/cli/g2-receipt-expectations-windows.json > "$record/receipts-rerun.txt" 2>&1 || rc=$?
          echo "exit=$rc" >> "$record/receipts-rerun.txt"
          rc=0
          jq -e -f tests/cli/g2-windows-principal.jq test-results/ci/g2-windows-ts-results.json > "$record/principal-cases-rerun.txt" 2>&1 || rc=$?
          echo "exit=$rc" >> "$record/principal-cases-rerun.txt"
          tail -n 40 "$record/receipts-rerun.txt" "$record/principal-cases-rerun.txt" || true

      - name: diag4, record the runner image version (rh17 review N-6; information only, it cannot fail the job)
        id: image
        if: always()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/diag4/out"
          {
            echo "ImageOS: ${ImageOS:-unknown}"
            echo "ImageVersion: ${ImageVersion:-unknown}"
            echo "RUNNER_OS: ${RUNNER_OS:-unknown}"
            echo "RUNNER_ARCH: ${RUNNER_ARCH:-unknown}"
            echo "uname -sr: $(uname -sr 2>&1 || true)"
            echo "ver: $(cmd.exe //c ver 2>&1 | tr -d '\r' | grep -v '^$' || true)"
            echo "conhost.exe: $(pwsh -NoProfile -Command '(Get-Item "$env:SystemRoot\System32\conhost.exe").VersionInfo.ProductVersion' 2>&1 || echo unavailable)"
          } | tee "$RUNNER_TEMP/diag4/out/image.txt"

      - name: diag4, write the four diagnostic tools (they exist on this runner only) and check their bytes
        id: tools
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/diag4/tools" "$RUNNER_TEMP/diag4/out" "$RUNNER_TEMP/diag4/private"
          cat > "$RUNNER_TEMP/diag4/tools/diag4_attempt_run.py" <<'DIAG4_EOF_ATTEMPT_RUN'
          """diag4 (NOT evidence). Runs ONE step of the diag test file through the pack's own cost path, so the step gets exactly the plan step, the environment and the sequencer the rehearsal's cost run gives
          its shell attempts.

              uv --project backend run python diag4_attempt_run.py REPO PLAN_OUT F0 BUILD_RECORD PRE_OUT SMOKE_OUT ARM CELL KIND RECORDS PRIVATE        (from the repository root)

          ARM is python or rust-shell, CELL is 1 or 4, KIND is `attempt` (one whole shell attempt of that arm and cell) or `shell-ready` (no attempt: the READY line of the two ordinary shells of that arm).
          `hosted_driver.main(["cost", REPO, PLAN_OUT, F0, BUILD_RECORD, PRE_OUT, SMOKE_OUT, "--rehearsal"])` builds the rehearsal's real cost plan (the hosted environment, the Bun preload, the termios flag, the
          freeze and sidecar variables, the rehearsal flag) and hands it to its plan runner. This tool is that plan runner: it takes the plan's `calibrate-shell` step and nothing else, puts the diag test file in
          the place of `g3Matrix.test.ts` in its argv, adds the diag variables, and runs that one step through the pack's unchanged `_run_plan` under its own record name. The cost run's precondition, its F0
          re-check before each step and every other step of the plan are NOT run: the diag test file makes the per-attempt freeze and toolchain checks itself and records what they say. No cost run, no matrix,
          no measurement. PLAN_OUT must be a rehearsal output directory (`$RUNNER_TEMP/g3r2/rehearsal/attempt-<n>`): `hosted_driver` refuses any other.
          Afterwards the redacted tail of the step's own log (the vitest output) is written to RECORDS/step-log-tail.txt.
          """
          from __future__ import annotations

          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))

          STEP = "calibrate-shell"
          MATRIX_TEST = "tests/cli/g3Matrix.test.ts"
          DIAG_TEST = "tests/cli/g3hDiag4Attempt.test.ts"
          GATE = "ACR_DIAG4_ATTEMPT"
          RECORD_NAME = "run-diag4-attempt.json"
          MODES = ("python", "rust-shell")
          CELLS = ("1", "4")
          KINDS = {"attempt": "attempt.json", "shell-ready": "shell-ready.json"}      # the kind and the file its test writes into RECORDS
          TAIL_CHARS = 20000


          def substituted(plan: list[dict], mode: str, cell: str, kind: str, records: str, private: str) -> list[dict]:
              """The cost plan's own shell-attempt step with the diag test file in the place of the matrix one. Anything but a plan that holds that step once, as the pack builds it, is refused."""
              steps = [step for step in plan if step["name"] == STEP]
              if len(steps) != 1 or steps[0]["argv"].count(MATRIX_TEST) != 1 or steps[0]["env"].get("ACR_G3") != "calibrate" or "ACR_G3_FREEZE" not in steps[0]["env"] or "ACR_G3_SIDECAR" not in steps[0]["env"]:
                  raise RuntimeError("the pack's cost plan does not hold the one calibrate-shell step this tool substitutes")
              if mode not in MODES or cell not in CELLS or kind not in KINDS:
                  raise RuntimeError("ARM is python or rust-shell, CELL is 1 or 4, KIND is attempt or shell-ready")
              step = steps[0]
              env = {**step["env"], "ACR_G3": "diag4", GATE: "1", "ACR_DIAG4_ARM": mode, "ACR_DIAG4_CELL": cell, "ACR_DIAG4_KIND": kind, "ACR_G3_OUT": records, "ACR_DIAG4_PRIVATE": private, "ACR_G1E_KEEP": "1"}
              return [{**step, "argv": [DIAG_TEST if word == MATRIX_TEST else word for word in step["argv"]], "env": env, "outputs": [f"{records}/{KINDS[kind]}"]}]


          def main(argv: list[str], *, inner=None, **injected) -> int:
              if len(argv) != 11:
                  print(__doc__, file=sys.stderr)
                  return 64
              repo, plan_out, f0, build_record, pre_out, smoke_out, mode, cell, kind, records, private = argv
              from tests.cli_regression.support.g3 import hosted_driver
              run = hosted_driver._run_plan if inner is None else inner
              records, private = str(Path(records).resolve()), str(Path(private).resolve())
              seen: dict = {}

              def run_plan(plan: list[dict], out, _record_name: str, **kwargs) -> int:
                  seen["planSteps"] = [step["name"] for step in plan]
                  return run(substituted(plan, mode, cell, kind, records, private), out, RECORD_NAME, record_extra=kwargs.get("record_extra"))

              code = hosted_driver.main(["cost", repo, plan_out, f0, build_record, pre_out, smoke_out, "--rehearsal"], run_plan=run_plan, **injected)
              try:
                  Path(records).mkdir(parents=True, exist_ok=True)
                  log = Path(plan_out).resolve() / "logs" / f"{STEP}.log"
                  tail = "\n".join(hosted_driver.redacted_tail(log.read_text(encoding="utf-8", errors="replace"))) if log.is_file() else "the step wrote no log"
                  (Path(records) / "step-log-tail.txt").write_text(tail[-TAIL_CHARS:] + "\n", encoding="utf-8")
                  (Path(records) / "launcher.json").write_text(json.dumps({"schema": "acr-g3h-diag4-launcher/1", "notEvidence": True, "mode": mode, "cell": int(cell) if cell in CELLS else cell, "kind": kind, "exit": code,
                                                                        "costPlanSteps": seen.get("planSteps"), "stepRun": STEP, "testFile": DIAG_TEST}, indent=1, sort_keys=True) + "\n", encoding="utf-8")
              except Exception as error:  # noqa: BLE001 - the records are information; the step's exit code is the result
                  print(f"diag4: the step log tail could not be written: {type(error).__name__}")
              return code


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          DIAG4_EOF_ATTEMPT_RUN
          cat > "$RUNNER_TEMP/diag4/tools/diag4_attempt_report.py" <<'DIAG4_EOF_ATTEMPT_REPORT'
          """diag4 (NOT evidence). What one attempt's records say, check by check, written as fixed verdict words and the checks' own texts.

              uv --project backend run python -B diag4_attempt_report.py RECORDS PRIVATE F0 MODE        (from the repository root)

          RECORDS holds what `g3hDiag4Attempt.test.ts` wrote for the upload (`attempt.json`); PRIVATE holds the whole receipt and the resource samples, which are read here and never copied. Writes
          RECORDS/attempt-report.json:
            phases    every phase of the attempt with its outcome (`passed`, `failed`, `running`, or `not reached`)
            peers     per measured peer: the reader's delta, what the peer accepted, the registered line count L of the cell, `delta - accepted - L`, whether that is inside the Windows bound, `logFile.size`,
                      whether the log file's identity at the close is the one taken at create (with the bit lengths of the four numbers, not the numbers), and the problems the ledger rule reports for the
                      record (with the hosted seams of this platform installed)
            resizeAckMs   the 20 report-only resize probes
            processes what the driver sampled, as names only: per (component, category, executable name, version probe) how many processes, the pids named `sidecar`, and whether every sampled process that
                      is not the backend has a sampled parent. No time, CPU or memory value is read.
            decider   the three stages of the rehearsal verdict's per-receipt check, EACH run and listed (`rehearsal_verdict._trial_check` returns at its first failed stage, which hid the later ones in diag2):
                      `summarise.structure_problems`, `summarise.consistency_problems`, `summarise.trial_problems`
            verdicts  one line per check, `pass` / `FAIL` / `not reached` / `not run`, so that every failure of the attempt is listed
          It always exits 0 and writes the file: a check that cannot run is listed with the class of its error.
          """
          from __future__ import annotations

          import json
          import platform
          import sys
          from collections import Counter
          from pathlib import Path, PureWindowsPath

          sys.path.insert(0, str(Path.cwd() / "backend"))

          SCHEMA = "acr-g3h-diag4-report/1"


          class Files:
              """The two private files, in the shape the decider reads a bundle: the receipt by name, the resource samples under the name it derives from it."""
              def __init__(self, private: Path) -> None:
                  self.private = private

              def read_json(self, _name: str):
                  return json.loads((self.private / "receipt.json").read_text(encoding="utf-8"))

              def exists(self, _name: str) -> bool:
                  return (self.private / "resources.jsonl").is_file()

              def read_jsonl(self, _name: str):
                  return [json.loads(line) for line in (self.private / "resources.jsonl").read_text(encoding="utf-8").splitlines() if line.strip()]


          def load(path: Path):
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  return None


          def guarded(errors: dict, name: str, run, default=None):
              try:
                  return run()
              except Exception as error:  # noqa: BLE001 - one check that cannot run must not hide the others
                  key = error.args[0] if isinstance(error, KeyError) and error.args and isinstance(error.args[0], str) and error.args[0].isidentifier() else None
                  errors[name] = type(error).__name__ + (f": {key}" if key else "")      # the class, and for a missing key its name (an identifier, never a value or a path)
                  return default


          def bits(value) -> int | None:
              return value.bit_length() if isinstance(value, int) and not isinstance(value, bool) else None


          def peer_rows(receipt: dict, count: int, hosted_seams, summarise, errors: dict) -> list[dict]:
              rows = []
              for index, record in enumerate(receipt.get("ledgers") or []):
                  row = {"peer": index}
                  try:
                      delta = record["close"]["read_total"] - record["origin"]["read_total"]
                      accepted = record["peer"]["acceptedSinceOrigin"]
                      lines = hosted_seams.registered_lines(count)
                      log_file = record.get("logFile") or {}
                      created = log_file.get("inodeAtCreate") if isinstance(log_file.get("inodeAtCreate"), list) and len(log_file.get("inodeAtCreate")) == 2 else [None, None]
                      row.update(readerDelta=delta, peerAccepted=accepted, registeredLines=lines, deltaMinusAccepted=delta - accepted, deltaMinusAcceptedMinusLines=delta - accepted - lines,
                                 slackBytes=hosted_seams.LEDGER_SLACK_BYTES, insideTheWindowsBound=hosted_seams.ledger_bound_problem(delta, accepted, lines) is None,
                                 logFileSize=log_file.get("size"), logIdentity=record.get("logIdentity"),
                                 logFileIdentityAtCloseIsTheOneAtCreate=[log_file.get("dev"), log_file.get("ino")] == created,
                                 logFileIdentityBits={"devAtClose": bits(log_file.get("dev")), "devAtCreate": bits(created[0]), "inoAtClose": bits(log_file.get("ino")), "inoAtCreate": bits(created[1])},
                                 originReadTotal=record["origin"]["read_total"], originStable=record["origin"].get("stable"))
                  except Exception as error:  # noqa: BLE001
                      row["recordError"] = type(error).__name__
                  row["ledgerProblems"] = guarded(errors, f"ledger_problems[{index}]", lambda record=record, index=index: summarise.ledger_problems(record, index, count))
                  rows.append(row)
              return rows


          def process_rows(private: Path, receipt: dict) -> dict:
              """Names only, from the driver's samples: which kinds of process were sampled and how they hang together. A Windows executable is named by `PureWindowsPath`, which also reads a POSIX path."""
              seen: dict[int, dict] = {}
              samples = 0
              for line in (private / "resources.jsonl").read_text(encoding="utf-8").splitlines():
                  if not line.strip():
                      continue
                  samples += 1
                  for process in json.loads(line).get("processes") or []:
                      seen.setdefault(process["pid"], process)
              backend = (receipt.get("backend") or {}).get("pid")
              kinds = Counter((p.get("component"), p.get("category"), PureWindowsPath(str(p.get("executable") or "")).name, bool(p.get("versionProbe"))) for p in seen.values())
              sidecars = sorted(pid for pid, p in seen.items() if p.get("component") == "sidecar")
              return {"samples": samples, "processesSeen": len(seen), "sidecarPids": sidecars, "sidecarParentIsTheBackend": [seen[pid].get("ppid") == backend for pid in sidecars],
                      "processesWhoseParentWasNotSampled": sum(1 for pid, p in seen.items() if pid != backend and p.get("ppid") not in seen),
                      "kinds": [{"component": c, "category": k, "executable": name, "versionProbe": probe, "processes": n} for (c, k, name, probe), n in sorted(kinds.items(), key=lambda item: tuple(str(x) for x in item[0]))]}


          def build(records: Path, private: Path, f0_path: Path, mode: str, system: str | None = None) -> dict:
              from tests.cli_regression.support.g3 import hosted_posix_stubs
              hosted_posix_stubs.install()      # before the imports below, as the hosted helper does (Windows has no os.getloadavg, which a g1e module reads at import)
              from tests.cli_regression.support.g1e import summarise
              from tests.cli_regression.support.g3 import bundle as g3bundle, hosted_seams

              system = system or platform.system()
              errors: dict = {}
              out: dict = {"schema": SCHEMA, "notEvidence": True, "mode": mode, "system": system, "verdicts": []}
              attempt = load(records / "attempt.json")
              receipt = load(private / "receipt.json")
              f0 = load(f0_path)
              undo = guarded(errors, "install-seams", lambda: hosted_seams.install(system))
              try:
                  say = lambda check, verdict, detail=None: out["verdicts"].append({"check": check, "verdict": verdict, **({"detail": detail} if detail not in (None, [], "") else {})})
                  say("the attempt step wrote its record (attempt.json)", "pass" if isinstance(attempt, dict) else "FAIL")
                  for step in (attempt or {}).get("steps") or []:
                      say(f"helper step {step.get('step')}", "pass" if step.get("ok") else "FAIL", step.get("detail"))
                  if isinstance(attempt, dict):
                      say("freeze-verify reports no problem", "not run" if attempt.get("freezeProblems") is None else "pass" if attempt["freezeProblems"] == [] else "FAIL", attempt.get("freezeProblems"))
                      say("the toolchain check matches", "not run" if attempt.get("toolchainMatch") is None else "pass" if attempt["toolchainMatch"] is True else "FAIL", attempt.get("toolchainMismatches"))
                      say("the attempt code returned a receipt", "pass" if attempt.get("attemptRan") else "FAIL", attempt.get("thrown"))
                      out.update(driverLogTee=attempt.get("driverLogTee"), driverLogBytes=attempt.get("driverLogBytes"), rootKept=attempt.get("rootKept"), wallSeconds=attempt.get("wallSeconds"))
                  if not isinstance(receipt, dict):
                      say("every phase", "not reached", "no receipt")
                      out.update(attemptRan=False, phases=[], peers=[], resizeAckMs=[], decider=None, processes=None)
                      return out
                  count = receipt.get("count")
                  outcomes = receipt.get("phaseOutcomes") or {}
                  out.update(attemptRan=True, count=count, passed=receipt.get("passed"), evidenceValid=receipt.get("evidenceValid"), stopReason=receipt.get("stopReason"), failure=receipt.get("failure"))
                  out["phases"] = [{"phase": name, "outcome": outcomes.get(name, "not reached")} for name in (*summarise.PHASE_SEQUENCE, "cleanup")]
                  for row in out["phases"]:
                      say(f"phase {row['phase']}", {"passed": "pass", "failed": "FAIL", "running": "FAIL"}.get(row["outcome"], "not reached"), None if row["outcome"] == "passed" else row["outcome"])
                  say("the attempt passed with valid evidence", "pass" if receipt.get("passed") is True and receipt.get("evidenceValid") is True and not receipt.get("stopReason") else "FAIL", receipt.get("failure"))
                  proof = receipt.get("proof")
                  say("the runtime proof", "not reached" if not isinstance(proof, dict) else "pass" if proof.get("ok") is True else "FAIL", (proof or {}).get("failures") if isinstance(proof, dict) else None)
                  out["processes"] = guarded(errors, "processes", lambda: process_rows(private, receipt))
                  if mode == "rust-shell" and isinstance(out["processes"], dict):
                      named = out["processes"]["sidecarPids"]
                      say("the driver's samples name exactly one sidecar, a child of the backend", "pass" if len(named) == 1 and out["processes"]["sidecarParentIsTheBackend"] == [True] else "FAIL", {"sidecarsNamed": len(named)})
                  out["peers"] = peer_rows(receipt, count, hosted_seams, summarise, errors) if isinstance(count, int) else []
                  if not out["peers"]:
                      say("the byte ledger of every peer", "not reached", "the receipt holds no ledger record (the attempt stopped before its after-exit checks)")
                  for row in out["peers"]:
                      say(f"peer {row['peer']}: the ledger rules (with this platform's seams)", "FAIL" if row["ledgerProblems"] or row["ledgerProblems"] is None else "pass", row["ledgerProblems"])
                      say(f"peer {row['peer']}: delta - accepted - L inside [0, slack]", "not run" if system != "Windows" else "pass" if row.get("insideTheWindowsBound") else "FAIL",
                          {key: row.get(key) for key in ("deltaMinusAcceptedMinusLines", "deltaMinusAccepted", "registeredLines", "slackBytes")})
                      say(f"peer {row['peer']}: the log file's identity at the close is the one at create", "pass" if row.get("logFileIdentityAtCloseIsTheOneAtCreate") else "FAIL", row.get("logFileIdentityBits"))
                  latencies = receipt.get("latencies") or {}
                  out["resizeAckMs"] = latencies.get("resize_ack_ms") or []
                  say("20 resize probes recorded", "pass" if len(out["resizeAckMs"]) == 20 else "not reached" if outcomes.get("resize_ack") is None else "FAIL", len(out["resizeAckMs"]))
                  for index, burst in enumerate(receipt.get("burstChecks") or []):
                      say(f"peer {index}: the burst endpoint check", "pass" if isinstance(burst, dict) and burst.get("kind") == "pass" else "FAIL", burst if isinstance(burst, dict) else None)
                  stages: dict = {}
                  if isinstance(f0, dict):
                      files = Files(private)
                      trial = files.read_json("receipt.json")
                      resources = "receipt" + summarise.RESOURCES_SUFFIX
                      # diag4 (D3-5): the freeze the rehearsal verdict gives these checks is `bundle.freeze_view(F0)` (`rehearsal_verdict.admission`), not F0 itself. diag3 passed F0, whose `workload` record is not
                      # the one `structure_problems` reads, so the structure stage raised KeyError in all four real attempts and was never run.
                      view = guarded(errors, "bundle.freeze_view", lambda: g3bundle.freeze_view(f0))
                      if view is not None:
                          stages["structure"] = guarded(errors, "summarise.structure_problems", lambda: list(summarise.structure_problems(trial, view, files, resources)[0]))
                          stages["consistency"] = guarded(errors, "summarise.consistency_problems", lambda: list(summarise.consistency_problems(trial)))
                          stages["trial"] = guarded(errors, "summarise.trial_problems", lambda: list(summarise.trial_problems({k: v for k, v in trial.items() if k != "_samples"}, view, mode, trial.get("count"))))
                  out["decider"] = {"check": "the three stages of rehearsal_verdict._trial_check, each run whatever the others said", "stages": stages}
                  for name, text in (("structure", "the receipt's structure (summarise.structure_problems)"), ("consistency", "the receipt's consistency (summarise.consistency_problems)"),
                                     ("trial", "the trial's evidence (summarise.trial_problems)")):
                      problems = stages.get(name)
                      say(text, "not run" if problems is None else "pass" if problems == [] else "FAIL", problems)
                  return out
              finally:
                  out["checkErrors"] = errors
                  if callable(undo):
                      undo()


          def main(argv: list[str]) -> int:
              if len(argv) != 4:
                  print(__doc__, file=sys.stderr)
                  return 64
              records, private, f0_path, mode = Path(argv[0]), Path(argv[1]), Path(argv[2]), argv[3]
              try:
                  report = build(records, private, f0_path, mode)
              except Exception as error:  # noqa: BLE001 - the report is information; it never fails its step
                  report = {"schema": SCHEMA, "notEvidence": True, "mode": mode, "reportError": type(error).__name__, "verdicts": [{"check": "the report itself", "verdict": "FAIL", "detail": type(error).__name__}]}
              records.mkdir(parents=True, exist_ok=True)
              (records / "attempt-report.json").write_text(json.dumps(report, indent=1, sort_keys=True, default=str) + "\n", encoding="utf-8")
              for row in report.get("verdicts", []):
                  print(f"{mode}: {row['verdict']:<11} {row['check']}")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main(sys.argv[1:]))
          DIAG4_EOF_ATTEMPT_REPORT
          cat > "$RUNNER_TEMP/diag4/tools/diag4_probes.py" <<'DIAG4_EOF_PROBES'
          """diag4 (NOT evidence). Two small probes of what the log final check and the ledger's log-file rule rest on, run on the runner with this platform's hosted seams installed.

              uv --project backend run python -B diag4_probes.py holds OUT.json        (from the repository root)
              uv --project backend run python -B diag4_probes.py identity OUT.json

          holds     `log_final.holds` as an attempt's helper calls it: for a file a child process holds open (expected True), for this process (False), for the child after it closed the file (False), and
                    for the child after it ended (an inspection error, never a silent False). On Windows the check is psutil's open-files list, which no hosted run has shown to list a held file.
          identity  one file's identity as the two tools of an attempt take it: Python's `os.stat` (the close side, `log_final.read_once`, read once without the seams and once with them) and the runner's
                    `statSync` on Bun (the create side, as `g3ShellAttempt.ts` reduces it). It records the bit length of every number and whether the pairs are equal, raw and as the attempt compares them.
                    The numbers themselves are a volume serial number and a file index of the runner's temporary directory.
          Exit 0 when what the attempt relies on holds on this platform, 1 when it does not; the record is written either way.

              uv --project backend run python -B diag4_probes.py steplogs OUT_DIR LOG_DIR [LOG_DIR ...]

          steplogs  (diag4) the redacted tail of every `*.log` a plan step wrote into a LOG_DIR (the plan runner keeps each step's stdout and stderr in `<plan out>/logs/<step>.log`), as
                    `OUT_DIR/<plan directory>-<step>-tail.txt`, through the pack's own `hosted_diag.redacted_tail`. In diag3 the correctness step's log stayed on the runner, so its failure text was in no record.
                    Always exits 0; a log that cannot be read is named in `OUT_DIR/steplogs.json` by its error class.
          """
          from __future__ import annotations

          import json
          import os
          import platform
          import shutil
          import subprocess
          import sys
          import tempfile
          import time
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd() / "backend"))

          SCHEMA = "acr-g3h-diag4-probe/1"
          # The holder prints its own pid: under a Windows venv `sys.executable` is a launcher whose child is the interpreter, and the interpreter is the process that holds the file.
          HOLDER = ("import os, sys\nf = open(sys.argv[1], 'ab')\nprint('open', os.getpid(), flush=True)\nsys.stdin.readline()\nf.close()\nprint('closed', flush=True)\nsys.stdin.readline()\n")
          STAT_JS = ("const fs=require('fs');const i=fs.statSync(process.env.DIAG4_STAT_PATH,{bigint:true});"
                     "console.log(JSON.stringify({dev:String(i.dev),ino:String(i.ino),devAsTheAttemptTakesIt:String(process.platform==='win32'?BigInt.asUintN(32,i.dev):i.dev)}))")


          def seams():
              from tests.cli_regression.support.g3 import hosted_posix_stubs
              hosted_posix_stubs.install()
              from tests.cli_regression.support.g1e import log_final
              from tests.cli_regression.support.g3 import hosted_seams
              return log_final, hosted_seams


          def timed(call) -> tuple[object, float]:
              start = time.perf_counter()
              try:
                  value = call()
              except Exception as error:  # noqa: BLE001 - the class of the error is the result
                  value = f"raised {type(error).__name__}"
              return value, round((time.perf_counter() - start) * 1000, 1)


          def holds(system: str) -> dict:
              log_final, hosted_seams = seams()
              with tempfile.TemporaryDirectory(prefix="diag4-holds-") as scratch:
                  target = Path(scratch) / "held.log"
                  target.write_bytes(b"x")
                  child = subprocess.Popen([sys.executable, "-c", HOLDER, str(target)], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True)
                  undo = hosted_seams.install(system)
                  try:
                      identity = log_final.identity(target)
                      word, _, pid_text = child.stdout.readline().strip().partition(" ")
                      said, holder = [word], int(pid_text)
                      held, held_ms = timed(lambda: log_final.holds(holder, identity))
                      own, own_ms = timed(lambda: log_final.holds(os.getpid(), identity))
                      child.stdin.write("\n")
                      child.stdin.flush()
                      said.append(child.stdout.readline().strip())
                      released, released_ms = timed(lambda: log_final.holds(holder, identity))
                      child.stdin.write("\n")
                      child.stdin.flush()
                      child.wait(timeout=30)
                      time.sleep(0.5)      # the interpreter behind a launcher ends a moment after the launcher does
                      gone, gone_ms = timed(lambda: log_final.holds(holder, identity))
                  finally:
                      undo()
                      if child.poll() is None:
                          child.kill()
              got = {"aChildThatHoldsTheFile": held, "thisProcess": own, "theChildAfterItClosedTheFile": released, "theChildAfterItEnded": gone}
              want = {"aChildThatHoldsTheFile": True, "thisProcess": False, "theChildAfterItClosedTheFile": False, "theChildAfterItEnded": "raised InspectionError"}
              return {"probe": "holds", "checkInstalled": getattr(hosted_seams.hosted_host.holds_for(system), "__name__", "?"), "childSaid": said, "holderIsTheStartedProcess": holder == child.pid, "got": got, "expected": want,
                      "callMs": {"held": held_ms, "own": own_ms, "released": released_ms, "gone": gone_ms}, "ok": got == want}


          def identity(system: str) -> dict:
              log_final, hosted_seams = seams()
              bun = shutil.which("bun")
              with tempfile.TemporaryDirectory(prefix="diag4-identity-") as scratch:
                  target = Path(scratch) / "peer-0.log"
