          STEPLOG_LINES = 120


          def steplogs(out_dir: Path, log_dirs: list[Path]) -> dict:
              from tests.cli_regression.support.g3 import hosted_diag
              out_dir.mkdir(parents=True, exist_ok=True)
              rows = {}
              for directory in log_dirs:
                  for log in sorted(directory.glob("*.log")) if directory.is_dir() else []:
                      name = f"{directory.parent.name}-{log.stem}-tail.txt"
                      try:
                          text = log.read_text(encoding="utf-8", errors="replace")
                          lines = hosted_diag.redacted_tail(text, STEPLOG_LINES)
                          (out_dir / name).write_text("\n".join(lines) + "\n", encoding="utf-8")
                          rows[name] = {"bytes": log.stat().st_size, "lines": text.count("\n"), "tailLines": len(lines)}
