            }
            const count = (key: string): number => rows.filter((row) => row[key] === true).length
            const summary = { schema: 'acr-g3h-diag4-shell-ready/1', notEvidence: true, mode, platform: process.platform, shellsCreated: rows.length, shellsExpected: ROUNDS * 2,
              titleInsideTheLine: count('titleInsideTheLine'), titleAfterTheLine: count('titleAfterTheLine'), withAnOscSequence: rows.filter((row) => (row.oscSequences as number) > 0).length,
              readWithCsiRemovedOnly: rows.filter((row) => row.csiOnlyError === null).length, readThroughTheView: rows.filter((row) => row.viewError === null).length, problems, rows }
            writeFileSync(join(out, 'shell-ready.json'), `${redactDiagnostic(JSON.stringify(summary, null, 1))}\n`)
            process.stdout.write(`diag4 shell-ready ${mode}: ${summary.readThroughTheView} of ${rows.length} READY lines read through the view, the title inside the line in ${summary.titleInsideTheLine}\n`)
            expect({ problems, created: rows.length, readThroughTheView: summary.readThroughTheView }).toEqual({ problems: [], created: ROUNDS * 2, readThroughTheView: ROUNDS * 2 })
          }, 600_000)

          // ---------------------------------------------------------------------------------------------------------------- self-check (no backend, no driver, no attempt): run off the runner by test_g3h_diag4.py
          it.runIf(enabled && selfCheck)('diag4 self-check: the driver-output listener sees a child started through the named `spawn`, and the record helpers do what they say', async () => {
            expect(teeState).toBe('installed')
            const child = spawn(process.execPath, ['-e', "console.log('diag4-selfcheck-line')", DRIVER_MODULE], { stdio: ['ignore', 'pipe', 'pipe'] })
            const own: string[] = []
            child.stdout!.on('data', (chunk) => { own.push(String(chunk)) }) // the attempt's own listener: it must still get every byte
            await new Promise<void>((done) => { child.on('close', () => done()) })
            expect(driverSpawns).toBe(1)
            expect(driverLog.join('')).toContain('diag4-selfcheck-line')
            expect(own.join('')).toContain('diag4-selfcheck-line')
            const other = spawn(process.execPath, ['-e', "console.log('not the driver')"], { stdio: ['ignore', 'pipe', 'pipe'] })
            await new Promise<void>((done) => { other.on('close', () => done()) })
            expect(driverSpawns).toBe(1) // only a command that names the driver module is listened to
            const trimmed = trimmedReceipt({ passed: false, failure: 'x', latencies: { io_ms: [1, 2, 3], resize_ack_ms: [4, 5] }, ledgers: [{ logFile: { size: 9 } }] }) as Record<string, any>
            expect(trimmed.latencies).toBeUndefined()
            expect(trimmed.latencyCounts).toEqual({ io_ms: 3, resize_ack_ms: 2 })
            expect(trimmed.resizeAckMs).toEqual([4, 5])
            expect(trimmed.ledgers).toEqual([{ logFile: { size: 9 } }])
            const kept = mkdtempSync(join(tmpdir(), 'diag4-selfcheck-'))
            for (const directory of ['g1e', 'logs', 'home', 'data/logs']) mkdirSync(join(kept, directory), { recursive: true })
            const token = 'S'.repeat(24) // a backend URL token as `redactDiagnostic` knows it (`?token=...`), made here at run time
            writeFileSync(join(kept, 'endpoint.json'), `{"url": "ws://127.0.0.1:1/?token=${token}"}`)
            writeFileSync(join(kept, 'g1e/pane.peer.json'), `{"acceptedSinceOrigin": 5, "note": "ws://127.0.0.1:1/?token=${token}"}`)
            writeFileSync(join(kept, 'first-backend.log'), `${'line\n'.repeat(10_000)}last line ws://127.0.0.1:1/?token=${token}\n`)
            writeFileSync(join(kept, 'logs/peer-0.log'), 'peer text\n')
            writeFileSync(join(kept, 'home/secret.txt'), 'never copied')
            const target = join(kept, 'staged')
            const staged = stageRoot(kept, target)
            expect(staged.staged.sort()).toEqual(['first-backend.log', 'g1e/pane.peer.json', 'logs/peer-0.log'])
            expect(staged.problems).toEqual([])
            expect(readdirSync(target).sort()).toEqual(['first-backend.log.tail.txt', 'g1e__pane.peer.json', 'logs__peer-0.log'])
            expect(readFileSync(join(target, 'g1e__pane.peer.json'), 'utf8')).not.toContain(token)
            const tail = readFileSync(join(target, 'first-backend.log.tail.txt'), 'utf8')
            expect(tail.length).toBeLessThanOrEqual(TAIL_CHARS)
            expect(tail).toContain('last line')
            expect(tail).not.toContain(token)
            expect(staged.files.map((file) => file.path)).toContain('endpoint.json') // listed by name and size, never copied
            expect(existsSync(join(target, 'endpoint.json'))).toBe(false)
            // the two shapes of an ordinary shell's READY line on the inbox console: the title after the line's CR LF (read by rh18 too), and between the text and the CR LF (diag2's first Rust-arm failure)
            const head = '\u001b[?9001h\u001b[?1004h\u001b[?25l\u001b[2J\u001b[m\u001b[H'
            const title = '\u001b]0;C:\\hostedtoolcache\\python.exe\u0007'
            const after = shellReadyFacts(Buffer.from(`${head}BASELINE_READY {"pid":7}\r\n${title}\u001b[?25h`))
            expect([after.titleInsideTheLine, after.titleAfterTheLine, after.csiOnlyError, after.viewError]).toEqual([false, true, null, null])
            const inside = shellReadyFacts(Buffer.from(`${head}BASELINE_READY {"pid":7}${title}\u001b[?25h\r\n`))
            expect([inside.titleInsideTheLine, inside.titleAfterTheLine, inside.viewError, inside.oscSequences]).toEqual([true, false, null, 1])
            expect(inside.csiOnlyError).not.toBeNull()
            expect(shellReadyFacts(Buffer.from('no line yet')).viewError).toBe('no READY line')
            mkdirSync(out, { recursive: true })
            writeFileSync(join(out, 'selfcheck.json'), `${JSON.stringify({ teeState, runtime: process.versions.bun ? 'bun' : 'node', cell, kind })}\n`)
          }, 60_000)
          DIAG4_EOF_ATTEMPT_TEST
          test "$(sha256sum < "$RUNNER_TEMP/diag4/tools/diag4_attempt_run.py" | cut -d' ' -f1)" = "38e046c8520d22168cffc6aefb2a25a061137fb34f309efc298e23a6f8ef14b1"
          test "$(sha256sum < "$RUNNER_TEMP/diag4/tools/diag4_attempt_report.py" | cut -d' ' -f1)" = "42f07ebb6799f841e07b80055770fb9e6c0232e5b7a0d114d487dfd16ccf90f9"
          test "$(sha256sum < "$RUNNER_TEMP/diag4/tools/diag4_probes.py" | cut -d' ' -f1)" = "ced22fa4df2d7f94c0c5225af611ca5c17e86f9706158b559d6c04cee7e265f2"
          test "$(sha256sum < tests/cli/g3hDiag4Attempt.test.ts | cut -d' ' -f1)" = "12c73bbfb350ece8cc8698ff1e2c086a2c25883f255b27fdcdc56d1b2e52e43d"

