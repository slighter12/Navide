          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-3/run-diag4-attempt.json" ]; then mkdir -p "$out/attempt-python-c4" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-3/run-diag4-attempt.json" "$out/attempt-python-c4/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-4/run-diag4-attempt.json" ]; then mkdir -p "$out/attempt-rust-c4" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-4/run-diag4-attempt.json" "$out/attempt-rust-c4/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-5/run-diag4-attempt.json" ]; then mkdir -p "$out/shell-ready-python" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-5/run-diag4-attempt.json" "$out/shell-ready-python/plan-journal.json" || true; fi
          if [ -f "$RUNNER_TEMP/g3r2/rehearsal/attempt-6/run-diag4-attempt.json" ]; then mkdir -p "$out/shell-ready-rust" && cp "$RUNNER_TEMP/g3r2/rehearsal/attempt-6/run-diag4-attempt.json" "$out/shell-ready-rust/plan-journal.json" || true; fi
          if [ -d "$RUNNER_TEMP/g3r2h/markers" ]; then cp -r "$RUNNER_TEMP/g3r2h/markers/." "$out/markers/" || echo "the markers could not be copied"; fi
          uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_diag.py stage-smoke "$RUNNER_TEMP/g3r2h/smoke" "$out/smoke" > "$out/smoke/staged.txt" 2>&1 || echo "stage-smoke failed" >> "$out/smoke/staged.txt"
          for f in "$RUNNER_TEMP/g3r2h/rustc-vV.txt" "$RUNNER_TEMP/g3r2h/pre/correctness-gate.json" "$RUNNER_TEMP/g3r2h/pre/correctness-receipt.json" "$RUNNER_TEMP/g3r2h/pre/g2-receipt-binding.json"; do if [ -f "$f" ]; then cp "$f" "$out/" || true; fi; done
          uv --project backend run python -B "$RUNNER_TEMP/diag4/tools/diag4_probes.py" steplogs "$out/step-logs" "$RUNNER_TEMP/g3r2h/pre/logs" "$RUNNER_TEMP/g3r2h/smoke/logs" "$RUNNER_TEMP/g3r2h/conpty-probe/logs" || echo "the step logs could not be staged"
          mkdir -p "$out/correctness"
          for f in "$RUNNER_TEMP/g3r2h/pre/correctness-junit.xml" "$RUNNER_TEMP/g3r2h/pre/correctness-vitest.json"; do if [ -f "$f" ]; then cp "$f" "$out/correctness/" || true; fi; done
          mkdir -p "$out/test-steps"
          for f in test-results/ci/g2-windows-*; do if [ -f "$f" ]; then cp "$f" "$out/test-steps/" || true; fi; done
          if [ -d "$RUNNER_TEMP/g3r2h/conpty-probe" ]; then cp -r "$RUNNER_TEMP/g3r2h/conpty-probe" "$out/conpty-probe" || echo "the ConPTY probe records could not be copied"; fi
          {
            printf 'NOT-EVIDENCE diag4\njob=%s\n' "$JOB_STATUS"
            printf 'step=%s outcome=%s%s\n' queue "$O_QUEUE" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' pins "$O_PINS" ""
            printf 'step=%s outcome=%s%s\n' identity "$O_IDENTITY" ""
            printf 'step=%s outcome=%s%s\n' install "$O_INSTALL" ""
            printf 'step=%s outcome=%s%s\n' shim "$O_SHIM" ""
            printf 'step=%s outcome=%s%s\n' build "$O_BUILD" ""
            printf 'step=%s outcome=%s%s\n' packaged "$O_PACKAGED" ""
            printf 'step=%s outcome=%s%s\n' smoke "$O_SMOKE" ""
            printf 'step=%s outcome=%s%s\n' conptyprobe "$O_CONPTYPROBE" ""
            printf 'step=%s outcome=%s%s\n' proof "$O_PROOF" ""
            printf 'step=%s outcome=%s%s\n' cargo "$O_CARGO" ""
            printf 'step=%s outcome=%s%s\n' g2env "$O_G2ENV" ""
            printf 'step=%s outcome=%s%s\n' pytest "$O_PYTEST" ""
            printf 'step=%s outcome=%s%s\n' guard "$O_GUARD" ""
            printf 'step=%s outcome=%s%s\n' receipts "$O_RECEIPTS" ""
            printf 'step=%s outcome=%s%s\n' principal "$O_PRINCIPAL" ""
            printf 'step=%s outcome=%s%s\n' principal_guard "$O_PRINCIPAL_GUARD" ""
            printf 'step=%s outcome=%s%s\n' principal_cases "$O_PRINCIPAL_CASES" ""
            printf 'step=%s outcome=%s%s\n' correctness "$O_CORRECTNESS" ""
            printf 'step=%s outcome=%s%s\n' bind "$O_BIND" ""
            printf 'step=%s outcome=%s%s\n' teststeps "$O_TESTSTEPS" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' image "$O_IMAGE" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' tools "$O_TOOLS" ""
            printf 'step=%s outcome=%s%s\n' holdsprobe "$O_HOLDSPROBE" ""
            printf 'step=%s outcome=%s%s\n' identityprobe "$O_IDENTITYPROBE" ""
            printf 'step=%s outcome=%s%s\n' f0 "$O_F0" ""
            printf 'step=%s outcome=%s%s\n' shellready_python "$O_SHELLREADY_PYTHON" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' shellready_rust "$O_SHELLREADY_RUST" " kind=information-only"
            printf 'step=%s outcome=%s%s\n' attempt_python_c1 "$O_ATTEMPT_PYTHON_C1" ""
            printf 'step=%s outcome=%s%s\n' attempt_rust_c1 "$O_ATTEMPT_RUST_C1" ""
            printf 'step=%s outcome=%s%s\n' attempt_python_c4 "$O_ATTEMPT_PYTHON_C4" ""
            printf 'step=%s outcome=%s%s\n' attempt_rust_c4 "$O_ATTEMPT_RUST_C4" ""
            printf 'step=%s outcome=%s%s\n' verdicts "$O_VERDICTS" " kind=information-only"
          } > "$out/diag-summary.txt" || echo "the summary could not be written"
          cat "$out/diag-summary.txt" || true
          find "$out" -type f | sort > "$RUNNER_TEMP/diag4/files.txt" || true
          cp "$RUNNER_TEMP/diag4/files.txt" "$out/files.txt" || true

      - name: Leak check (no token or runner secret in the upload)
        id: leak
        if: always()
        timeout-minutes: 2
        run: if grep -r -l -E '(ghs|ghp|gho|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$RUNNER_TEMP/diag4/out"; then echo "credential-like text found"; exit 1; fi

      - name: Upload everything the diagnostic recorded (always runs, after the leak check)
        if: always() && steps.leak.outcome == 'success'
        timeout-minutes: 10
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g3h-diag4-windows
          path: ${{ runner.temp }}/diag4/out
          if-no-files-found: warn
          retention-days: 7

      - name: diag4, fail the job when a decisive step did not succeed (last step, after the upload; an information-only step never fails the job)
        id: verdict
        if: always()
        timeout-minutes: 1
        env:
          O_PINS: ${{ steps.pins.outcome }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_SHIM: ${{ steps.shim.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_PACKAGED: ${{ steps.packaged.outcome }}
          O_SMOKE: ${{ steps.smoke.outcome }}
          O_CONPTYPROBE: ${{ steps.conptyprobe.outcome }}
          O_PROOF: ${{ steps.proof.outcome }}
          O_CARGO: ${{ steps.cargo.outcome }}
          O_G2ENV: ${{ steps.g2env.outcome }}
          O_PYTEST: ${{ steps.pytest.outcome }}
          O_GUARD: ${{ steps.guard.outcome }}
          O_RECEIPTS: ${{ steps.receipts.outcome }}
          O_PRINCIPAL: ${{ steps.principal.outcome }}
          O_PRINCIPAL_GUARD: ${{ steps.principal_guard.outcome }}
          O_PRINCIPAL_CASES: ${{ steps.principal_cases.outcome }}
          O_CORRECTNESS: ${{ steps.correctness.outcome }}
          O_BIND: ${{ steps.bind.outcome }}
          O_TOOLS: ${{ steps.tools.outcome }}
          O_HOLDSPROBE: ${{ steps.holdsprobe.outcome }}
          O_IDENTITYPROBE: ${{ steps.identityprobe.outcome }}
          O_F0: ${{ steps.f0.outcome }}
          O_ATTEMPT_PYTHON_C1: ${{ steps.attempt_python_c1.outcome }}
          O_ATTEMPT_RUST_C1: ${{ steps.attempt_rust_c1.outcome }}
          O_ATTEMPT_PYTHON_C4: ${{ steps.attempt_python_c4.outcome }}
          O_ATTEMPT_RUST_C4: ${{ steps.attempt_rust_c4.outcome }}
        run: |
          failed=0
          for pair in "pins=$O_PINS" "identity=$O_IDENTITY" "install=$O_INSTALL" "shim=$O_SHIM" "build=$O_BUILD" "packaged=$O_PACKAGED" "smoke=$O_SMOKE" "conptyprobe=$O_CONPTYPROBE" "proof=$O_PROOF" "cargo=$O_CARGO" "g2env=$O_G2ENV" "pytest=$O_PYTEST" "guard=$O_GUARD" "receipts=$O_RECEIPTS" "principal=$O_PRINCIPAL" "principal_guard=$O_PRINCIPAL_GUARD" "principal_cases=$O_PRINCIPAL_CASES" "correctness=$O_CORRECTNESS" "bind=$O_BIND" "tools=$O_TOOLS" "holdsprobe=$O_HOLDSPROBE" "identityprobe=$O_IDENTITYPROBE" "f0=$O_F0" "attempt_python_c1=$O_ATTEMPT_PYTHON_C1" "attempt_rust_c1=$O_ATTEMPT_RUST_C1" "attempt_python_c4=$O_ATTEMPT_PYTHON_C4" "attempt_rust_c4=$O_ATTEMPT_RUST_C4"; do
            case "${pair#*=}" in success) ;; *) echo "the step ${pair%%=*} did not succeed (${pair#*=})"; failed=1 ;; esac
          done
          exit "$failed"
