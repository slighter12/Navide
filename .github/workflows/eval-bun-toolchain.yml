          echo "harness_archive_sha256=$(sha256sum "$RUNNER_TEMP/harness.tar.gz" | awk '{print $1}')"
          mkdir -p "$T07_BASE/harness"
          tar -xzf "$RUNNER_TEMP/harness.tar.gz" -C "$T07_BASE/harness"
          cd "$T07_BASE/harness"
          sha256sum -c MANIFEST.sha256
          cat MANIFEST.sha256

      - name: Resolve case tool paths
        run: |
          set -euo pipefail
          echo "T07_GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "T07_HEAD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "T07_NODE_ROOT=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
          echo "T07_PNPM_ROOT=$RUNNER_TEMP/pnpmroot/node_modules/pnpm" >> "$GITHUB_ENV"
          echo "T07_UV_BIN=$(command -v uv)" >> "$GITHUB_ENV"
          echo "T07_GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          echo "T07_BUN_ZIP=$RUNNER_TEMP/bun142.zip" >> "$GITHUB_ENV"
          echo "T07_BUN141_BIN=$RUNNER_TEMP/bun141/bun-linux-x64/bun" >> "$GITHUB_ENV"
          node --version
          go version
          uv --version

      - name: Create the two isolated cases
        run: python3 "$T07_HARNESS/t07_setup.py"

      - name: Prepare the baseline case, then the candidate case
        run: |
          python3 "$T07_HARNESS/t07_prep.py" base
          python3 "$T07_HARNESS/t07_prep.py" bun

      - name: Measure the full root workflow and both single-file workloads
        run: python3 "$T07_HARNESS/t07_performance.py"

      - name: Aggregate analysis
        if: always()
        run: python3 "$T07_HARNESS/t07_analyze.py"


      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t07-performance
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.T07_BASE }}/setup.json
            ${{ env.T07_BASE }}/guard.json
            ${{ env.T07_BASE }}/analysis.json
            ${{ env.T07_BASE }}/performance
            ${{ env.T07_BASE }}/t07-base-node/env.json
            ${{ env.T07_BASE }}/t07-head-bun/env.json
            ${{ env.T07_BASE }}/t07-base-node/receipts
            ${{ env.T07_BASE }}/t07-base-node/logs
            ${{ env.T07_BASE }}/t07-base-node/vitest-json
            ${{ env.T07_BASE }}/t07-head-bun/receipts
            ${{ env.T07_BASE }}/t07-head-bun/logs
            ${{ env.T07_BASE }}/t07-head-bun/vitest-json
            ${{ env.T07_BASE }}/cons-npm-base
            ${{ env.T07_BASE }}/cons-npm-bun
            ${{ env.T07_BASE }}/cons-pnpm-base
            ${{ env.T07_BASE }}/cons-pnpm-bun

