# Evaluation-only workflow for the Bun toolchain evaluation (GitHub issue 2, ticket 07).
#
# Scope and authority:
#   * Trigger: `push` of an `eval-bun-ci-*` tag ONLY.  No branch, PR, schedule or
#     dispatch trigger.  Every attempt gets a new tag so no attempt is hidden.
#   * No secrets, no `secrets.*`, no repository writes: `permissions: contents: read`.
#   * No existing project workflow is modified or invoked; the project's own Linux
#     CI approach (xvfb-run for Electron, bubblewrap suites with the host
#     namespace policy toggled exactly as `.github/workflows/linux-sandbox.yml`
#     does) is mirrored, never weakened: the evaluation adds no sandbox switch.
#   * Linux execution happens on GitHub-hosted ubuntu-24.04 runners through the
#     user's public fork `slighter12/Navide`.
#
# What runs here (ticket 07 criteria, macOS method):
#   correctness  exact-version acceptance/rejection before any install; frozen
#                installs; aggregate typechecks; real builds; minimal SDK/DOM
#                suites; full root Vitest inventory; supplementary suites
#                (Mini-IDE, dev-backend, packaged Plugin lifecycle, bubblewrap
#                sandbox suites); a relative-`vi.mock` path-with-spaces probe.
#   consumers    genuine packed artifacts consumed by separate npm and pnpm
#                consumer projects (frozen ticket-05 fixture).
#   readiness    isolated `dev` launch under xvfb with /health, per-start
#                WebSocket token and plugin-MCP probes.
#   performance  the full root workflow and both single-file workloads,
#                cold/warm, five interleaved samples per runtime and condition.
#
# The harness travels as one base64 gzip tarball whose extracted bytes are
# verified with `sha256sum -c MANIFEST.sha256`; the same list is printed in the
# run log.  `t07_analyze.py` aggregates the job outputs.

name: Bun toolchain evaluation (Linux, eval-only)

on:
  push:
    tags:
      - 'eval-bun-ci-*'

permissions:
  contents: read

concurrency:
  group: eval-bun-toolchain-${{ github.ref }}
  cancel-in-progress: false

