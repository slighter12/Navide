          T07_HARNESS_BLOB
          echo "harness_archive_sha256=$(sha256sum "$RUNNER_TEMP/harness.tar.gz" | awk '{print $1}')"
          mkdir -p "$T07_BASE/harness"
          tar -xzf "$RUNNER_TEMP/harness.tar.gz" -C "$T07_BASE/harness"
          cd "$T07_BASE/harness"
          sha256sum -c MANIFEST.sha256
          cat MANIFEST.sha256

      - name: Resolve case tool paths
        run: |
          set -euo pipefail
          echo "T07_GITHUB_WORKSPACE=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "T07_NODE_ROOT=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
          echo "T07_PNPM_ROOT=$RUNNER_TEMP/pnpmroot/node_modules/pnpm" >> "$GITHUB_ENV"
          echo "T07_UV_BIN=$(command -v uv)" >> "$GITHUB_ENV"
          echo "T07_GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          echo "T07_BUN_ZIP=$RUNNER_TEMP/bun142.zip" >> "$GITHUB_ENV"
          echo "T07_BUN141_BIN=$RUNNER_TEMP/bun141/bun-linux-x64/bun" >> "$GITHUB_ENV"
          node --version
          go version
          uv --version

      - name: Create the two isolated cases
        run: python3 "$T07_HARNESS/t07_setup.py"

      - name: Prepare the baseline case, then the candidate case
        run: |
          python3 "$T07_HARNESS/t07_prep.py" base
          python3 "$T07_HARNESS/t07_prep.py" bun

      - name: Launch the real dev workflow and probe its own seams
        run: python3 "$T07_HARNESS/t07_readiness.py"

      - name: Aggregate analysis
        if: always()
        run: python3 "$T07_HARNESS/t07_analyze.py"


      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t07-readiness
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.T07_BASE }}/setup.json
            ${{ env.T07_BASE }}/guard.json
            ${{ env.T07_BASE }}/analysis.json
            ${{ env.T07_BASE }}/readiness
            ${{ env.T07_BASE }}/t07-base-node/receipts
            ${{ env.T07_BASE }}/t07-base-node/logs
            ${{ env.T07_BASE }}/t07-base-node/vitest-json
            ${{ env.T07_BASE }}/t07-head-bun/receipts
            ${{ env.T07_BASE }}/t07-head-bun/logs
            ${{ env.T07_BASE }}/t07-head-bun/vitest-json

  performance:
    name: End-to-end test-workflow performance (same machine)
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    env:
      T07_BASE: /home/runner/work/_temp/t07-eval
      T07_HARNESS: /home/runner/work/_temp/t07-eval/harness

    steps:

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the runner temp path this workflow assumes
        run: |
          echo "RUNNER_TEMP=$RUNNER_TEMP"
          [ "$RUNNER_TEMP" = "/home/runner/work/_temp" ] || {
            echo "RUNNER_TEMP is not /home/runner/work/_temp; T07_BASE would be wrong"
            exit 1
          }

      - name: Record runner identity
        run: |
          set -x
          cat /etc/os-release
          uname -a
          nproc
          free -m
          df -h /
          python3 --version
          git --version

      - name: Install system prerequisites
        run: |
          sudo apt-get update
          for pkg in xvfb xauth bubblewrap build-essential unzip curl \
                     libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
                     libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
                     libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 libasound2t64; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$pkg" \
              || echo "apt: $pkg not installed (recorded)"
          done
          bwrap --version || true

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Set up Go for the packaged Plans fixture
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Stage pnpm 10.0.0 (JavaScript entry executed by the pinned Node)
        run: |
          npm install --prefix "$RUNNER_TEMP/pnpmroot" pnpm@10.0.0 --no-audit --no-fund --ignore-scripts
          "$RUNNER_TEMP/pnpmroot/node_modules/pnpm/bin/pnpm.cjs" --version || true

      - name: Download and verify the Bun 1.4.2 and 1.4.1 archives
        run: |
          set -euo pipefail
          fetch() {
            curl -fsSL -o "$RUNNER_TEMP/$2" "$1"
          }
          fetch https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/bun-linux-x64.zip bun142.zip
          fetch https://github.com/oven-sh/bun/releases/download/bun-v1.4.2/SHASUMS256.txt SHASUMS256-1.4.2.txt
          fetch https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/bun-linux-x64.zip bun141.zip
          fetch https://github.com/oven-sh/bun/releases/download/bun-v1.4.1/SHASUMS256.txt SHASUMS256-1.4.1.txt
          for version in 1.4.2 1.4.1; do
            expected="$(grep ' bun-linux-x64.zip$' "$RUNNER_TEMP/SHASUMS256-$version.txt" | awk '{print $1}')"
            actual="$(sha256sum "$RUNNER_TEMP/bun${version//./}.zip" | awk '{print $1}')"
            echo "bun $version archive sha256=$actual expected(publisher SHASUMS256.txt)=$expected"
            [ "$actual" = "$expected" ] || { echo "Bun $version archive hash mismatch"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/bun141"
          unzip -q -o "$RUNNER_TEMP/bun141.zip" -d "$RUNNER_TEMP/bun141"
          "$RUNNER_TEMP/bun141/bun-linux-x64/bun" --version

