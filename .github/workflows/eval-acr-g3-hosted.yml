name: G3 Hosted Agent CLI Runtime

# DRAFT (rf4f). Registered G3 run on the rf3 freeze, Linux x64, hosted runner ubuntu-24.04. Evaluation only; holds no secrets and publishes nothing.
# Publish only after the rf4f checkpoint is accepted and, for the first push of a platform, an accepted rehearsal of that platform.
# There is no G1-E bundle in this run: the cost run takes six path arguments and no seventh, so the G1-E comparison is descriptive and not-same-class ("no same-class G1-E peer in a hosted run", D9). The Python-arm
# identity record (section 4.8) is written on the runner without a bundle (`python-arm-identity-f0`, E2); the V5 outcome stays "disclosed, not passed".
# TRIGGER: pushes of the dedicated branch eval/agent-cli-runtime-linux ONLY. None of the seven workflows that fire on eval/agent-cli-runtime lists that branch name, so this push starts none of them.
# The branch tip holds this file and NOT the rehearsal workflow of the same platform. The branch is pushed once for the registered run (a job that fails before the driver claim with nothing written is not a run, D11).
# STAGE H5 FILLS, before this file is committed to the workflows directory of the branch: H5_FILL_PACK_COMMIT (the commit of the orphan harness-pack branch) and H5_FILL_PACK_DIGEST (its archive digest).
# Two distinct SHAs: the run head is $GITHUB_SHA (the pushed commit, which also holds this file), and FREEZE_H is the head of the rf3 freeze. The identity step requires the product paths to equal FREEZE_H
# and the commit to differ from FREEZE_H in exactly this workflow file (D7).
# One job. The correctness precondition (D8, E1) runs in it, on the F0 sidecar, in the same session and before F0 is built: no separate correctness job, so it cannot be satisfied by another runner's sidecar.
# On every platform the `correctness` step runs the 21 G1-E rows of `g1e/gates.py` REGISTRY, gated by case (G1): a row names its required cases, a case the platform cannot run is listed with its reason and proves
# nothing, and a skipped or absent required case fails the row. It writes a receipt that names the sidecar by path and SHA-256.
# The JavaScript runtime is plain default Bun (D2): no setup-node, no pnpm, no version pin; the TS clients run on Bun (`bunx --bun`, `bun run`).
# rf4f (H1-H5): the `correctness` step first stages the reader descriptor the runner built and verified (`pre/FIXTURES.json`) over the packed one, so the reader cases run on runner-built fixtures; it runs a real
# `pytest --collect-only` with its own arguments (rootdir-relative `--deselect` ids, every variant of a parametrized case expected), and a required case that did not pass fails its row. On macOS the interpreter
# preflight also checks the pinned build's compile stamp.
# rh9 (rehearsal 2 finding): the G2 backend cases run in the virtual environment the registered G2 Linux workflow uses ($RUNNER_TEMP/g2-venv). The three stub-sidecar scripts the tests write start with
# `#!<sys.executable>`, so their SHA-256 depends on the interpreter path, and the Linux receipt pins of tests/cli/g2-receipt-expectations-linux.json were taken with that path. A step before the pytest step creates the
# environment the way the registered workflow does (`uv --project backend sync --locked`), and UV_PROJECT_ENVIRONMENT is set on that step and on the pytest step ONLY (the pack and the TypeScript cases look for backend/.venv).

on:
  push:
    branches:
      - eval/agent-cli-runtime-linux

permissions:
  contents: read

env:
  FREEZE_H: 202084cf74eccb07bec366897ebf4c588799e72e
  PACK_COMMIT: "a72bc60971f495193a8228c1f8dbda4cf48f0229"
  PACK_DIGEST: "a61f05dd999f71e250a9ce847acbe75063e98d04a181c2e94343e9d9069fe518"

jobs:
  cost-linux:
    name: cost-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    defaults:
      run:
        shell: bash
    env:
      G3H_OS: Linux
    steps:
      - name: Pin line endings before any checkout
        run: git config --global core.autocrlf false

      - name: Check out evaluation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the harness pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACK_COMMIT }}
          path: pack
          persist-credentials: false

      - name: Check the run head and the checked-out bytes
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git config --get core.autocrlf)" = "false"
          test -z "$(git status --porcelain -- . ':(exclude)pack')"

      - name: Verify the pack digest, then overlay it
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" pack/backend/tests/cli_regression/support/g3/hosted_pack.py digest pack > "$RUNNER_TEMP/pack-digest.txt"
          cat "$RUNNER_TEMP/pack-digest.txt"
          grep -q -F "$PACK_DIGEST" "$RUNNER_TEMP/pack-digest.txt"
          tar -C pack --exclude=.git -cf - . | tar -C . -xf -

      - name: Verify the g1e pins and the hosted inputs (first step after the overlay)
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" -B backend/tests/cli_regression/support/g3/hosted_preflight.py "$PWD"

      - name: Product identity against the freeze head (rf4c D7)
        run: |
          git cat-file -e "$FREEZE_H^{commit}"
          git diff --exit-code "$FREEZE_H" -- native src backend/agent_team_backend
          test -z "$(git status --porcelain --ignored -- native src backend/agent_team_backend)"
          test "$(git diff --name-only --no-renames "$FREEZE_H" "$GITHUB_SHA")" = ".github/workflows/eval-acr-g3-hosted.yml"

      - name: Set up Bun (default version, no input)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1

      - name: Install locked dependencies and record the toolchain
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked
          mkdir -p "$RUNNER_TEMP/g3r2h"
          rustc -vV | tee "$RUNNER_TEMP/g3r2h/rustc-vV.txt"

      - name: Quiet gate before the run
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_quiet_gate.py before "$RUNNER_TEMP/g3r2h/quiet-pre"

      - name: Build the sidecars and the reader fixtures
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py build "$PWD" "$RUNNER_TEMP/g3r2h/pre"

      - name: Build the packaged app
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py packaged "$PWD" "$RUNNER_TEMP/g3r2h/pre"

      - name: Smoke
        timeout-minutes: 20
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py smoke "$PWD" "$RUNNER_TEMP/g3r2h/smoke"

      - name: Prove the release sidecar has no fault hooks (the F0 sidecar and its harness)
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}/g3r2h/pre/harness-target/release/navide-cli-runtime
          G2_BASETEMP: ${{ runner.temp }}/g2-basetemp
        run: |
          bash tests/cli/g2-linux-proc-children.sh
          bun tests/cli/g2Native.mjs proof --release "$NAVIDE_CLI_RUNTIME_BIN" --harness "$NAVIDE_CLI_RUNTIME_HARNESS_BIN"

      - name: Rust tests
        run: cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml

      - name: Install the G2 test environment (the interpreter path the Linux receipt pins were taken with)
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/g2-venv
        run: uv --project backend sync --locked

      - name: Required backend cases on the F0 sidecar (G2 required list)
        timeout-minutes: 75
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}/g3r2h/pre/harness-target/release/navide-cli-runtime
          G2_BASETEMP: ${{ runner.temp }}/g2-basetemp
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/g2-venv
        run: bash tests/cli/g2-linux-pytest.sh

      - name: Require every listed case to be collected and passed
        run: bun tests/cli/g2Native.mjs guard --platform linux --arch x64 --required tests/cli/g2-required-linux.txt --skip-allowed test_cli_runtime_recovery.py,test_cli_runtime_lifecycle.py,test_cli_runtime_claude.py --junit test-results/ci/g2-linux-junit.xml --out test-results/ci/g2-linux-outcomes.log

      - name: Require every ready receipt to name the F0 sidecar and its harness
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}/g3r2h/pre/harness-target/release/navide-cli-runtime
          G2_BASETEMP: ${{ runner.temp }}/g2-basetemp
        run: |
          rc=0
          mkdir -p test-results/ci
          bun tests/cli/g2Native.mjs receipts --root "$G2_BASETEMP" --sha "$(sha256sum < "$NAVIDE_CLI_RUNTIME_BIN" | cut -d' ' -f1)" --harness-sha "$(sha256sum < "$NAVIDE_CLI_RUNTIME_HARNESS_BIN" | cut -d' ' -f1)" --required tests/cli/g2-required-linux.txt --expect tests/cli/g2-receipt-expectations-linux.json > test-results/ci/g2-linux-receipts.txt || rc=$?
          cat test-results/ci/g2-linux-receipts.txt
          exit $rc

      - name: Run the production WebSocket cases on the F0 sidecar
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}/g3r2h/pre/harness-target/release/navide-cli-runtime
          G2_BASETEMP: ${{ runner.temp }}/g2-basetemp
        run: bun run vitest run tests/cli/shellRuntime.test.ts tests/cli/runtimeRecovery.test.ts tests/cli/claudeRuntime.test.ts -t 'uses one actual native runtime|sidecar death with sessions and a pending request|native Claude production-client' --reporter=default --reporter=json --outputFile.json=test-results/ci/g2-linux-ts-results.json

      - name: Require both shared WebSocket cases to be collected and pass
        run: jq -e '[.testResults[].assertionResults[] | select(.fullName == "uses one actual native runtime for concurrent shells, ordered Unicode, resize, reconnect and exits" or .fullName == "sidecar death with sessions and a pending request fails visibly, cleans owned trees only and recovers on a fresh runtime")] as $required | ($required | length) == 2 and ($required | all(.status == "passed"))' test-results/ci/g2-linux-ts-results.json

      - name: Require the Claude production-client cases to be collected and pass
        run: jq -e -f tests/cli/g2-linux-principal.jq test-results/ci/g2-linux-ts-results.json

      - name: Correctness, the 21 G1-E rows from the gates registry on the F0 sidecar, gated by case (row table, collected-and-passed gate, sidecar receipt, E1, G1)
        timeout-minutes: 75
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py correctness "$PWD" "$RUNNER_TEMP/g3r2h/pre"

      - name: Bind the G2 required cases (by name) and the receipts to the F0 sidecar (E1)
        env:
          PYTHONPATH: backend
        run: uv --project backend run python -B -m tests.cli_regression.support.g3.hosted_correctness bind "$PWD" "$RUNNER_TEMP/g3r2h/pre" Linux test-results/ci/g2-linux-receipts.txt test-results/ci/g2-linux-outcomes.log test-results/ci/g2-linux-junit.xml tests/cli/g2-required-linux.txt

      - name: Build F0
        run: |
          H="uv --project backend run python -B -m tests.cli_regression.support.g3.hosted_helper"
          $H f0-spec "$PWD" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/f0-spec.json" eval/agent-cli-runtime-linux
          $H f0-build "$PWD" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/f0-spec.json"

      - name: Cost run (calibration, matrix, launch matrix, decision)
        timeout-minutes: 300
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py cost "$PWD" "$RUNNER_TEMP/g3r2h/out" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke"

      - name: Leak check (no token or runner secret in the upload)
        id: leak
        if: always()
        run: |
          mkdir -p test-results/ci
          if grep -r -l -E '(ghs|ghp|gho|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$RUNNER_TEMP/g3r2h" test-results/ci; then echo "credential-like text found"; exit 1; fi

      - name: Upload the evidence
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g3h-evidence-linux
          path: |
            ${{ runner.temp }}/g3r2h
            test-results/ci
          if-no-files-found: warn
          retention-days: 30
