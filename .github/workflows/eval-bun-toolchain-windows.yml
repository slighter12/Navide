          Write-Host "go=$goExe"
          Write-Host "uv=$uvExe"
          Write-Host "git=$gitExe"
          "T08_GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_HEAD_SHA=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_NODE_ROOT=$nodeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PNPM_ROOT=$env:RUNNER_TEMP\pnpmroot\node_modules\pnpm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_UV_BIN=$uvExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GO_BIN=$goExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GIT_BIN=$gitExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GIT_DIR=$gitDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PYTHON_DIR=$pythonDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PYTHON_SCRIPTS_DIR=$pythonScripts" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_BUN_ZIP=$bunZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_BUN141_BIN=$bun141" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create the two isolated cases
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_setup.py"
      - name: Prepare the baseline case, then the candidate case
        shell: pwsh
        run: |
          python "$env:T08_HARNESS\t08_prep.py" base
          python "$env:T08_HARNESS\t08_prep.py" bun

      - name: Measure the full root workflow with cold caches
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_performance.py" root cold

      - name: Aggregate analysis
        shell: pwsh
        if: always()
        run: python "$env:T08_HARNESS\t08_analyze.py"


      - name: Record what the evidence directory holds
        if: always()
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_dump.py"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t08-performance-root-cold
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.T08_BASE }}/setup.json
            ${{ env.T08_BASE }}/performance
            ${{ env.T08_BASE }}/t08-base-node/receipts
            ${{ env.T08_BASE }}/t08-base-node/logs
            ${{ env.T08_BASE }}/t08-base-node/vitest-json
            ${{ env.T08_BASE }}/t08-head-bun/receipts
            ${{ env.T08_BASE }}/t08-head-bun/logs
            ${{ env.T08_BASE }}/t08-head-bun/vitest-json

  performance-root-warm:
    name: Root workflow performance, warm caches (same machine, both runtimes)
    runs-on: windows-2025
    needs: harness
    timeout-minutes: 358

    env:
      T08_BASE: 'C:\t08-eval'
      T08_HARNESS: 'C:\t08-eval\harness'
      T08_DEV_WINDOW: '420'
      T08_PAIRS: '5'

    steps:

      - name: Download the evaluation harness
        uses: actions/download-artifact@v7
        with:
          name: t08-harness
          path: ${{ runner.temp }}/harness-download

      - name: Extract and verify the evaluation harness
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "$env:T08_HARNESS" | Out-Null
          tar -xzf "${{ runner.temp }}\harness-download\harness.tar.gz" -C "$env:T08_HARNESS"
          Get-FileHash -Algorithm SHA256 "${{ runner.temp }}\harness-download\harness.tar.gz" | Format-List
          python "$env:T08_HARNESS\t08_manifest.py" "$env:T08_HARNESS"

      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify the case base this workflow assumes
        shell: pwsh
        run: |
          if ($env:T08_BASE -ne 'C:\t08-eval') { throw "T08_BASE is $env:T08_BASE" }
          New-Item -ItemType Directory -Force -Path $env:T08_BASE | Out-Null
          Write-Host "T08_BASE=$env:T08_BASE RUNNER_TEMP=$env:RUNNER_TEMP"
          Get-Volume | Where-Object DriveLetter | Select-Object DriveLetter,FileSystem,SizeRemaining,Size | Format-Table

      - name: Record runner identity
        shell: pwsh
        run: |
          Write-Host "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion RUNNER_OS=$env:RUNNER_OS RUNNER_ARCH=$env:RUNNER_ARCH"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture,TotalVisibleMemorySize,FreePhysicalMemory | Format-List
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed | Format-List
          Write-Host "TotalPhysicalMemory=$((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory)"
          Write-Host "COMPUTERNAME=$env:COMPUTERNAME"
          python --version
          git --version
          where.exe node
          [Environment]::OSVersion.Version.ToString()

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Set up Go for the packaged Plans fixture
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.23'
          enable-cache: false

      - name: Stage pnpm 10.0.0 (JavaScript entry executed by the pinned Node)
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP\pnpmroot" pnpm@10.0.0 --no-audit --no-fund --ignore-scripts
          node "$env:RUNNER_TEMP\pnpmroot\node_modules\pnpm\bin\pnpm.cjs" --version

      - name: Download and verify the Bun 1.4.2 and 1.4.1 windows-x64 archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = 'https://github.com/oven-sh/bun/releases/download'
          foreach ($v in '1.4.2','1.4.1') {
            $slug = $v.Replace('.','')
            Invoke-WebRequest -Uri "$base/bun-v$v/bun-windows-x64.zip" -OutFile "$env:RUNNER_TEMP\bun$slug.zip"
            Invoke-WebRequest -Uri "$base/bun-v$v/SHASUMS256.txt" -OutFile "$env:RUNNER_TEMP\SHASUMS256-$v.txt"
          }
          foreach ($v in '1.4.2','1.4.1') {
            $slug = $v.Replace('.','')
            $file = "$env:RUNNER_TEMP\bun$slug.zip"
            $line = Get-Content "$env:RUNNER_TEMP\SHASUMS256-$v.txt" | Where-Object { $_ -match ' bun-windows-x64\.zip$' } | Select-Object -First 1
            if (-not $line) { throw "no bun-windows-x64.zip entry in the published SHASUMS256.txt for $v" }
            $expected = (($line -split '\s+')[0]).ToLower()
            $actual = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            Write-Host "bun $v archive sha256=$actual expected(publisher SHASUMS256.txt)=$expected"
            if ($actual -ne $expected) { throw "Bun $v archive hash mismatch" }
          }
          Expand-Archive -Path "$env:RUNNER_TEMP\bun141.zip" -DestinationPath "$env:RUNNER_TEMP\bun141" -Force
          & "$env:RUNNER_TEMP\bun141\bun-windows-x64\bun.exe" --version

      - name: Resolve case tool paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nodeExe = (Get-Command node).Source
          $nodeRoot = Split-Path -Parent $nodeExe
          $uvExe = (Get-Command uv).Source
          $goExe = (Get-Command go).Source
          $gitExe = (Get-Command git).Source
          $gitDir = Split-Path -Parent $gitExe
          $pythonExe = (Get-Command python).Source
          $pythonDir = Split-Path -Parent $pythonExe
          $pythonScripts = Join-Path $pythonDir 'Scripts'
          $bunZip = "$env:RUNNER_TEMP\bun142.zip"
          $bun141 = "$env:RUNNER_TEMP\bun141\bun-windows-x64\bun.exe"
          Write-Host "node=$nodeExe"
          Write-Host "python=$pythonExe"
          Write-Host "go=$goExe"
          Write-Host "uv=$uvExe"
          Write-Host "git=$gitExe"
          "T08_GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_HEAD_SHA=$env:GITHUB_SHA" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_NODE_ROOT=$nodeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PNPM_ROOT=$env:RUNNER_TEMP\pnpmroot\node_modules\pnpm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_UV_BIN=$uvExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GO_BIN=$goExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GIT_BIN=$gitExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GIT_DIR=$gitDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PYTHON_DIR=$pythonDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PYTHON_SCRIPTS_DIR=$pythonScripts" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_BUN_ZIP=$bunZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_BUN141_BIN=$bun141" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create the two isolated cases
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_setup.py"
      - name: Prepare the baseline case, then the candidate case
        shell: pwsh
        run: |
          python "$env:T08_HARNESS\t08_prep.py" base
          python "$env:T08_HARNESS\t08_prep.py" bun

      - name: Measure the full root workflow with warm caches
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_performance.py" root warm

      - name: Measure the identity runs for the root workflow
        shell: pwsh
        if: always()
        run: python "$env:T08_HARNESS\t08_performance.py" root identity

      - name: Aggregate analysis
        shell: pwsh
        if: always()
        run: python "$env:T08_HARNESS\t08_analyze.py"


      - name: Record what the evidence directory holds
        if: always()
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_dump.py"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t08-performance-root-warm
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.T08_BASE }}/setup.json
            ${{ env.T08_BASE }}/performance
            ${{ env.T08_BASE }}/t08-base-node/receipts
            ${{ env.T08_BASE }}/t08-base-node/logs
            ${{ env.T08_BASE }}/t08-base-node/vitest-json
            ${{ env.T08_BASE }}/t08-head-bun/receipts
            ${{ env.T08_BASE }}/t08-head-bun/logs
            ${{ env.T08_BASE }}/t08-head-bun/vitest-json

