      - name: Set up Node.js 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'

      - name: Set up Go for the packaged Plans fixture
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
