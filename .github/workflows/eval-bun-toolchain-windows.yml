# DIAGNOSTIC-ONLY evaluation workflow (ci-refresh-01 decision 01): investigates one Windows Bun failure;
# this is NOT a measurement and runs no full suite and no performance job.
# Evaluation-only workflow for the Bun toolchain evaluation (GitHub issue 2, ticket 08).
# ci-refresh-01 revision: baseline (Node 22.23.2 / pnpm 10.0.0 control) = upstream main 9af042ec plus the seven
# runtime-neutral adaptation files taken from the branch head b6caf8c8; candidate = the attempt commit's tree
# (the branch head plus this workflow) with both evaluation workflow files removed.
#
# Scope and authority:
#   * Trigger: `push` of an `eval-bun-ci-08-*` tag ONLY.  No branch, PR, schedule
#     or dispatch trigger.  Every attempt gets a new tag so no attempt is hidden.
#   * No secrets, no `secrets.*`, no repository writes: `permissions: contents: read`.
#   * No existing project workflow is modified or invoked.  The committed Linux
#     evaluation workflow (`.github/workflows/eval-bun-toolchain.yml`) is removed
#     from the attempt trees so an 08 tag starts only these Windows jobs; the
#     branch copy of that file is untouched.  The project's own Windows CI
#     approach (powershell steps, `windows-latest`, the venv at
#     `backend/.venv/Scripts/python.exe`) is mirrored, never weakened: the
#     evaluation adds no sandbox switch and no Defender change.
#   * Windows execution happens on GitHub-hosted Windows runners through the
#     user's public fork `slighter12/Navide`.
#
# What runs here (ticket 08 criteria, macOS/Linux method):
#   correctness  exact-version acceptance/rejection before any install; frozen
#                installs; aggregate typechecks; real builds; minimal SDK/DOM
#                suites; full root Vitest inventory; supplementary suites
#                (Mini-IDE, dev-backend, packaged Plugin lifecycle, the win32
#                backend-sandbox unit coverage); Windows command resolution,
#                C2 node-alias, C3 path-shape and NTFS readdir probes.
#   consumers    genuine packed artifacts consumed by separate npm and pnpm
#                consumer projects (frozen ticket-05 fixture with the win32
#                platform branches).
#   readiness    the real `dev` workflow on Windows with /health, per-start
#                WebSocket token and plugin-MCP probes.
#   performance  the full root workflow (cold and warm, one machine per
#                condition) and both single-file workloads, five samples per
#                runtime per condition after one excluded warm-up pair.
#
# The harness travels as one base64 gzip tarball whose extracted bytes are
# verified against the embedded MANIFEST.sha256; the same list is printed below.
# `t08_analyze.py` aggregates each job's outputs.

name: Bun toolchain evaluation (Windows, DIAGNOSTIC ONLY)

on:
  push:
    tags:
      - 'eval-bun-ci-08-*'

permissions:
  contents: read

concurrency:
  group: eval-bun-toolchain-windows-${{ github.ref }}
  cancel-in-progress: false

