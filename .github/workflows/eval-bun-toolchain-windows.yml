          "T08_NODE_ROOT=$nodeRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PNPM_ROOT=$env:RUNNER_TEMP\pnpmroot\node_modules\pnpm" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_UV_BIN=$uvExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GO_BIN=$goExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GIT_BIN=$gitExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_GIT_DIR=$gitDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PYTHON_DIR=$pythonDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_PYTHON_SCRIPTS_DIR=$pythonScripts" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_BUN_ZIP=$bunZip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "T08_BUN141_BIN=$bun141" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Create the two isolated cases
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_setup.py"
      - name: Prepare the baseline case, then the candidate case
        shell: pwsh
        run: |
          python "$env:T08_HARNESS\t08_prep.py" base
          python "$env:T08_HARNESS\t08_prep.py" bun

      - name: Measure the full root workflow with cold caches
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_performance.py" root cold

      - name: Aggregate analysis
        shell: pwsh
        if: always()
        run: python "$env:T08_HARNESS\t08_analyze.py"


      - name: Record what the evidence directory holds
        if: always()
        shell: pwsh
        run: python "$env:T08_HARNESS\t08_dump.py"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: t08-performance-root-cold
          if-no-files-found: warn
          retention-days: 30
          path: |
            ${{ env.T08_BASE }}/setup.json
            ${{ env.T08_BASE }}/performance
            ${{ env.T08_BASE }}/t08-base-node/receipts
            ${{ env.T08_BASE }}/t08-base-node/logs
            ${{ env.T08_BASE }}/t08-base-node/vitest-json
            ${{ env.T08_BASE }}/t08-head-bun/receipts
            ${{ env.T08_BASE }}/t08-head-bun/logs
            ${{ env.T08_BASE }}/t08-head-bun/vitest-json

