name: G3 Hosted Rehearsal macOS (not evidence)

# DRAFT (rf4f). Evaluation only. A full end-to-end rehearsal of the hosted G3 run on the real macOS arm64 runner image (macos-15). It is NOT evidence: it writes under $RUNNER_TEMP/g3r2/rehearsal (the only place the stamp
# and the TS runners accept a rehearsal), is stamped NOT-EVIDENCE, and uploads only step outcomes and check verdicts and the runner facts, and the correctness records (G6; the per-row table and the receipt, no measurement data), never measurement data.
# TRIGGER: pushes of the dedicated branch eval/agent-cli-runtime-macos-rehearsal ONLY. The tip of that branch holds this file and NOT the registered workflow; each push is one rehearsal (cap of 6 per platform, D11).
# STAGE H5 FILLS, before this file is committed to the workflows directory of the branch: H5_FILL_PACK_COMMIT, H5_FILL_PACK_DIGEST.
# Two distinct SHAs: the run head is $GITHUB_SHA (the pushed commit, which also holds this file), and FREEZE_H is the head of the rf3 freeze; the identity step is the registered one (D7).
# No G1-E bundle: the cost run takes six path arguments and then --rehearsal.
# The rehearsal runs the SAME correctness steps as the registered workflow (D8, E1, G1), so the exact gate is exercised before a registered push, and passes --rehearsal to build, packaged and smoke (D6): the
# build-step diagnostics no longer depend on this workflow's `name:`.
# The JavaScript runtime is plain default Bun (D2).
# macOS (G4): the harness runs on the exact python-build-standalone build 20250818 of CPython 3.12.11 (sha256 checked before use). Only the Python interpreter is pinned.
# rf4f (H1-H5): the `correctness` step first stages the reader descriptor the runner built and verified (`pre/FIXTURES.json`) over the packed one, so the reader cases run on runner-built fixtures; it runs a real
# `pytest --collect-only` with its own arguments (rootdir-relative `--deselect` ids, every variant of a parametrized case expected), and a required case that did not pass fails its row. On macOS the interpreter
# preflight also checks the pinned build's compile stamp.
# rh9 (rehearsal 2 finding, macOS), three disclosed accommodations of HOW the `Rust tests` step is invoked; no test is skipped, filtered, retried or edited, and the command after `cargo` is otherwise unchanged:
#  1. the step runs `cargo test` in a new session (a perl fork + POSIX::setsid + exec wrapper that passes the exit status through). Rehearsal 2's step ran in the runner's own session and group; three frozen tests
#     walk the group or the session of the test process and the product fails closed on a member it cannot read (EPERM), so the run saw a member of another user. The wrapper makes the test's group and session hold only its own descendants.
#  2. `-- --test-threads=1` (macOS only): the runner has 3 vCPUs and the default is 3 test threads; a 2 ms sleep took at least 20 ms in `scan_board`'s timing test. It is not a filter.
#  3. an information-only step before it records the members of the group and of the session it runs in (pid, ppid, pgid, sess, uid, comm; no arguments, no environment), so whether a process of another user was there is observed.
# rh12 (rehearsal 3 finding, macOS): the three EPERM tests passed under the new session; one other frozen timing test (`scan_board`, `n_sessions_with_an_expensive_read...`) failed on a stall of unobserved cause. Two more
# disclosed changes, neither of which touches a test: the `Rust tests` command is byte-identical to rh9's.
#  4. (A) a step before it compiles the test binaries with the same locked manifest (`cargo test ... --no-run`, nothing runs), then a settling pass reuses the load sampler that runs before the quiet gate, ending early
#     once the quiet gate's own rule is met twice in a row (information only, `continue-on-error`, bounded at 15 minutes, its own JSON file), so the tests start on a machine the gate's rule calls quiet, not straight after a build.
#  5. (B) an information-only record of the load, the busiest command names and the timer latency (requested against actual sleeps of 2 ms and 20 ms) is taken right before the step and right after it, also when it fails.
# If a frozen product timing test fails again after (A), the manager stops the macOS rehearsals and reports to the user, without further accommodation and without spending the cap (D11: stop and report); whether macOS
# is then reported as "Not measured" is the user's decision.
# rh13 (rehearsal 3 review), two more disclosed changes, neither of which touches a test or a gate rule:
#  6. (B2) the load and timer record of item 5 is now the last step before `Rust tests`, after the process-layout record, so it describes the state the tests start in.
#  7. (S3) in the cost run's own plan, on macOS only, the settle sampler that runs before the quiet gate (information only, ends early on the gate's own rule, at most 20 minutes so that the job stays inside its 330 minutes, an exit status that never ends the plan)
#     runs before each of the three in-plan quiet gates `quiet-1`, `quiet-2` and `quiet-3`. Each gate is unchanged and still decides; the plan steps are `settle-1`, `settle-2` and `settle-3` (the addendum, section 10, says the same).
# rh14 (rehearsal 3 re-review), one name only:
#  8. the process-layout record of item 3 is named for what it records, "the session the Rust tests run in": since rh13 (item 6) the step after it is the timer record, not the tests. Its command and place are unchanged.

on:
  push:
    branches:
      - eval/agent-cli-runtime-macos-rehearsal

permissions:
  contents: read

env:
  FREEZE_H: 202084cf74eccb07bec366897ebf4c588799e72e
  PACK_COMMIT: "6d16cfd8b23a19014218763795c34b12212f421c"
  PACK_DIGEST: "474f316dd7e3b935b13c0e43eccb9e1dedb58a14dcee4847cab1be91941bc43a"

jobs:
  rehearsal:
    name: rehearsal-${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
            system: Darwin
    defaults:
      run:
        shell: bash
    env:
      G3H_OS: ${{ matrix.system }}
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Pin line endings before any checkout
        run: git config --global core.autocrlf false

      - name: Check out evaluation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the harness pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PACK_COMMIT }}
          path: pack
          persist-credentials: false

      - name: Check the run head and the checked-out bytes
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git config --get core.autocrlf)" = "false"
          test -z "$(git status --porcelain -- . ':(exclude)pack')"

      - name: Verify the pack digest, then overlay it
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" pack/backend/tests/cli_regression/support/g3/hosted_pack.py digest pack > "$RUNNER_TEMP/pack-digest.txt"
          cat "$RUNNER_TEMP/pack-digest.txt"
          grep -q -F "$PACK_DIGEST" "$RUNNER_TEMP/pack-digest.txt"
          tar -C pack --exclude=.git -cf - . | tar -C . -xf -

      - name: Verify the g1e pins and the hosted inputs (first step after the overlay)
        id: pins
        run: |
          if [ "$G3H_OS" = "Windows" ]; then PYBIN=python; else PYBIN=python3; fi
          "$PYBIN" -B backend/tests/cli_regression/support/g3/hosted_preflight.py "$PWD"

      - name: Product identity against the freeze head (rf4c D7)
        id: identity
        run: |
          git cat-file -e "$FREEZE_H^{commit}"
          git diff --exit-code "$FREEZE_H" -- native src backend/agent_team_backend
          test -z "$(git status --porcelain --ignored -- native src backend/agent_team_backend)"
          test "$(git diff --name-only --no-renames "$FREEZE_H" "$GITHUB_SHA")" = ".github/workflows/eval-acr-g3-hosted-macos-rehearsal.yml"

      - name: Set up Bun (default version, no input)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install the pinned CPython 3.12.11 build (python-build-standalone 20250818, sha256 checked before use, G4)
        id: pbs
        timeout-minutes: 15
        run: |
          mkdir -p "$RUNNER_TEMP/pbs"
          curl -fsSL -o "$RUNNER_TEMP/pbs/python.tar.gz" "https://github.com/astral-sh/python-build-standalone/releases/download/20250818/cpython-3.12.11%2B20250818-aarch64-apple-darwin-install_only_stripped.tar.gz"
          got="$(shasum -a 256 < "$RUNNER_TEMP/pbs/python.tar.gz" | cut -d' ' -f1)"
          echo "python-build-standalone 20250818 archive sha256 $got"
          test "$got" = "bbf0c85d09a8173e50d18a0198f14d1de91eab17a593ccf9445f214fb0555547"
          tar -xzf "$RUNNER_TEMP/pbs/python.tar.gz" -C "$RUNNER_TEMP/pbs"
          "$RUNNER_TEMP/pbs/python/bin/python3.12" -VV

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.1

      - name: Install locked dependencies and record the toolchain
        run: |
          bun install --frozen-lockfile
          uv --project backend sync --locked --python "$RUNNER_TEMP/pbs/python/bin/python3.12" --no-python-downloads
          mkdir -p "$RUNNER_TEMP/g3r2h" "$RUNNER_TEMP/g3r2/rehearsal" "$RUNNER_TEMP/g3r2h-summary"
          rustc -vV | tee "$RUNNER_TEMP/g3r2h/rustc-vV.txt"

      - name: Check the harness interpreter, the pinned CPython 3.12.11 build with the registered SQLite 3.49.1 (E4, G4)
        id: sqlite
        run: backend/.venv/bin/python -B backend/tests/cli_regression/support/g3/hosted_preflight.py sqlite "$RUNNER_TEMP/pbs/python"

      - name: Record the runner (information only; it decides nothing)
        run: |
          {
            echo "uname -m: $(uname -m)"
            sw_vers
            echo "hw.ncpu: $(sysctl -n hw.ncpu)"
            echo "hw.memsize: $(sysctl -n hw.memsize)"
            echo "hw.model: $(sysctl -n hw.model)"
            echo "cpu brand: $(sysctl -n machdep.cpu.brand_string)"
            echo "loadavg: $(sysctl -n vm.loadavg)"
          } | tee "$RUNNER_TEMP/g3r2h-summary/runner-facts.txt"

      - name: Sample the load before the quiet gate (rehearsal 1 RC-3, information only; it decides nothing and cannot fail the job)
        id: loadprobe
        continue-on-error: true
        timeout-minutes: 31
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_load_probe.py "$RUNNER_TEMP/g3r2h-summary/load-probe.json"

      - name: Quiet gate before the run
        id: quiet
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_quiet_gate.py before "$RUNNER_TEMP/g3r2/rehearsal/quiet-pre"

      - name: Build the sidecars and the reader fixtures
        id: build
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py build "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Build the packaged app
        id: packaged
        timeout-minutes: 45
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py packaged "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Smoke
        id: smoke
        timeout-minutes: 20
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py smoke "$PWD" "$RUNNER_TEMP/g3r2h/smoke" --rehearsal

      - name: Prove the release sidecar has no fault hooks (the F0 sidecar and its harness)
        id: proof
        env:
          NAVIDE_CLI_RUNTIME_BIN: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_T05_SIDECAR: ${{ github.workspace }}/native/navide-cli-runtime/target/release/navide-cli-runtime
          NAVIDE_CLI_RUNTIME_HARNESS_BIN: ${{ runner.temp }}/g3r2h/pre/harness-target/release/navide-cli-runtime
          G2_BASETEMP: ${{ runner.temp }}/g2-basetemp
        run: |
          file "$NAVIDE_CLI_RUNTIME_BIN" | grep -q 'Mach-O 64-bit executable arm64'
          bun tests/cli/g2Native.mjs proof --release "$NAVIDE_CLI_RUNTIME_BIN" --harness "$NAVIDE_CLI_RUNTIME_HARNESS_BIN"

      - name: Compile the Rust tests without running them (rh12, M-1 A)
        id: cargobuild
        run: cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --no-run

      - name: Settle the machine before the Rust tests (rh12, M-1 A, information only; it decides nothing and cannot fail the job)
        id: rustsettle
        continue-on-error: true
        timeout-minutes: 16
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_load_probe.py "$RUNNER_TEMP/g3r2h-summary/load-probe-rust.json" --max-seconds 900

      - name: Record the process group and the session the Rust tests run in (rh9, information only; it decides nothing and cannot fail the job)
        id: layout
        continue-on-error: true
        timeout-minutes: 5
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_process_layout.py "$RUNNER_TEMP/g3r2h-summary/process-layout.json"

      - name: Record the load and the timer latency before the Rust tests (rh12, M-1 B; rh13 B2, the last step before them, after the layout probe; information only, it decides nothing and cannot fail the job)
        id: timerbefore
        continue-on-error: true
        timeout-minutes: 5
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_timer_probe.py before "$RUNNER_TEMP/g3r2h-summary/rust-context-before.json"

      - name: Rust tests
        id: cargo
        run: |
          perl -MPOSIX -e 'defined(my $pid = fork) or die "fork: $!\n"; if (!$pid) { POSIX::setsid() != -1 or die "setsid: $!\n"; exec @ARGV or die "exec: $!\n" } waitpid($pid, 0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' -- cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml -- --test-threads=1

      - name: Record the load and the timer latency after the Rust tests (rh12, M-1 B, information only; it decides nothing and cannot fail the job)
        id: timerafter
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_timer_probe.py after "$RUNNER_TEMP/g3r2h-summary/rust-context-after.json"

      - name: Correctness, the 21 G1-E rows from the gates registry on the F0 sidecar, gated by case, plus the frozen macOS G2 part (row table, collected-and-passed gate, sidecar receipt, E1, G1)
        id: correctness
        timeout-minutes: 120
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py correctness "$PWD" "$RUNNER_TEMP/g3r2h/pre" --rehearsal

      - name: Build F0
        id: f0
        run: |
          H="uv --project backend run python -B -m tests.cli_regression.support.g3.hosted_helper"
          $H f0-spec "$PWD" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/f0-spec.json" eval/agent-cli-runtime-macos-rehearsal
          $H f0-build "$PWD" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/f0-spec.json"

      - name: Rehearsal cost run (NOT evidence)
        id: cost
        timeout-minutes: 300
        run: uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py cost "$PWD" "$RUNNER_TEMP/g3r2/rehearsal" "$RUNNER_TEMP/g3r2h/F0.json" "$RUNNER_TEMP/g3r2h/pre/sidecar-build.json" "$RUNNER_TEMP/g3r2h/pre" "$RUNNER_TEMP/g3r2h/smoke" --rehearsal

      - name: Per-check verdicts of the receipt and byte-ledger validation (names and verdicts only)
        id: checks
        if: always()
        env:
          PYTHONPATH: backend
        run: |
          mkdir -p "$RUNNER_TEMP/g3r2h-summary"
          backend/.venv/bin/python backend/tests/cli_regression/support/g3/hosted_checks.py "$RUNNER_TEMP/g3r2/rehearsal/rehearsal-verdict.json" "$RUNNER_TEMP/g3r2h-summary/rehearsal-checks.json" "$G3H_OS" "$RUNNER_TEMP/g3r2h/markers"

      - name: Stage the correctness records for the upload (G6)
        id: stage
        if: always()
        run: |
          stage="$RUNNER_TEMP/g3r2h-summary/evidence"
          mkdir -p "$stage"
          pre="$RUNNER_TEMP/g3r2h/pre"
          for f in "$pre/correctness-gate.json" "$pre/correctness-receipt.json"; do
            if [ -f "$f" ]; then cp "$f" "$stage/" && echo "staged $(basename "$f")" >> "$stage/staged.txt"; else echo "missing $f" >> "$stage/staged.txt"; fi
          done
          uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_diag.py stage-smoke "$RUNNER_TEMP/g3r2h/smoke" "$stage" >> "$stage/staged.txt" || echo "stage-smoke failed" >> "$stage/staged.txt"
          cat "$stage/staged.txt"

      - name: Write the outcomes summary (step outcomes only)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          O_PINS: ${{ steps.pins.outcome }}
          C_PINS: ${{ steps.pins.conclusion }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          C_IDENTITY: ${{ steps.identity.conclusion }}
          O_PBS: ${{ steps.pbs.outcome }}
          C_PBS: ${{ steps.pbs.conclusion }}
          O_SQLITE: ${{ steps.sqlite.outcome }}
          C_SQLITE: ${{ steps.sqlite.conclusion }}
          O_LOADPROBE: ${{ steps.loadprobe.outcome }}
          C_LOADPROBE: ${{ steps.loadprobe.conclusion }}
          O_QUIET: ${{ steps.quiet.outcome }}
          C_QUIET: ${{ steps.quiet.conclusion }}
          O_BUILD: ${{ steps.build.outcome }}
          C_BUILD: ${{ steps.build.conclusion }}
          O_PACKAGED: ${{ steps.packaged.outcome }}
          C_PACKAGED: ${{ steps.packaged.conclusion }}
          O_SMOKE: ${{ steps.smoke.outcome }}
          C_SMOKE: ${{ steps.smoke.conclusion }}
          O_PROOF: ${{ steps.proof.outcome }}
          C_PROOF: ${{ steps.proof.conclusion }}
          O_CARGOBUILD: ${{ steps.cargobuild.outcome }}
          C_CARGOBUILD: ${{ steps.cargobuild.conclusion }}
          O_RUSTSETTLE: ${{ steps.rustsettle.outcome }}
          C_RUSTSETTLE: ${{ steps.rustsettle.conclusion }}
          O_TIMERBEFORE: ${{ steps.timerbefore.outcome }}
          C_TIMERBEFORE: ${{ steps.timerbefore.conclusion }}
          O_LAYOUT: ${{ steps.layout.outcome }}
          C_LAYOUT: ${{ steps.layout.conclusion }}
          O_CARGO: ${{ steps.cargo.outcome }}
          C_CARGO: ${{ steps.cargo.conclusion }}
          O_TIMERAFTER: ${{ steps.timerafter.outcome }}
          C_TIMERAFTER: ${{ steps.timerafter.conclusion }}
          O_CORRECTNESS: ${{ steps.correctness.outcome }}
          C_CORRECTNESS: ${{ steps.correctness.conclusion }}
          O_F0: ${{ steps.f0.outcome }}
          C_F0: ${{ steps.f0.conclusion }}
          O_COST: ${{ steps.cost.outcome }}
          C_COST: ${{ steps.cost.conclusion }}
          O_CHECKS: ${{ steps.checks.outcome }}
          C_CHECKS: ${{ steps.checks.conclusion }}
          O_STAGE: ${{ steps.stage.outcome }}
          C_STAGE: ${{ steps.stage.conclusion }}
        run: |
          mkdir -p "$RUNNER_TEMP/g3r2h-summary"
          {
            printf 'NOT-EVIDENCE\njob=%s\n' "$JOB_STATUS"
            printf 'step=pins outcome=%s conclusion=%s\n' "$O_PINS" "$C_PINS"
            printf 'step=identity outcome=%s conclusion=%s\n' "$O_IDENTITY" "$C_IDENTITY"
            printf 'step=pbs outcome=%s conclusion=%s\n' "$O_PBS" "$C_PBS"
            printf 'step=sqlite outcome=%s conclusion=%s\n' "$O_SQLITE" "$C_SQLITE"
            printf 'step=loadprobe outcome=%s conclusion=%s\n' "$O_LOADPROBE" "$C_LOADPROBE"
            printf 'step=quiet outcome=%s conclusion=%s\n' "$O_QUIET" "$C_QUIET"
            printf 'step=build outcome=%s conclusion=%s\n' "$O_BUILD" "$C_BUILD"
            printf 'step=packaged outcome=%s conclusion=%s\n' "$O_PACKAGED" "$C_PACKAGED"
            printf 'step=smoke outcome=%s conclusion=%s\n' "$O_SMOKE" "$C_SMOKE"
            printf 'step=proof outcome=%s conclusion=%s\n' "$O_PROOF" "$C_PROOF"
            printf 'step=cargobuild outcome=%s conclusion=%s\n' "$O_CARGOBUILD" "$C_CARGOBUILD"
            printf 'step=rustsettle outcome=%s conclusion=%s\n' "$O_RUSTSETTLE" "$C_RUSTSETTLE"
            printf 'step=timerbefore outcome=%s conclusion=%s\n' "$O_TIMERBEFORE" "$C_TIMERBEFORE"
            printf 'step=layout outcome=%s conclusion=%s\n' "$O_LAYOUT" "$C_LAYOUT"
            printf 'step=cargo outcome=%s conclusion=%s\n' "$O_CARGO" "$C_CARGO"
            printf 'step=timerafter outcome=%s conclusion=%s\n' "$O_TIMERAFTER" "$C_TIMERAFTER"
            printf 'step=correctness outcome=%s conclusion=%s\n' "$O_CORRECTNESS" "$C_CORRECTNESS"
            printf 'step=f0 outcome=%s conclusion=%s\n' "$O_F0" "$C_F0"
            printf 'step=cost outcome=%s conclusion=%s\n' "$O_COST" "$C_COST"
            printf 'step=checks outcome=%s conclusion=%s\n' "$O_CHECKS" "$C_CHECKS"
            printf 'step=stage outcome=%s conclusion=%s\n' "$O_STAGE" "$C_STAGE"
          } > "$RUNNER_TEMP/g3r2h-summary/rehearsal-summary.txt"

      - name: Leak check (no token or runner secret in the upload)
        id: leak
        if: always()
        run: if grep -r -l -E '(ghs|ghp|gho|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$RUNNER_TEMP/g3r2h-summary"; then echo "credential-like text found"; exit 1; fi

      - name: Upload the outcomes (exit codes, check verdicts and runner facts, the correctness records only)
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g3h-rehearsal-${{ matrix.os }}
          path: ${{ runner.temp }}/g3r2h-summary
          if-no-files-found: warn
          retention-days: 7
