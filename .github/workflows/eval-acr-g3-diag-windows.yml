      - name: diag1 variant (iii)+(iv) the product peer's output modes and the default code page (the product peer's own console state) (NOT evidence)
        id: probe_iii_iv
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.tools.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 20
        run: |
          shim="$PWD/backend/tests/cli_regression/support/g3/hosted_ps_shim/target/release"
          export PATH="$shim:$PATH"
          case "$(command -v ps)" in "$shim"/ps|"$shim"/ps.exe) ;; *) echo "ps does not resolve to the G3 shim: $(command -v ps)"; exit 1 ;; esac
          listing="$(ps -A -o pid=)"
          if [ -z "$listing" ] || printf '%s\n' "$listing" | grep -v -E '^ *[0-9]+$' > /dev/null; then echo "ps -A -o pid= is not shim-shaped"; exit 1; fi
          shaped=""
          for pid in $(printf '%s\n' "$listing" | tr -d ' ' | head -n 20); do
            if ps -o lstart= -p "$pid" | grep -q -E '^[A-Z][a-z]{2} [A-Z][a-z]{2} [ 0-9][0-9] [0-9]{2}:[0-9]{2}:[0-9]{2} [0-9]{4}$'; then shaped=1; break; fi
          done
          test -n "$shaped"
          mkdir -p "$RUNNER_TEMP/diag1/out/variant-iii-iv"
          uv --project backend run python -B "$RUNNER_TEMP/diag1/tools/diag1_patch_termios.py" product-output-default-cp variant-iii-iv pack/backend/tests/cli_regression/support/g3/hosted_termios.py backend/tests/cli_regression/support/g3/hosted_termios.py "$RUNNER_TEMP/diag1/out/variant-iii-iv/termios-patch.json"
          uv --project backend run python backend/tests/cli_regression/support/g3/hosted_run_driver.py conpty-probe "$PWD" "$RUNNER_TEMP/diag1/out/variant-iii-iv/probe" --rehearsal

      - name: diag1, put the pack's own termios shim back (always runs; nothing later reads it, the runner is discarded)
        id: unpatch
        if: always()
        continue-on-error: true
        run: |
          cp pack/backend/tests/cli_regression/support/g3/hosted_termios.py backend/tests/cli_regression/support/g3/hosted_termios.py || echo "the shim could not be put back"

      - name: diag1, stage the records and write the step outcomes (always runs; it decides nothing and cannot fail the job)
        id: stage
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          O_PINS: ${{ steps.pins.outcome }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_SHIM: ${{ steps.shim.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_TOOLS: ${{ steps.tools.outcome }}
          O_PROBE_I: ${{ steps.probe_i.outcome }}
          O_PROBE_II: ${{ steps.probe_ii.outcome }}
          O_PROBE_III: ${{ steps.probe_iii.outcome }}
          O_PROBE_III_II: ${{ steps.probe_iii_ii.outcome }}
          O_PROBE_IV: ${{ steps.probe_iv.outcome }}
          O_PROBE_III_IV: ${{ steps.probe_iii_iv.outcome }}
          O_UNPATCH: ${{ steps.unpatch.outcome }}
        run: |
          out="$RUNNER_TEMP/diag1/out"
          mkdir -p "$out"
          mkdir -p "$out/console" "$out/markers"
          if [ -d "backend/tests/cli_regression/support/g3/diag1-console" ]; then cp -r "backend/tests/cli_regression/support/g3/diag1-console/." "$out/console/" || echo "the console records could not be copied"; fi
          if [ -d "$RUNNER_TEMP/g3r2h/markers" ]; then cp -r "$RUNNER_TEMP/g3r2h/markers/." "$out/markers/" || echo "the markers could not be copied"; fi
          for f in "$RUNNER_TEMP/g3r2h/rustc-vV.txt" "$RUNNER_TEMP/g3r2h/pre/run-pre.json"; do if [ -f "$f" ]; then cp "$f" "$out/" || true; fi; done
          {
            printf 'NOT-EVIDENCE diag1\njob=%s\n' "$JOB_STATUS"
            printf 'step=%s outcome=%s\n' pins "$O_PINS"
            printf 'step=%s outcome=%s\n' identity "$O_IDENTITY"
            printf 'step=%s outcome=%s\n' install "$O_INSTALL"
            printf 'step=%s outcome=%s\n' shim "$O_SHIM"
            printf 'step=%s outcome=%s\n' build "$O_BUILD"
            printf 'step=%s outcome=%s\n' tools "$O_TOOLS"
            printf 'step=%s outcome=%s\n' probe_i "$O_PROBE_I"
            printf 'step=%s outcome=%s\n' probe_ii "$O_PROBE_II"
            printf 'step=%s outcome=%s\n' probe_iii "$O_PROBE_III"
            printf 'step=%s outcome=%s\n' probe_iii_ii "$O_PROBE_III_II"
            printf 'step=%s outcome=%s\n' probe_iv "$O_PROBE_IV"
            printf 'step=%s outcome=%s\n' probe_iii_iv "$O_PROBE_III_IV"
            printf 'step=%s outcome=%s\n' unpatch "$O_UNPATCH"
          } > "$out/diag-summary.txt" || echo "the summary could not be written"
          cat "$out/diag-summary.txt" || true
          find "$out" -type f | sort > "$RUNNER_TEMP/diag1/files.txt" || true
          cp "$RUNNER_TEMP/diag1/files.txt" "$out/files.txt" || true

      - name: Leak check (no token or runner secret in the upload)
        id: leak
        if: always()
        run: if grep -r -l -E '(ghs|ghp|gho|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$RUNNER_TEMP/diag1/out"; then echo "credential-like text found"; exit 1; fi

      - name: Upload everything the diagnostic recorded (always runs, after the leak check)
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g3h-diag1-windows
          path: ${{ runner.temp }}/diag1/out
          if-no-files-found: warn
          retention-days: 7

      - name: diag1, fail the job only when a prefix step failed (last step, after the upload; a probe or test outcome never fails the job)
        id: verdict
        if: always()
        env:
          O_SHIM: ${{ steps.shim.outcome }}
          O_BUILD: ${{ steps.build.outcome }}
          O_TOOLS: ${{ steps.tools.outcome }}
        run: |
          failed=0
          for pair in "shim=$O_SHIM" "build=$O_BUILD" "tools=$O_TOOLS"; do
            case "${pair#*=}" in success) ;; *) echo "the prefix step ${pair%%=*} did not succeed (${pair#*=}): the diagnostic steps that need it did not run"; failed=1 ;; esac
          done
          exit "$failed"
