          mkdir -p "$RUNNER_TEMP/diag1/out"
          rc=0
          cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml scan_board > "$RUNNER_TEMP/diag1/out/scan-board-off-bare.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/diag1/out/scan-board-off-bare.txt"
          echo "exit=$rc" | tee "$RUNNER_TEMP/diag1/out/scan-board-off-bare.exit"
          exit "$rc"

      - name: diag1, timer latency at 2 ms, 20 ms, 0.5 s and 1.2 s, after the switch, under taskpolicy -l 0 -t 0 (information only; it cannot fail the job)
        id: timer_off_taskpolicy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          taskpolicy -l 0 -t 0 uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_timer_probe.py after "$RUNNER_TEMP/diag1/out/timer-4-coalescing-off-taskpolicy.json"

      - name: diag1, the scan_board tests, once after the switch under taskpolicy -l 0 -t 0 (the rehearsal's Rust command with the scan_board filter) (information only; it cannot fail the job)
        id: scan_off_taskpolicy
        if: ${{ !cancelled() && steps.cargobuild.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/diag1/out"
          rc=0
          perl -MPOSIX -e 'defined(my $pid = fork) or die "fork: $!\n"; if (!$pid) { POSIX::setsid() != -1 or die "setsid: $!\n"; exec @ARGV or die "exec: $!\n" } waitpid($pid, 0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' -- taskpolicy -l 0 -t 0 cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --no-fail-fast scan_board -- --test-threads=1 > "$RUNNER_TEMP/diag1/out/scan-board-off-taskpolicy.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/diag1/out/scan-board-off-taskpolicy.txt"
          echo "exit=$rc" | tee "$RUNNER_TEMP/diag1/out/scan-board-off-taskpolicy.exit"
          exit "$rc"

      - name: diag1, put timer coalescing back, guarded, the outcome is recorded, always runs (information only; it cannot fail the job)
        id: coalesce_restore
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          name="$(sed -n 's/^name: //p' "$RUNNER_TEMP/diag1/out/coalescing-switch.txt" 2>/dev/null || true)"
          original="$(sed -n 's/^before: //p' "$RUNNER_TEMP/diag1/out/coalescing-switch.txt" 2>/dev/null || true)"
          {
            echo "name: ${name:-none}"
            echo "recorded original: $original"
            status="not attempted"
            case "$name=$original" in
              kern.timer.coalescing_enabled=[01]|kern.timer_coalescing_enabled=[01]) status=0; sudo -n sysctl -w "$name=$original" 2>&1 || status=$? ;;
              *) echo "no setting with an original value of 0 or 1 was recorded: nothing is written" ;;
            esac
            echo "sysctl -w exit status: $status"
            case "$name" in ""|none) ;; *) echo "restored: $(sysctl -n "$name" 2>&1)" ;; esac
          } | tee "$RUNNER_TEMP/diag1/out/coalescing-restore.txt"

      - name: diag1, record the runner and the kern.timer sysctls after the restore (information only; it cannot fail the job)
        id: sysctl_restored
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/diag1/out"
          {
            echo "uname -m: $(uname -m)"
            sw_vers
            echo "hw.ncpu: $(sysctl -n hw.ncpu)"
            echo "hw.model: $(sysctl -n hw.model)"
            echo "loadavg: $(sysctl -n vm.loadavg)"
            echo "kern.timer.coalescing_enabled: $(sysctl -n kern.timer.coalescing_enabled 2>&1)"
            echo "kern.timer_coalescing_enabled: $(sysctl -n kern.timer_coalescing_enabled 2>&1)"
            sysctl -a 2>/dev/null | grep -E '^kern\.timer' | sort || true
          } | tee "$RUNNER_TEMP/diag1/out/sysctl-3-after-the-restore.txt"

      - name: diag1, timer latency at 2 ms, 20 ms, 0.5 s and 1.2 s, after the restore (a second sample of the first state) (information only; it cannot fail the job)
        id: timer_restored
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          uv --project backend run python -B backend/tests/cli_regression/support/g3/hosted_timer_probe.py after "$RUNNER_TEMP/diag1/out/timer-5-restored.json"

      - name: diag1, the scan_board tests, run 1 of 2 after the restore (a second sample of the first state) (information only; it cannot fail the job)
        id: scan_restored_1
        if: ${{ !cancelled() && steps.cargobuild.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/diag1/out"
          rc=0
          perl -MPOSIX -e 'defined(my $pid = fork) or die "fork: $!\n"; if (!$pid) { POSIX::setsid() != -1 or die "setsid: $!\n"; exec @ARGV or die "exec: $!\n" } waitpid($pid, 0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' -- cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --no-fail-fast scan_board -- --test-threads=1 > "$RUNNER_TEMP/diag1/out/scan-board-restored-1.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/diag1/out/scan-board-restored-1.txt"
          echo "exit=$rc" | tee "$RUNNER_TEMP/diag1/out/scan-board-restored-1.exit"
          exit "$rc"

      - name: diag1, the scan_board tests, run 2 of 2 after the restore (a second sample of the first state) (information only; it cannot fail the job)
        id: scan_restored_2
        if: ${{ !cancelled() && steps.cargobuild.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/diag1/out"
          rc=0
          perl -MPOSIX -e 'defined(my $pid = fork) or die "fork: $!\n"; if (!$pid) { POSIX::setsid() != -1 or die "setsid: $!\n"; exec @ARGV or die "exec: $!\n" } waitpid($pid, 0); exit($? & 127 ? 128 + ($? & 127) : $? >> 8)' -- cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml --no-fail-fast scan_board -- --test-threads=1 > "$RUNNER_TEMP/diag1/out/scan-board-restored-2.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/diag1/out/scan-board-restored-2.txt"
          echo "exit=$rc" | tee "$RUNNER_TEMP/diag1/out/scan-board-restored-2.exit"
          exit "$rc"

      - name: diag1, stage the records and write the step outcomes (always runs; it decides nothing and cannot fail the job)
        id: stage
        if: always()
        continue-on-error: true
        env:
          JOB_STATUS: ${{ job.status }}
          O_PINS: ${{ steps.pins.outcome }}
          O_IDENTITY: ${{ steps.identity.outcome }}
          O_PBS: ${{ steps.pbs.outcome }}
          O_INSTALL: ${{ steps.install.outcome }}
          O_CARGOBUILD: ${{ steps.cargobuild.outcome }}
          O_RUSTSETTLE: ${{ steps.rustsettle.outcome }}
          O_SYSCTL_ON: ${{ steps.sysctl_on.outcome }}
          O_TIMER_ON: ${{ steps.timer_on.outcome }}
          O_TIMER_ON_TASKPOLICY: ${{ steps.timer_on_taskpolicy.outcome }}
          O_SCAN_ON_1: ${{ steps.scan_on_1.outcome }}
          O_SCAN_ON_2: ${{ steps.scan_on_2.outcome }}
          O_SCAN_ON_3: ${{ steps.scan_on_3.outcome }}
          O_SCAN_ON_4: ${{ steps.scan_on_4.outcome }}
          O_SCAN_ON_5: ${{ steps.scan_on_5.outcome }}
          O_SCAN_ON_BARE: ${{ steps.scan_on_bare.outcome }}
          O_COALESCE_OFF: ${{ steps.coalesce_off.outcome }}
          O_SYSCTL_OFF: ${{ steps.sysctl_off.outcome }}
          O_TIMER_OFF: ${{ steps.timer_off.outcome }}
          O_SCAN_OFF_1: ${{ steps.scan_off_1.outcome }}
          O_SCAN_OFF_2: ${{ steps.scan_off_2.outcome }}
          O_SCAN_OFF_3: ${{ steps.scan_off_3.outcome }}
          O_SCAN_OFF_4: ${{ steps.scan_off_4.outcome }}
          O_SCAN_OFF_5: ${{ steps.scan_off_5.outcome }}
          O_SCAN_OFF_BARE: ${{ steps.scan_off_bare.outcome }}
          O_TIMER_OFF_TASKPOLICY: ${{ steps.timer_off_taskpolicy.outcome }}
          O_SCAN_OFF_TASKPOLICY: ${{ steps.scan_off_taskpolicy.outcome }}
          O_COALESCE_RESTORE: ${{ steps.coalesce_restore.outcome }}
          O_SYSCTL_RESTORED: ${{ steps.sysctl_restored.outcome }}
          O_TIMER_RESTORED: ${{ steps.timer_restored.outcome }}
          O_SCAN_RESTORED_1: ${{ steps.scan_restored_1.outcome }}
          O_SCAN_RESTORED_2: ${{ steps.scan_restored_2.outcome }}
        run: |
          out="$RUNNER_TEMP/diag1/out"
          mkdir -p "$out"
          for f in "$RUNNER_TEMP/g3r2h-summary/load-probe-rust.json" "$RUNNER_TEMP/g3r2h/rustc-vV.txt"; do if [ -f "$f" ]; then cp "$f" "$out/" || true; fi; done
          {
            printf 'NOT-EVIDENCE diag1\njob=%s\n' "$JOB_STATUS"
            printf 'step=%s outcome=%s\n' pins "$O_PINS"
            printf 'step=%s outcome=%s\n' identity "$O_IDENTITY"
            printf 'step=%s outcome=%s\n' pbs "$O_PBS"
            printf 'step=%s outcome=%s\n' install "$O_INSTALL"
            printf 'step=%s outcome=%s\n' cargobuild "$O_CARGOBUILD"
            printf 'step=%s outcome=%s\n' rustsettle "$O_RUSTSETTLE"
            printf 'step=%s outcome=%s\n' sysctl_on "$O_SYSCTL_ON"
            printf 'step=%s outcome=%s\n' timer_on "$O_TIMER_ON"
            printf 'step=%s outcome=%s\n' timer_on_taskpolicy "$O_TIMER_ON_TASKPOLICY"
            printf 'step=%s outcome=%s\n' scan_on_1 "$O_SCAN_ON_1"
            printf 'step=%s outcome=%s\n' scan_on_2 "$O_SCAN_ON_2"
            printf 'step=%s outcome=%s\n' scan_on_3 "$O_SCAN_ON_3"
            printf 'step=%s outcome=%s\n' scan_on_4 "$O_SCAN_ON_4"
            printf 'step=%s outcome=%s\n' scan_on_5 "$O_SCAN_ON_5"
            printf 'step=%s outcome=%s\n' scan_on_bare "$O_SCAN_ON_BARE"
            printf 'step=%s outcome=%s\n' coalesce_off "$O_COALESCE_OFF"
            printf 'step=%s outcome=%s\n' sysctl_off "$O_SYSCTL_OFF"
            printf 'step=%s outcome=%s\n' timer_off "$O_TIMER_OFF"
            printf 'step=%s outcome=%s\n' scan_off_1 "$O_SCAN_OFF_1"
            printf 'step=%s outcome=%s\n' scan_off_2 "$O_SCAN_OFF_2"
            printf 'step=%s outcome=%s\n' scan_off_3 "$O_SCAN_OFF_3"
            printf 'step=%s outcome=%s\n' scan_off_4 "$O_SCAN_OFF_4"
            printf 'step=%s outcome=%s\n' scan_off_5 "$O_SCAN_OFF_5"
            printf 'step=%s outcome=%s\n' scan_off_bare "$O_SCAN_OFF_BARE"
            printf 'step=%s outcome=%s\n' timer_off_taskpolicy "$O_TIMER_OFF_TASKPOLICY"
            printf 'step=%s outcome=%s\n' scan_off_taskpolicy "$O_SCAN_OFF_TASKPOLICY"
            printf 'step=%s outcome=%s\n' coalesce_restore "$O_COALESCE_RESTORE"
            printf 'step=%s outcome=%s\n' sysctl_restored "$O_SYSCTL_RESTORED"
            printf 'step=%s outcome=%s\n' timer_restored "$O_TIMER_RESTORED"
            printf 'step=%s outcome=%s\n' scan_restored_1 "$O_SCAN_RESTORED_1"
            printf 'step=%s outcome=%s\n' scan_restored_2 "$O_SCAN_RESTORED_2"
          } > "$out/diag-summary.txt" || echo "the summary could not be written"
          cat "$out/diag-summary.txt" || true
          find "$out" -type f | sort > "$RUNNER_TEMP/diag1/files.txt" || true
          cp "$RUNNER_TEMP/diag1/files.txt" "$out/files.txt" || true

      - name: Leak check (no token or runner secret in the upload)
        id: leak
        if: always()
        run: if grep -r -l -E '(ghs|ghp|gho|ghu|ghr)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}' "$RUNNER_TEMP/diag1/out"; then echo "credential-like text found"; exit 1; fi

      - name: Upload everything the diagnostic recorded (always runs, after the leak check)
        if: always() && steps.leak.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g3h-diag1-macos
          path: ${{ runner.temp }}/diag1/out
          if-no-files-found: warn
          retention-days: 7

      - name: diag1, fail the job only when a prefix step failed (last step, after the upload; a probe or test outcome never fails the job)
        id: verdict
        if: always()
        env:
          O_CARGOBUILD: ${{ steps.cargobuild.outcome }}
        run: |
          failed=0
          for pair in "cargobuild=$O_CARGOBUILD"; do
            case "${pair#*=}" in success) ;; *) echo "the prefix step ${pair%%=*} did not succeed (${pair#*=}): the diagnostic steps that need it did not run"; failed=1 ;; esac
          done
          exit "$failed"
