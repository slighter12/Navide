          cat "$RUNNER_TEMP/diag1/out/scan-board-on-5.txt"
          echo "exit=$rc" | tee "$RUNNER_TEMP/diag1/out/scan-board-on-5.exit"
          exit "$rc"

      - name: diag1, the scan_board tests, once as the bare command (no wrapper, default threads) with coalescing as the runner has it (information only; it cannot fail the job)
        id: scan_on_bare
        if: ${{ !cancelled() && steps.cargobuild.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p "$RUNNER_TEMP/diag1/out"
          rc=0
          cargo test --locked --manifest-path native/navide-cli-runtime/Cargo.toml scan_board > "$RUNNER_TEMP/diag1/out/scan-board-on-bare.txt" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/diag1/out/scan-board-on-bare.txt"
          echo "exit=$rc" | tee "$RUNNER_TEMP/diag1/out/scan-board-on-bare.exit"
          exit "$rc"

      - name: diag1, try to switch timer coalescing off with sudo, guarded, the outcome is recorded (information only; it cannot fail the job)
        id: coalesce_off
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/diag1/out"
          {
            name=none
            for candidate in kern.timer.coalescing_enabled kern.timer_coalescing_enabled; do
              if sysctl -n "$candidate" > /dev/null 2>&1; then name="$candidate"; break; fi
            done
            echo "tried: kern.timer.coalescing_enabled kern.timer_coalescing_enabled"
            echo "name: $name"
            if [ "$name" = none ]; then
              echo "sysctl -w exit status: not attempted"
            else
              echo "before: $(sysctl -n "$name" 2>&1)"
              status=0
              sudo -n sysctl -w "$name=0" 2>&1 || status=$?
              echo "sysctl -w exit status: $status"
              echo "after: $(sysctl -n "$name" 2>&1)"
            fi
          } | tee "$RUNNER_TEMP/diag1/out/coalescing-switch.txt"

      - name: diag1, record the runner and the kern.timer sysctls after the switch (information only; it cannot fail the job)
