          exit "$rc"

      - name: diag1, the scan_board tests, run 4 of 5 with coalescing as the runner has it (the rehearsal's wrapper and thread count, no taskpolicy) (information only; it cannot fail the job)
        id: scan_on_4
        if: ${{ !cancelled() && steps.cargobuild.outcome == 'success' }}
