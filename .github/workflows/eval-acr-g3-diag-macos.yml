          echo "exit=$rc" | tee "$RUNNER_TEMP/diag1/out/scan-board-off-1.exit"
          exit "$rc"

      - name: diag1, the scan_board tests, run 2 of 5 after the switch (the rehearsal's wrapper and thread count, no taskpolicy) (information only; it cannot fail the job)
        id: scan_off_2
        if: ${{ !cancelled() && steps.cargobuild.outcome == 'success' }}
