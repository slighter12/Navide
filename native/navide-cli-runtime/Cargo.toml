[package]
name = "navide-cli-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "=1.0.150"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bin]]
name = "e5-windows-probe"
path = "tests/support/e5_windows_probe.rs"
required-features = ["windows-gates"]

[features]
# Test-only fault injection for the isolated harness build; never part of the product binary.
fault-hooks = []
windows-gates = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
