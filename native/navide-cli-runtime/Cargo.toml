[package]
name = "navide-cli-runtime"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde_json = "=1.0.150"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[features]
# Test-only fault injection for the isolated harness build; never part of the product binary.
fault-hooks = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
